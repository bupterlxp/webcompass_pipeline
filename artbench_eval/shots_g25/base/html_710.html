<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-in-1 Payment System Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .payment-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 30px;
    }
    .payment-btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 16px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-decoration: none;
      width: 100%;
    }
    .payment-btn:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }
    .payment-btn:active {
      transform: translateY(0);
    }
    .payment-btn i {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .status {
      margin-top: 40px;
      padding: 16px;
      background: #e9f7ef;
      border-radius: 8px;
      font-size: 14px;
      color: #28a745;
    }
    .status p {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>5-in-1 Payment System Demo</h1>
    <p>Select your preferred payment platform:</p>

    <div class="payment-grid">
      <!-- Meituan -->
      <button class="payment-btn" onclick="handlePayment('meituan')">
        <i>🍜</i>
        <strong>Meituan</strong>
      </button>

      <!-- JD -->
      <button class="payment-btn" onclick="handlePayment('jd')">
        <i>🛒</i>
        <strong>JD.com</strong>
      </button>

      <!-- Pinduoduo -->
      <button class="payment-btn" onclick="handlePayment('pinduoduo')">
        <i>📦</i>
        <strong>Pinduoduo</strong>
      </button>

      <!-- DiDi -->
      <button class="payment-btn" onclick="handlePayment('didi')">
        <i>🚗</i>
        <strong>DiDi</strong>
      </button>

      <!-- Ctrip -->
      <button class="payment-btn" onclick="handlePayment('ctrip')">
        <i>✈️</i>
        <strong>Ctrip</strong>
      </button>
    </div>

    <div class="status" id="status">
      <p>Payment status: <span id="status-text">Select a payment method</span></p>
    </div>
  </div>

  <script>
    function handlePayment(platform) {
      const statusText = document.getElementById('status-text');
      const statusDiv = document.getElementById('status');

      let message = '';

      switch (platform) {
        case 'meituan':
          message = "Redirecting to Meituan payment page...";
          break;
        case 'jd':
          message = "Redirecting to JD.com payment page...";
          break;
        case 'pinduoduo':
          message = "Redirecting to Pinduoduo payment page...";
          break;
        case 'didi':
          message = "Redirecting to DiDi payment page...";
          break;
        case 'ctrip':
          message = "Redirecting to Ctrip payment page...";
          break;
        default:
          message = "Invalid payment method selected.";
      }

      statusText.textContent = message;
      statusDiv.style.backgroundColor = '#e9f7ef';

      // Simulate redirect after 1.5 seconds
      setTimeout(() => {
        window.location.href = `https://www.${platform}.com/payment`;
      }, 1500);
    }
  </script>
</body>
</html>
