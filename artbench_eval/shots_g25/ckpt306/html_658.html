<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webpage Screenshot Tool</title>
<style>
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    max-width: 520px;
    margin: 40px auto;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    text-align: center;
  }
  h1 {
    margin: 0 0 16px;
    font-size: 28px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 24px;
    border-radius: 12px;
  }
  input[type="url"] {
    width: 100%;
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.3);
    color: #fff;
    text-align: center;
    font-family: inherit;
  }
  input[type="url"]::placeholder {
    color: rgba(255,255,255,0.6);
  }
  button {
    margin-top: 12px;
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #fff;
    color: #764ba2;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s, background 0.2s;
  }
  button:hover {
    background: #e8e8ff;
    transform: translateY(-1px);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #preview {
    margin-top: 20px;
    max-width: 1200px;
    height: 630px;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  #preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .error {
    color: #f07171;
    margin-top: 8px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🌐 Webpage Screenshot Tool</h1>
    <p>Enter a URL below and capture a thumbnail screenshot.</p>
    <form id="screenshotForm" onsubmit="event.preventDefault();">
      <input
        type="url"
        id="urlInput"
        placeholder="https://example.com"
        required
        autocomplete="off"
      />
      <button id="captureBtn" type="submit">📸 Capture & Download</button>
    </form>
    <div id="error" class="error"></div>
    <div id="preview">
      <img id="previewImg" alt="Screenshot preview" />
    </div>
  </div>

  <script>
    const form = document.getElementById('screenshotForm');
    const urlInput = document.getElementById('urlInput');
    const captureBtn = document.getElementById('captureBtn');
    const errorEl = document.getElementById('error');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const url = urlInput.value.trim();
      if (!url) {
        errorEl.textContent = 'Please enter a valid URL.';
        urlInput.focus();
        return;
      }
      if (!/^https?:\/\//i.test(url)) {
        errorEl.textContent = 'URL must start with http:// or https://';
        return;
      }

      captureBtn.disabled = true;
      captureBtn.textContent = 'Capturing…';

      try {
        const response = await fetch(`http://localhost:3001/${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error('Server returned ' + response.status);

        const blob = await response.blob();
        const urlStr = URL.createObjectURL(blob);
        previewImg.src = urlStr;
        preview.style.display = 'block';

        // Trigger download
        const a = document.createElement('a');
        a.href = urlStr;
        a.download = `screenshot-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(urlStr), 2000);

        urlInput.value = '';
      } catch (err) {
        errorEl.textContent = 'Failed to capture: ' + err.message;
      } finally {
        captureBtn.disabled = false;
        captureBtn.textContent = '📸 Capture & Download';
      }
    });
  </script>
<script>/* script.js not found in result */</script>
</body>
</html>
