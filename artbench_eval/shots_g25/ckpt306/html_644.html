<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometric Calculator</title>
<style>
  :root { --accent: #4a6cf7; --accent-2: #0ea5e9; --bg: #f6f8fc; --surface: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #e0ecff 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #d6f5e8 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .app { flex: 1; display: grid; grid-template-columns: 340px 1px 1fr; min-height: 0; }
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
  }
  .sidebar h2 { margin: 0 0 16px; font-size: 18px; color: var(--text); }
  .shape-group { margin-bottom: 20px; }
  .shape-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .shape-group input[type="number"], .shape-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .shape-group input:focus, .shape-group select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
  }
  .shape-group input.invalid { border-color: var(--danger); }
  .shape-group input.valid { border-color: #10b981; }
  .shape-group .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .shape-group .hint strong { color: var(--accent-2); }
  .sidebar .actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn {
    flex: 1;
    padding: 11px 14px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #f1f5f9; border-color: #cbd5e1; }
  .sidebar .formula-toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .formula-toggle label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .formula-toggle input { accent-color: var(--accent); cursor: pointer; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .toolbar {
    padding: 16px 24px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .logo-mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    color: #fff;
    font-size: 20px;
    box-shadow: 0 6px 16px rgba(74,108,247,0.35);
  }
  .toolbar .subtitle { color: var(--muted); font-size: 14px; }
  .toolbar .controls { display: flex; gap: 8px; }
  .chip {
    padding: 6px 12px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar .hint { color: var(--muted); font-size: 13px; }

  .canvas-wrap {
    flex: 1;
    position: relative;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-height: 400px;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .results {
    padding: 20px 24px;
    background: #fff;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .results h3 { margin: 0 0 12px; font-size: 16px; color: var(--text); }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .result-card {
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    transition: border-color 0.2s, transform 0.2s;
  }
  .result-card:hover { border-color: var(--accent); }
  .result-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .result-value { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .result-value small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }

  .formula-section { display: none; }
  .formula-section.show { display: block; }
  .formula-section h4 { margin: 0 0 10px; font-size: 14px; color: var(--text); }
  .formula { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: var(--text); background: #f8fafc; padding: 10px 12px; border-radius: 8px; border-left: 3px solid var(--accent); }
  .formula strong { color: var(--accent-2); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    .shape-group { margin-bottom: 16px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="shape-group">
      <h2>Choose Shape</h2>
      <label>Figure</label>
      <div id="shapeSelect" class="shape-select"></div>
    </div>

    <div class="shape-group" id="triangleGroup" style="display:none;">
      <label>Side lengths (in cm)</label>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="number" id="t-a" step="0.01" min="0" placeholder="a" value="5">
        <input type="number" id="t-b" step="0.01" min="0" placeholder="b" value="5">
        <input type="number" id="t-c" step="0.01" min="0" placeholder="c" value="5">
      </div>
      <div class="hint">Must satisfy triangle inequality.</div>
    </div>

    <div class="shape-group" id="polygonGroup" style="display:none;">
      <label>Number of sides</label>
      <select id="polySides">
        <option value="3">Triangle (3)</option>
        <option value="4">Square (4)</option>
        <option value="5">Pentagon (5)</option>
        <option value="6">Hexagon (6)</option>
        <option value="7">Heptagon (7)</option>
        <option value="8">Octagon (8)</option>
        <option value="9">Nonagon (9)</option>
        <option value="10">Decagon (10)</option>
        <option value="11">Hendecagon (11)</option>
        <option value="12">Dodecagon (12)</option>
      </select>
      <label>Side length (cm)</label>
      <input type="number" id="polySide" step="0.01" min="0" placeholder="side" value="4">
    </div>

    <div class="shape-group" id="circleGroup" style="display:none;">
      <label>Radius (cm)</label>
      <input type="number" id="c-radius" step="0.01" min="0" placeholder="r" value="5">
    </div>

    <div class="shape-group" id="rectangleGroup" style="display:none;">
      <label>Length (cm)</label>
      <input type="number" id="r-length" step="0.01" min="0" placeholder="l" value="6">
      <label>Width (cm)</label>
      <input type="number" id="r-width" step="0.01" min="0" placeholder="w" value="4">
    </div>

    <div class="shape-group" id="sphereGroup" style="display:none;">
      <label>Radius (cm)</label>
      <input type="number" id="s-radius" step="0.01" min="0" placeholder="r" value="5">
    </div>

    <div class="shape-group" id="cylinderGroup" style="display:none;">
      <label>Base radius (cm)</label>
      <input type="number" id="cy-radius" step="0.01" min="0" placeholder="r" value="3">
      <label>Height (cm)</label>
      <input type="number" id="cy-height" step="0.01" min="0" placeholder="h" value="8">
    </div>

    <div class="shape-group" id="coneGroup" style="display:none;">
      <label>Base radius (cm)</label>
      <input type="number" id="co-radius" step="0.01" min="0" placeholder="r" value="3">
      <label>Height (cm)</label>
      <input type="number" id="co-height" step="0.01" min="0" placeholder="h" value="7">
    </div>

    <div class="shape-group" id="prismGroup" style="display:none;">
      <label>Base length (cm)</label>
      <input type="number" id="pr-base" step="0.01" min="0" placeholder="l" value="4">
      <label>Base width (cm)</label>
      <input type="number" id="pr-width" step="0.01" min="0" placeholder="w" value="3">
      <label>Height (cm)</label>
      <input type="number" id="pr-height" step="0.01" min="0" placeholder="h" value="6">
    </div>

    <div class="formula-toggle">
      <label>Show formulas</label>
      <input type="checkbox" id="showFormulas" checked>
    </div>

    <div class="actions">
      <button class="btn btn-ghost" id="resetBtn">Reset</button>
      <button class="btn btn-primary" id="calcBtn">Calculate</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Toolbar -->
    <header class="toolbar">
      <div class="logo"><span class="logo-mark">📐</span> Geometric Calculator</div>
      <div class="subtitle">Interactive area, perimeter, volume & surface area tool</div>
      <div class="controls">
        <div class="chip active" data-chip="area">Area</div>
        <div class="chip" data-chip="perimeter">Perimeter</div>
        <div class="chip" data-chip="volume">Volume</div>
        <div class="chip" data-chip="surface">Surface Area</div>
      </div>
      <div class="hint" id="hintText">Enter parameters on the left to begin.</div>
    </header>

    <!-- Canvas -->
    <section class="canvas-wrap" id="canvasWrap">
      <canvas id="preview"></canvas>
      <div class="canvas-empty" id="canvasEmpty">
        <div style="text-align:center;padding:60px 20px;color:var(--muted);">
          <div style="font-size:48px;margin-bottom:12px;">∅</div>
          <div style="font-size:16px;font-weight:600;">Select a shape</div>
          <div style="font-size:13px;">Enter parameters on the left to visualize here.</div>
        </div>
      </div>
    </section>

    <!-- Results -->
    <section class="results">
      <h3 id="shapeName">Shape</h3>
      <div class="result-grid" id="resultGrid"></div>
      <div class="formula-section" id="formulaSection">
        <h4>Formulas</h4>
        <div id="formulaList"></div>
      </div>
    </section>

  </main>

</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------- Shape definitions ----------
const SHAPES = {
  circle: { label: 'Circle', group: 'circleGroup', inputs: ['c-radius'], params: ['r'], formulas: { area: 'A = πr²', perimeter: 'P = 2πr', volume: 'Not applicable', surface: 'Not applicable' } },
  triangle: { label: 'Triangle', group: 'triangleGroup', inputs: ['t-a','t-b','t-c'], params: ['a','b','c'], formulas: { area: 'A = √[s(s−a)(s−b)(s−c)] (Heron)', perimeter: 'P = a + b + c', volume: 'Not applicable', surface: 'Not applicable' } },
  polygon: { label: 'Regular Polygon', group: 'polygonGroup', inputs: ['polySides','polySide'], params: ['n','s'], formulas: { area: 'A = (n·s²)/(4·tan(π/n))', perimeter: 'P = n·s', volume: 'Not applicable', surface: 'Not applicable' } },
  rectangle: { label: 'Rectangle', group: 'rectangleGroup', inputs: ['r-length','r-width'], params: ['l','w'], formulas: { area: 'A = l·w', perimeter: 'P = 2(l + w)', volume: 'Not applicable', surface: 'Not applicable' } },
  sphere: { label: 'Sphere', group: 'sphereGroup', inputs: ['s-radius'], params: ['r'], formulas: { area: 'A = 4πr²', perimeter: 'Not applicable', volume: 'V = (4/3)πr³', surface: 'A = 4πr²' } },
  cylinder: { label: 'Cylinder', group: 'cylinderGroup', inputs: ['cy-radius','cy-height'], params: ['r','h'], formulas: { area: 'A = 2πr(h + r)', perimeter: 'Not applicable', volume: 'V = πr²h', surface: 'A = 2πr(h + r)' } },
  cone: { label: 'Cone', group: 'coneGroup', inputs: ['co-radius','co-height'], params: ['r','h'], formulas: { area: 'A = πr(r + √(r² + h²))', perimeter: 'Not applicable', volume: 'V = (1/3)πr²h', surface: 'A = πr(r + √(r² + h²))' } },
  prism: { label: 'Rectangular Prism', group: 'prismGroup', inputs: ['pr-base','pr-width','pr-height'], params: ['l','w','h'], formulas: { area: 'A = 2(lw + lh + wh)', perimeter: 'Not applicable', volume: 'V = l·w·h', surface: 'A = 2(lw + lh + wh)' } }
};

const CHIPS = ['area','perimeter','volume','surface'];

// ---------- State ----------
const state = {
  shape: 'circle',
  params: {},
  results: { area: 0, perimeter: 0, volume: 0, surface: 0 },
  formulas: {}
};

// ---------- DOM ----------
const $ = (id) => document.getElementById(id);
const canvas = $('preview');
const ctx = canvas.getContext('2d');
const canvasWrap = $('canvasWrap');
const canvasEmpty = $('canvasEmpty');
const shapeSelect = $('shapeSelect');
const resultGrid = $('resultGrid');
const formulaList = $('formulaList');
const showFormulas = $('showFormulas');
const toast = $('toast');

// ---------- Build UI ----------
Object.keys(SHAPES).forEach((key) => {
  const sh = SHAPES[key];
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = sh.label;
  shapeSelect.appendChild(opt);
});

// ---------- Helpers ----------
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}

function validateInputs() {
  const sh = SHAPES[state.shape];
  let ok = true;
  sh.inputs.forEach(id => {
    const el = document.getElementById(id);
    const val = parseFloat(el.value);
    const valid = !isNaN(val) && val >= 0;
    el.classList.toggle('valid', valid);
    el.classList.toggle('invalid', !valid);
    if (!valid) ok = false;
  });
  return ok;
}

function parseParams() {
  const sh = SHAPES[state.shape];
  const params = {};
  sh.inputs.forEach(id => {
    const val = parseFloat(document.getElementById(id).value);
    params[sh.params[sh.inputs.indexOf(id)]] = val;
  });
  return params;
}

function compute(shapeKey, params) {
  const sh = SHAPES[shapeKey];
  const { area, perimeter, volume, surface } = sh.formulas;
  let out = { area: 0, perimeter: 0, volume: 0, surface: 0 };

  if (shapeKey === 'circle') {
    const r = params.r;
    out.area = Math.PI * r * r;
    out.perimeter = 2 * Math.PI * r;
  } else if (shapeKey === 'triangle') {
    const a = params.a, b = params.b, c = params.c;
    const s = (a + b + c) / 2;
    const area = Math.sqrt(s * (s - a) * (s - b) * (s - c));
    out.area = area;
    out.perimeter = a + b + c;
  } else if (shapeKey === 'polygon') {
    const n = params.n, s = params.s;
    out.area = (n * s * s) / (4 * Math.tan(Math.PI / n));
    out.perimeter = n * s;
  } else if (shapeKey === 'rectangle') {
    const l = params.l, w = params.w;
    out.area = l * w;
    out.perimeter = 2 * (l + w);
  } else if (shapeKey === 'sphere') {
    const r = params.r;
    out.area = 4 * Math.PI * r * r;
    out.volume = (4/3) * Math.PI * r * r * r;
    out.surface = 4 * Math.PI * r * r;
  } else if (shapeKey === 'cylinder') {
    const r = params.r, h = params.h;
    out.area = 2 * Math.PI * r * (h + r);
    out.volume = Math.PI * r * r * h;
    out.surface = 2 * Math.PI * r * (h + r);
  } else if (shapeKey === 'cone') {
    const r = params.r, h = params.h;
    const slant = Math.sqrt(r * r + h * h);
    out.area = Math.PI * r * (r + slant);
    out.volume = (1/3) * Math.PI * r * r * h;
    out.surface = Math.PI * r * (r + slant);
  } else if (shapeKey === 'prism') {
    const l = params.l, w = params.w, h = params.h;
    out.area = 2 * (l * w + l * h + w * h);
    out.volume = l * w * h;
    out.surface = 2 * (l * w + l * h + w * h);
  }

  return out;
}

function renderResults() {
  const sh = SHAPES[state.shape];
  const params = parseParams();
  const vals = compute(state.shape, params);
  state.results = vals;

  resultGrid.innerHTML = '';
  const chipMap = {
    area: 'Area',
    perimeter: 'Perimeter',
    volume: 'Volume',
    surface: 'Surface Area'
  };
  CHIPS.forEach(chip => {
    const val = vals[chip];
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-label">${chipMap[chip]}</div>
      <div class="result-value">${val.toFixed(2)} cm²</div>
    `;
    resultGrid.appendChild(card);
  });
}

function renderFormulas() {
  const sh = SHAPES[state.shape];
  const show = showFormulas.checked;
  const list = document.getElementById('formulaList');
  list.innerHTML = '';
  Object.entries(sh.formulas).forEach(([key, formula]) => {
    const li = document.createElement('div');
    li.className = 'formula';
    li.innerHTML = `<strong>${key}:</strong> ${formula}`;
    list.appendChild(li);
  });
  $('formulaSection').classList.toggle('show', show);
}

function renderPreview() {
  const sh = SHAPES[state.shape];
  const params = parseParams();
  const chip = document.querySelector('.chip.active');
  const chipKey = chip ? chip.dataset.chip : 'area';

  const W = canvasWrap.clientWidth;
  const H = canvasWrap.clientHeight;
  const scale = Math.min(W / 400, H / 400) * 0.9;
  const pad = 40;
  const cx = W / 2;
  const cy = H / 2;
  const maxR = Math.min(W, H) / 2 - pad;

  ctx.clearRect(0, 0, W, H);

  // Background grid
  ctx.save();
  ctx.strokeStyle = 'rgba(148,163,184,0.15)';
  ctx.lineWidth = 1;
  const gridStep = 20;
  for (let x = -maxR; x <= maxR; x += gridStep) {
    ctx.beginPath();
    ctx.moveTo(cx + x, pad);
    ctx.lineTo(cx + x, H - pad);
    ctx.stroke();
  }
  for (let y = pad; y <= H - pad; y += gridStep) {
    ctx.beginPath();
    ctx.moveTo(pad, cy + y);
    ctx.lineTo(W - pad, cy + y);
    ctx.stroke();
  }
  ctx.restore();

  // Draw shape
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  const draw = {
    circle: () => {
      const r = params.r;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#4a6cf7';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(74,108,247,0.12)';
      ctx.fill();
      // Label
      ctx.fillStyle = '#1e293b';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('r', 0, r + 6);
    },
    triangle: () => {
      const a = params.a, b = params.b, c = params.c;
      const s = (a + b + c) / 2;
      const area = Math.sqrt(s * (s - a) * (s - b) * (s - c));
      const angleB = Math.acos((a*a + c*c - b*b) / (2*a*c));
      const angleC = Math.acos((a*a + b*b - c*c) / (2*a*b));
      const angleA = Math.PI - angleB - angleC;
      const h = c * Math.sin(angleA);
      const x = (a * Math.cos(angleA)) + (b * Math.cos(angleC));
      const y = (a * Math.sin(angleA)) + (b * Math.sin(angleC));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(x, y);
      ctx.lineTo(b * Math.cos(angleC), b * Math.sin(angleC));
      ctx.closePath();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(14,165,233,0.12)';
      ctx.fill();
      // Labels
      ctx.fillStyle = '#1e293b';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('a', x/2, y/2 + 4);
      ctx.fillText('b', b*Math.cos(angleC)/2, b*Math.sin(angleC)/2 + 4);
      ctx.fillText('c', x/2, y/2 + 4);
    },
    polygon: () => {
      const n = params.n, s = params.s;
      const R = s / (2 * Math.sin(Math.PI / n));
      const pts = [];
      for (let i = 0; i < n; i++) {
        pts.push({ x: Math.cos(i * Math.PI * 2 / n) * R, y: Math.sin(i * Math.PI * 2 / n) * R });
      }
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(14,165,233,0.12)';
      ctx.fill();
      // Center label
      ctx.fillStyle = '#1e293b';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('n=' + n, 0, 0);
    },
    rectangle: () => {
      const l = params.l, w = params.w;
      ctx.strokeRect(-l/2, -w/2, l, w);
      ctx.fillRect(-l/2, -w/2, l, w);
      ctx.fillStyle = 'rgba(74,108,247,0.12)';
      ctx.fill();
      // Labels
      ctx.fillStyle = '#1e293b';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('l', 0, w/2 + 4);
      ctx.fillText('w', l/2 + 4, 0);
    },
    sphere: () => {
      const r = params.r;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#4a6cf7';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(74,108,247,0.12)';
      ctx.fill();
      // Labels
      ctx.fillStyle = '#1e293b';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('r', 0, r + 6);
    },
    cylinder: () => {
      const r = params.r, h = params.h;
      ctx.save();
      ctx.translate(0, -h/2);
      ctx.scale(1, 0.6);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2;
      ctx.strokeRect(-r, -h/2, r*2, h);
      ctx.fillStyle = 'rgba(14,165,233,0.12)';
      ctx.fillRect(-r, -h/2, r*2, h);
      // Labels
      ctx.fillStyle = '#1e293b';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('r', 0, -h/2 + 4);
      ctx.fillText('h', 0, h/2 + 4);
    },
    cone: () => {
      const r = params.r, h = params.h;
      const slant = Math.sqrt(r*r + h*h);
      ctx.save();
      ctx.translate(0, -h/2);
      ctx.beginPath();
      ctx.moveTo(-r, 0);
      ctx.lineTo(0, slant);
      ctx.lineTo(r, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = 'rgba(14,165,233,0.12)';
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
      // Labels
      ctx.fillStyle = '#1e293b';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('r', 0, r + 6);
      ctx.fillText('h', 0, -h/2 + 4);
    },
    prism: () => {
      const l = params.l, w = params.w, h = params.h;
      const x = -l/2, y = -w/2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + l, y + h);
      ctx.lineTo(x + l, y);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = 'rgba(74,108,247,0.12)';
      ctx.fill();
      // Labels
      ctx.fillStyle = '#1e293b';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('l', x + l/2, y + h/2);
      ctx.fillText('w', x + l/2, y + h/2);
      ctx.fillText('h', x + l/2, y + h/2);
    }
  };

  if (draw[state.shape]) draw[state.shape]();
  ctx.restore();

  // Dimension label
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#1e293b';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.shape.toUpperCase(), 0, 0);
  ctx.restore();
}

function renderAll() {
  renderPreview();
  renderResults();
  renderFormulas();
}

// ---------- Events ----------
shapeSelect.addEventListener('change', (e) => {
  const key = e.target.value;
  state.shape = key;
  Object.keys(SHAPES).forEach(k => {
    const group = document.getElementById(SHAPES[k].group);
    group.style.display = k === key ? '' : 'none';
  });
  canvasEmpty.style.display = 'none';
  canvas.style.display = '';
  renderAll();
});

CHIPS.forEach(chip => {
  document.querySelector(`.chip[data-chip="${chip}"]`).addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    document.querySelector(`.chip[data-chip="${chip}"]`).classList.add('active');
  });
});

document.getElementById('calcBtn').addEventListener('click', () => {
  if (!validateInputs()) {
    showToast('Please enter valid non-negative dimensions.');
    return;
  }
  renderAll();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(SHAPES).forEach(k => {
    const group = document.getElementById(SHAPES[k].group);
    group.style.display = 'none';
  });
  state.shape = 'circle';
  shapeSelect.value = 'circle';
  document.getElementById('c-radius').value = 5;
  canvasEmpty.style.display = '';
  canvas.style.display = 'none';
  renderAll();
});

showFormulas.addEventListener('change', renderFormulas);

// Input validation on blur
['c-radius','t-a','t-b','t-c','polySide','polySides','r-length','r-width','s-radius','cy-radius','cy-height','co-radius','co-height','pr-base','pr-width','pr-height'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('blur', () => {
    if (el.value === '' || el.value === '0') {
      el.classList.remove('valid','invalid');
    } else {
      const val = parseFloat(el.value);
      const ok = !isNaN(val) && val >= 0;
      el.classList.toggle('valid', ok);
      el.classList.toggle('invalid', !ok);
    }
  });
});

// Resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderAll, 100);
});

// Initial
renderAll();
</script>

</body>
</html>
