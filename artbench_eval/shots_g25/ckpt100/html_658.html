<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Screenshot Tool</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
  }
  h1 {
    margin: 0 0 20px;
    font-size: 28px;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(8px);
    padding: 24px;
    border-radius: 12px;
  }
  input[type="url"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: #fff;
    margin-bottom: 12px;
    font-family: inherit;
  }
  input[type="url"]::placeholder {
    color: rgba(255,255,255,0.7);
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #fff;
    color: #1e3a8a;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  button:hover { background: #f0f4ff; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result {
    margin-top: 24px;
    text-align: center;
  }
  .result img {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .status {
    color: #4ade80;
    font-weight: 600;
  }
  .error {
    color: #fca5a5;
  }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>🌐 Web Screenshot Tool</h1>
    <p class="status">Enter a URL and click <strong>Generate</strong> to capture a thumbnail.</p>
    <form id="screenshotForm" onsubmit="event.preventDefault(); capture();">
      <label for="urlInput">Website URL</label>
      <input type="url" id="urlInput" placeholder="https://example.com" required />
      <button id="captureBtn" type="submit">Generate Thumbnail</button>
    </form>
    <div class="result" id="result" hidden>
      <p class="status">Capturing…</p>
      <div class="spinner" id="spinner"></div>
    </div>
    <div class="result" id="success" hidden>
      <p class="status">✅ Screenshot ready!</p>
      <img id="thumbnail" alt="Webpage thumbnail" />
      <button id="downloadBtn">Download PNG</button>
    </div>
    <div class="result" id="error" hidden>
      <p class="error">❌ Something went wrong.</p>
    </div>
  </div>

  <script>
    const API_KEY = 'YOUR_WEBSHOT_API_KEY'; // Get free key at https://webshot.io
    const form = document.getElementById('screenshotForm');
    const urlInput = document.getElementById('urlInput');
    const captureBtn = document.getElementById('captureBtn');
    const result = document.getElementById('result');
    const success = document.getElementById('success');
    const error = document.getElementById('error');
    const spinner = document.getElementById('spinner');
    const thumbnail = document.getElementById('thumbnail');
    const downloadBtn = document.getElementById('downloadBtn');

    function capture() {
      const url = urlInput.value.trim();
      if (!url) {
        urlInput.focus();
        return;
      }

      captureBtn.disabled = true;
      result.hidden = false;
      success.hidden = true;
      error.hidden = true;

      fetch(`https://api.webshot.io/v1/screenshot?api_key=${API_KEY}&url=${encodeURIComponent(url)}`)
        .then(res => {
          if (!res.ok) throw new Error('Network response was not ok');
          return res.json();
        })
        .then(data => {
          if (data.error) throw new Error(data.error);

          const img = document.createElement('img');
          img.src = data.url;
          img.alt = `Screenshot of ${url}`;
          thumbnail.src = img.src;
          thumbnail.onload = () => {
            success.hidden = false;
            result.hidden = true;
            downloadBtn.disabled = false;
          };
        })
        .catch(err => {
          error.hidden = false;
          result.hidden = false;
          console.error(err);
        })
        .finally(() => {
          captureBtn.disabled = false;
        });
    }

    downloadBtn.addEventListener('click', () => {
      const img = thumbnail;
      const link = document.createElement('a');
      link.href = img.src;
      link.download = 'screenshot.png';
      link.click();
    });

    // Allow Enter key in input
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        capture();
      }
    });
  </script>
<script>/* script.js not found in result */</script>
<script>/* script.js not found in result */</script>
</body>
</html>
