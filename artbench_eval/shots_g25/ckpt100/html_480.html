<!DOCTYPE html>
<html>
<head><title>Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
  <div class="container">
    <div class="card">
      <h2>Login</h2>
      <form method="POST">
        {{ form.hidden_tag() }}
        <div class="field">
          <label for="{{ form.username.id }}">{{ form.username.label.text }}</label>
          {{ form.username(class="input") }}
          {% for err in form.username.errors %}<div class="error">{{ err }}</div>{% endfor %}
        </div>
        <div class="field">
          <label for="{{ form.password.id }}">{{ form.password.label.text }}</label>
          {{ form.password(class="input") }}
          {% for err in form.password.errors %}<div class="error">{{ err }}</div>{% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
      <p class="link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
  </div>
</body>
</html>
