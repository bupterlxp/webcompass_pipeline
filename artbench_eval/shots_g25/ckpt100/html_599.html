<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BattleGround — Multiplayer Shooting</title>
<style>* { box-sizing: border-box; }

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: linear-gradient(135deg, #2a0a3d, #4a1a6d);
  color: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0.5px;
}
.logo { font-size: 28px; }

.stats { display: flex; gap: 16px; }
.stat { display: flex; flex-direction: column; }
.stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
.stat .value { font-size: 18px; font-weight: bold; }

.layout {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  gap: 20px;
}

.panel {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}

.panel-left h2 { margin: 0 0 12px; font-size: 16px; }
.panel-left label { display: block; margin: 10px 0; }
.panel-left label span { display: block; font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.panel-left input {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}
.panel-left .btn-primary {
  width: 100%;
  padding: 12px;
  background: #e94560;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}
.panel-left .btn-primary:hover { background: #c93a52; }
.panel-left .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

.hint { font-size: 12px; color: #666; margin: 8px 0 0; }

#game {
  display: block;
  width: 100%;
  height: auto;
  max-height: 600px;
  background: #1a1a1a;
  border-radius: 10px;
  cursor: crosshair;
}

.hud {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  gap: 16px;
  padding: 10px 14px;
  background: rgba(0,0,0,0.55);
  border-radius: 8px;
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  z-index: 10;
}
.hud-item { display: flex; flex-direction: column; align-items: flex-end; }
.hud-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
.hud-value { font-size: 16px; font-weight: bold; }

.widget { margin-bottom: 16px; }
.widget h3 {
  margin: 0 0 10px;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #2a0a3d;
}
.scoreboard, .chat {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 280px;
  overflow-y: auto;
  font-family: 'Segoe UI', sans-serif;
}
.scoreboard li, .chat li {
  padding: 6px 8px;
  border-bottom: 1px solid #eee;
  display: flex;
  gap: 10px;
  align-items: center;
}
.scoreboard li:last-child { border-bottom: none; }
.scoreboard li strong { color: #2a0a3d; }
.scoreboard li span { color: #555; font-size: 13px; }
.chat li { font-size: 13px; }
.chat li .name { color: #2a0a3d; font-weight: bold; }
.chat li .msg { color: #333; }

#chatForm { display: flex; gap: 8px; margin-top: 8px; }
#chatInput {
  flex: 1;
  padding: 8px 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
}
#chatInput:focus { outline: none; border-color: #c93a52; }
.btn-send {
  padding: 8px 14px;
  background: #e94560;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.btn-send:hover { background: #c93a52; }

.footer {
  text-align: center;
  color: #666;
  font-size: 12px;
}

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .panel-left, .panel-right { order: -1; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚔</span>
      <h1>BattleGround</h1>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="label">Players</span>
        <span class="value" id="playerCount">0</span>
      </div>
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="panel panel-left">
      <h2>Join Game</h2>
      <label>
        <span>Player Name</span>
        <input id="playerName" placeholder="Enter your name" maxlength="12" />
      </label>
      <button id="joinBtn" class="btn-primary">Join Game</button>
      <p class="hint">Use WASD to move, SPACE to shoot</p>
    </div>

    <div class="panel panel-main">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="hud" class="hud">
        <div class="hud-item">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="hudScore">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Health</span>
          <span class="hud-value" id="hudHealth">100</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Ammo</span>
          <span class="hud-value" id="hudAmmo">30</span>
        </div>
      </div>
    </div>

    <div class="panel panel-right">
      <div class="widget">
        <h3>Scoreboard</h3>
        <ul id="scoreboard" class="scoreboard"></ul>
      </div>
      <div class="widget">
        <h3>Chat</h3>
        <ul id="chat" class="chat"></ul>
        <form id="chatForm">
          <input id="chatInput" placeholder="Type a message..." maxlength="140" />
          <button type="submit" class="btn-send">Send</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="footer">
    <small>Local multiplayer demo · No backend required</small>
  </footer>
</div>

<script>(() => {
  'use strict';

  // ---------- Constants ----------
  const MAP_W = 800, MAP_H = 600;
  const PLAYER_SIZE = 24;
  const PLAYER_SPEED = 280;
  const PLAYER_ROTATE = 400;
  const BULLET_SPEED = 550;
  const BULLET_LIFE = 1800;
  const FIRE_COOLDOWN = 400;
  const MAX_PLAYERS = 4;
  const MAX_BULLETS = 200;
  const MAX_CHAT = 50;

  // ---------- State ----------
  const state = {
    players: [],          // {id, name, x, y, r, color, hp, ammo, score, angle}
    bullets: [],          // {id, x, y, vx, vy, life, owner}
    chat: [],             // {id, name, msg, time}
    score: 0,
    health: 100,
    ammo: 30,
    cooldown: 0,
    turn: 0,
    ready: false,
    winner: null,
    lastTick: 0,
  };

  // ---------- DOM ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const playerNameInput = document.getElementById('playerName');
  const joinBtn = document.getElementById('joinBtn');
  const playerCountEl = document.getElementById('playerCount');
  const scoreEl = document.getElementById('score');
  const hudScore = document.getElementById('hudScore');
  const hudHealth = document.getElementById('hudHealth');
  const hudAmmo = document.getElementById('hudAmmo');
  const scoreboardEl = document.getElementById('scoreboard');
  const chatEl = document.getElementById('chat');
  const chatInput = document.getElementById('chatInput');
  const chatForm = document.getElementById('chatForm');

  // ---------- Helpers ----------
  function randColor() {
    const c = '#';
    const r = Math.floor(Math.random() * 16777215);
    return '#' + r.toString(16).padStart(6, '0');
  }

  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function angleFromTo(x1, y1, x2, y2) {
    return Math.atan2(y2 - y1, x2 - x1);
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY,
    };
  }

  function formatTime(ms) {
    if (ms < 1000) return ms + 'ms';
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    return m + 'm' + (s % 60) + 's';
  }

  function formatScore(n) {
    if (n < 1000) return n;
    if (n < 10000) return (n / 1000).toFixed(1) + 'k';
    return (n / 1000).toFixed(0) + 'k';
  }

  // ---------- Storage ----------
  function loadPlayer(name) {
    try {
      const data = localStorage.getItem('bg_player_' + name);
      if (!data) return null;
      return JSON.parse(data);
    } catch (e) { return null; }
  }
  function savePlayer(name, data) {
    try { localStorage.setItem('bg_player_' + name, JSON.stringify(data)); } catch (e) {}
  }

  // ---------- Game Loop ----------
  function loop(now) {
    const dt = Math.min(100, now - state.lastTick);
    state.lastTick = now;
    state.cooldown = Math.max(0, state.cooldown - dt);

    // Update bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.life -= dt;
      if (b.life <= 0) { state.bullets.splice(i, 1); continue; }
      b.x += b.vx * (dt / 16);
      b.y += b.vy * (dt / 16);
      // Remove off-screen
      if (b.x < -20 || b.x > MAP_W + 20 || b.y < -20 || b.y > MAP_H + 20) {
        state.bullets.splice(i, 1);
        continue;
      }
      // Remove if hit something
      if (hitBullet(b)) {
        state.bullets.splice(i, 1);
        continue;
      }
    }

    // Update players
    for (let i = state.players.length - 1; i >= 0; i--) {
      const p = state.players[i];
      if (!p.alive) continue;
      if (p.id === state.turn) {
        p.x += Math.cos(p.angle) * PLAYER_SPEED * (dt / 16);
        p.y += Math.sin(p.angle) * PLAYER_SPEED * (dt / 16);
        // Keep inside
        p.x = clamp(p.x, PLAYER_SIZE, MAP_W - PLAYER_SIZE);
        p.y = clamp(p.y, PLAYER_SIZE, MAP_H - PLAYER_SIZE);
      }
      // Check collisions
      for (let j = 0; j < state.players.length; j++) {
        if (i === j || !state.players[j].alive) continue;
        const d = dist(p.x, p.y, state.players[j].x, state.players[j].y);
        if (d < PLAYER_SIZE * 2) {
          const dx = p.x - state.players[j].x;
          const dy = p.y - state.players[j].y;
          const nx = dx / d, ny = dy / d;
          p.x -= nx * PLAYER_SIZE;
          p.y -= ny * PLAYER_SIZE;
          state.players[j].x += nx * PLAYER_SIZE;
          state.players[j].y += ny * PLAYER_SIZE;
        }
      }
    }

    // Draw
    draw();

    // Check winner
    if (state.winner) {
      setTimeout(() => {
        state.winner = null;
        state.score = 0;
        state.health = 100;
        state.ammo = 30;
        state.players = [];
        state.bullets = [];
        state.chat = [];
        state.turn = 0;
        state.ready = false;
        renderUI();
      }, 2500);
    }

    requestAnimationFrame(loop);
  }

  // ---------- Rendering ----------
  function draw() {
    ctx.clearRect(0, 0, MAP_W, MAP_H);

    // Background
    const bg = ctx.createLinearGradient(0, 0, 0, MAP_H);
    bg.addColorStop(0, '#1a1a1a');
    bg.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, MAP_W, MAP_H);

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= MAP_W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, MAP_H);
      ctx.stroke();
    }
    for (let y = 0; y <= MAP_H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(MAP_W, y);
      ctx.stroke();
    }

    // Bullets
    ctx.fillStyle = '#fff';
    for (const b of state.bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Players
    for (const p of state.players) {
      if (!p.alive) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
      ctx.restore();
    }

    // Hit markers
    ctx.fillStyle = 'rgba(255, 20, 60, 0.7)';
    for (const b of state.bullets) {
      if (b.life < 500 && b.life > 0) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- Input ----------
  function handleInput(keys) {
    const p = state.players.find(x => x.id === state.turn);
    if (!p) return;
    p.angle = keys.right - keys.left;
    if (keys.up) p.angle = clamp(p.angle, 0, Math.PI * 2);
    if (keys.down) p.angle = clamp(p.angle, -Math.PI, 0);
    if (keys.fire && state.cooldown <= 0) {
      fireBullet(p);
      state.cooldown = FIRE_COOLDOWN;
    }
  }

  function fireBullet(p) {
    if (p.ammo <= 0) return;
    p.ammo--;
    state.bullets.push({
      id: 'b' + Date.now(),
      x: p.x,
      y: p.y,
      vx: Math.cos(p.angle) * BULLET_SPEED,
      vy: Math.sin(p.angle) * BULLET_SPEED,
      life: BULLET_LIFE,
      owner: p.id,
    });
  }

  function hitBullet(b) {
    for (const p of state.players) {
      if (!p.alive) continue;
      if (p.id === b.owner) continue;
      if (dist(b.x, b.y, p.x, p.y) < PLAYER_SIZE) {
        p.hp -= 20;
        if (p.hp <= 0) {
          p.alive = false;
          p.hp = 0;
          state.score += 10;
          state.health = Math.max(0, state.health - 10);
          if (state.health <= 0) {
            state.health = 0;
            state.winner = state.players.find(x => x.id !== p.id);
          }
          renderUI();
          return true;
        }
        renderUI();
        return true;
      }
    }
    return false;
  }

  // ---------- UI ----------
  function renderUI() {
    scoreEl.textContent = formatScore(state.score);
    hudScore.textContent = formatScore(state.score);
    hudHealth.textContent = state.health;
    hudAmmo.textContent = state.ammo;
    playerCountEl.textContent = state.players.length;

    scoreboardEl.innerHTML = '';
    state.players.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${p.name}</strong><span>${p.hp} HP</span>`;
      scoreboardEl.appendChild(li);
    });

    chatEl.innerHTML = '';
    state.chat.forEach(c => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="name">${c.name}</span><span class="msg">${c.msg}</span>`;
      chatEl.appendChild(li);
    });
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // ---------- Join Game ----------
  joinBtn.addEventListener('click', () => {
    const name = playerNameInput.value.trim();
    if (!name) {
      playerNameInput.focus();
      return;
    }
    playerNameInput.value = '';
    state.players.push({
      id: 'p' + Date.now(),
      name,
      x: 100,
      y: 100,
      r: PLAYER_SIZE,
      color: randColor(),
      hp: 100,
      ammo: 30,
      score: 0,
      angle: 0,
      alive: true,
    });
    renderUI();
  });

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = chatInput.value.trim();
    if (!msg) return;
    const p = state.players.find(x => x.id === state.turn);
    if (p) {
      state.chat.push({
        id: 'c' + Date.now(),
        name: p.name,
        msg,
        time: Date.now(),
      });
      if (state.chat.length > MAX_CHAT) state.chat.shift();
      chatInput.value = '';
      renderUI();
    }
  });

  // ---------- WebSocket ----------
  const ws = new WebSocket('ws://localhost:8080');

  ws.onopen = () => {
    console.log('Connected to server');
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'tick') {
      state.players = data.players;
      state.bullets = data.bullets;
      state.score = data.score;
      state.health = data.health;
      state.ammo = data.ammo;
      state.cooldown = data.cooldown;
      state.turn = data.turn;
      state.ready = data.ready;
      state.winner = data.winner;
      renderUI();
    }
    if (data.type === 'chat') {
      state.chat.push({
        id: 'c' + Date.now(),
        name: data.name,
        msg: data.msg,
        time: Date.now(),
      });
      if (state.chat.length > MAX_CHAT) state.chat.shift();
      renderUI();
    }
  };

  ws.onerror = (err) => {
    console.error('WebSocket error:', err);
    // Fallback to local sync
    syncLocal();
  };

  // ---------- Local Sync (simulated server) ----------
  let localTick = 0;
  function syncLocal() {
    if (state.players.length === 0) return;
    const data = {
      type: 'tick',
      players: state.players,
      bullets: state.bullets,
      score: state.score,
      health: state.health,
      ammo: state.ammo,
      cooldown: state.cooldown,
      turn: state.turn,
      ready: state.ready,
      winner: state.winner,
    };
    try { ws.send(JSON.stringify(data)); } catch (e) { /* ignore */ }
  }

  // ---------- Keyboard ----------
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'w' || k === 'arrowup') keys.up = true;
    if (k === 's' || k === 'arrowdown') keys.down = true;
    if (k === 'a' || k === 'arrowleft') keys.left = true;
    if (k === 'd' || k === 'arrowright') keys.right = true;
    if (k === ' ' || k === 'spacebar') keys.fire = true;
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'w' || k === 'arrowup') keys.up = false;
    if (k === 's' || k === 'arrowdown') keys.down = false;
    if (k === 'a' || k === 'arrowleft') keys.left = false;
    if (k === 'd' || k === 'arrowright') keys.right = false;
    if (k === ' ' || k === 'spacebar') keys.fire = false;
  });

  // ---------- Mouse ----------
  canvas.addEventListener('mousemove', (e) => {
    const m = getMousePos(e);
    state.players.forEach(p => {
      if (!p.alive) return;
      const d = dist(p.x, p.y, m.x, m.y);
      if (d < 40) {
        p.angle = angleFromTo(p.x, p.y, m.x, m.y);
      }
    });
  });

  // ---------- Main ----------
  const keys = { up: false, down: false, left: false, right: false, fire: false };
  requestAnimationFrame((t) => { state.lastTick = t; loop(t); });
})();
</script></script>
</body>
</html>
