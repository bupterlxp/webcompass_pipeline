<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Shooter</title>
  <style>/* ============ GLOBAL STYLES ============ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  color: #fff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

/* ============ LOGIN SCREEN ============ */
#login-screen {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100vw;
  height: 100vh;
  background: linear-gradient(135deg, #0a0a2e 0%, #1a0a2e 50%, #0a1a2e 100%);
}

.login-box {
  text-align: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 48px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.login-box h1 {
  font-size: 2.5rem;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-box p {
  color: #888;
  margin-bottom: 24px;
}

#player-name {
  width: 100%;
  padding: 14px 20px;
  font-size: 1.1rem;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  outline: none;
  transition: border-color 0.3s;
  margin-bottom: 16px;
}

#player-name:focus {
  border-color: #4d96ff;
}

#join-btn {
  width: 100%;
  padding: 14px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #4d96ff, #6bcb77);
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

#join-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(77, 150, 255, 0.4);
}

.controls-info {
  margin-top: 32px;
  text-align: left;
  color: #aaa;
}

.controls-info h3 {
  color: #fff;
  margin-bottom: 8px;
}

.controls-info p {
  margin: 4px 0;
  font-size: 0.9rem;
}

kbd {
  background: rgba(255, 255, 255, 0.15);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.85rem;
  margin: 0 2px;
}

/* ============ GAME SCREEN ============ */
#game-screen {
  position: relative;
  width: 100vw;
  height: 100vh;
}

#gameCanvas {
  display: block;
  width: 100vw;
  height: 100vh;
  cursor: crosshair;
}

/* ============ HUD ============ */
#hud {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#health-bar-container {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 28px;
  background: rgba(0, 0, 0, 0.7);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 14px;
  overflow: hidden;
}

#health-bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ff4444, #44ff44);
  border-radius: 12px;
  transition: width 0.3s ease;
}

#health-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.85rem;
  font-weight: bold;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
}

#kd-display {
  position: absolute;
  top: 15px;
  right: 15px;
  display: flex;
  gap: 16px;
  font-size: 1rem;
  font-weight: bold;
  background: rgba(0, 0, 0, 0.6);
  padding: 8px 16px;
  border-radius: 8px;
}

#kills { color: #6bcb77; }
#deaths { color: #ff6b6b; }

/* ============ MINIMAP ============ */
#minimap {
  position: absolute;
  bottom: 15px;
  right: 15px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.6);
}

/* ============ SCOREBOARD ============ */
#scoreboard {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  padding: 24px;
  min-width: 450px;
  z-index: 100;
}

#scoreboard h2 {
  text-align: center;
  margin-bottom: 16px;
  color: #ffd93d;
}

#scoreboard table {
  width: 100%;
  border-collapse: collapse;
}

#scoreboard th, #scoreboard td {
  padding: 8px 12px;
  text-align: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

#scoreboard th {
  color: #888;
  font-size: 0.85rem;
  text-transform: uppercase;
}

#scoreboard tr.self {
  background: rgba(77, 150, 255, 0.15);
}

/* ============ KILL FEED ============ */
#kill-feed {
  position: absolute;
  top: 15px;
  left: 15px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: none;
}

.kill-entry {
  background: rgba(0, 0, 0, 0.7);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 0.85rem;
  animation: fadeIn 0.3s ease;
  white-space: nowrap;
}

.kill-entry .killer { color: #ff6b6b; font-weight: bold; }
.kill-entry .victim { color: #4d96ff; font-weight: bold; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ============ CHAT ============ */
#chat-container {
  position: absolute;
  bottom: 70px;
  left: 15px;
  width: 350px;
  pointer-events: none;
}

#chat-messages {
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 8px;
  scrollbar-width: none;
}

#chat-messages::-webkit-scrollbar { display: none; }

.chat-msg {
  background: rgba(0, 0, 0, 0.6);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
  animation: fadeIn 0.2s ease;
}

.chat-msg .sender {
  font-weight: bold;
  color: #ffd93d;
}

#chat-input-container {
  pointer-events: auto;
}

#chat-input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  font-size: 0.9rem;
  outline: none;
  opacity: 0.5;
  transition: opacity 0.3s;
}

#chat-input:focus {
  opacity: 1;
  border-color: #4d96ff;
}

/* ============ DEATH SCREEN ============ */
#death-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(139, 0, 0, 0.4);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 50;
  pointer-events: none;
}

#death-screen h2 {
  font-size: 4rem;
  color: #ff4444;
  text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
}

#death-screen p {
  font-size: 1.5rem;
  color: #ccc;
  margin-top: 16px;
}

/* ============ NOTIFICATIONS ============ */
#notifications {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
}

.notification {
  background: rgba(0, 0, 0, 0.8);
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 0.9rem;
  animation: notifAnim 3s ease forwards;
}

.notification.heal { color: #6bcb77; border: 1px solid #6bcb77; }
.notification.damage { color: #ff6b6b; border: 1px solid #ff6b6b; }
.notification.info { color: #4d96ff; border: 1px solid #4d96ff; }

@keyframes notifAnim {
  0% { opacity: 0; transform: translateY(-10px); }
  10% { opacity: 1; transform: translateY(0); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-10px); }
}
</style>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h1>⚔️ MULTIPLAYER SHOOTER</h1>

  <script>/**
 * Multiplayer Shooting Game Server
 * Handles real-time synchronization, game state, and player management
 */

const express = require('express');
const http = require('http');
const { Server } = require('socket.io');
const path = require('path');

const app = express();
const server = http.createServer(app);
const io = new Server(server, {
  cors: { origin: '*' }
});

// Serve static files
app.use(express.static(path.join(__dirname, 'public')));

// ============ GAME CONFIGURATION ============
const CONFIG = {
  MAP_WIDTH: 2400,
  MAP_HEIGHT: 1800,
  PLAYER_SPEED: 4,
  PLAYER_RADIUS: 20,
  PLAYER_MAX_HP: 100,
  BULLET_SPEED: 12,
  BULLET_RADIUS: 5,
  BULLET_DAMAGE: 15,
  BULLET_LIFETIME: 80,       // frames before bullet disappears
  FIRE_RATE: 200,             // ms between shots
  RESPAWN_TIME: 3000,         // ms before respawn
  HEALTH_PACK_INTERVAL: 10000,// ms between health pack spawns
  HEALTH_PACK_HEAL: 30,
  HEALTH_PACK_RADIUS: 15,
  MAX_HEALTH_PACKS: 5
};

// ============ GAME STATE ============
let players = {};       // { socketId: playerData }
let bullets = [];       // active bullets
let healthPacks = [];   // health packs on map
let gameLoop = null;
let healthPackTimer = null;

// ============ UTILITY FUNCTIONS ============

/** Generate random position within map bounds */
function randomPosition() {
  return {
    x: Math.random() * (CONFIG.MAP_WIDTH - 100) + 50,
    y: Math.random() * (CONFIG.MAP_HEIGHT - 100) + 50
  };
}

/** Calculate distance between two points */
function distance(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

/** Generate a unique bullet ID */
let bulletIdCounter = 0;
function nextBulletId() {
  return ++bulletIdCounter;
}

/** Generate a unique health pack ID */
let healthPackIdCounter = 0;
function nextHealthPackId() {
  return ++healthPackIdCounter;
}

/** Spawn a health pack at random location */
function spawnHealthPack() {
  if (healthPacks.length >= CONFIG.MAX_HEALTH_PACKS) return;
  const pos = randomPosition();
  healthPacks.push({
    id: nextHealthPackId(),
    x: pos.x,
    y: pos.y,
    radius: CONFIG.HEALTH_PACK_RADIUS,
    heal: CONFIG.HEALTH_PACK_HEAL
  });
}

/** Create a new player object */
function createPlayer(socketId, name) {
  const pos = randomPosition();
  return {
    id: socketId,
    name: name || `Player_${socketId.slice(0, 4)}`,
    x: pos.x,
    y: pos.y,
    radius: CONFIG.PLAYER_RADIUS,
    hp: CONFIG.PLAYER_MAX_HP,
    maxHp: CONFIG.PLAYER_MAX_HP,
    angle: 0,
    kills: 0,
    deaths: 0,
    alive: true,
    lastShot: 0,
    input: { up: false, down: false, left: false, right: false },
    color: `hsl(${Math.random() * 360}, 70%, 50%)`
  };
}

/** Get scoreboard data sorted by kills */
function getScoreboard() {
  return Object.values(players)
    .map(p => ({
      id: p.id,
      name: p.name,
      kills: p.kills,
      deaths: p.deaths,
      hp: p.alive ? p.hp : 0,
      alive: p.alive
    }))
    .sort((a, b) => b.kills - a.kills);
}

/** Broadcast updated game state to all players */
function broadcastState() {
  const state = {
    players: Object.values(players).map(p => ({
      id: p.id,
      name: p.name,
      x: p.x,
      y: p.y,
      radius: p.radius,
      hp: p.hp,
      maxHp: p.maxHp,
      angle: p.angle,
      alive: p.alive,
      color: p.color
    })),
    bullets: bullets.map(b => ({
      id: b.id,
      x: b.x,
      y: b.y,
      radius: b.radius,
      angle: b.angle,
      ownerId: b.ownerId
    })),
    healthPacks: healthPacks.map(h => ({
      id: h.id,
      x: h.x,
      y: h.y,
      radius: h.radius
    })),
    scoreboard: getScoreboard(),
    mapWidth: CONFIG.MAP_WIDTH,
    mapHeight: CONFIG.MAP_HEIGHT
  };
  io.emit('gameState', state);
}

// ============ GAME LOOP ============

function updateGame() {
  // Update player positions based on input
  for (const id in players) {
    const p = players[id];
    if (!p.alive) continue;

    let dx = 0, dy = 0;
    if (p.input.up) dy -= 1;
    if (p.input.down) dy += 1;
    if (p.input.left) dx -= 1;
    if (p.input.right) dx += 1;

    // Normalize diagonal movement
    if (dx !== 0 && dy !== 0) {
      const len = Math.sqrt(dx * dx + dy * dy);
      dx /= len;
      dy /= len;
    }

    p.x += dx * CONFIG.PLAYER_SPEED;
    p.y += dy * CONFIG.PLAYER_SPEED;

    // Clamp to map bounds
    p.x = Math.max(p.radius, Math.min(CONFIG.MAP_WIDTH - p.radius, p.x));
    p.y = Math.max(p.radius, Math.min(CONFIG.MAP_HEIGHT - p.radius, p.y));
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += Math.cos(b.angle) * CONFIG.BULLET_SPEED;
    b.y += Math.sin(b.angle) * CONFIG.BULLET_SPEED;
    b.life--;

    // Remove if out of bounds or expired
    if (
      b.life <= 0 ||
      b.x < 0 || b.x > CONFIG.MAP_WIDTH ||
      b.y < 0 || b.y > CONFIG.MAP_HEIGHT
    ) {
      bullets.splice(i, 1);
      continue;
    }

    // Check collision with players
    for (const id in players) {
      const p = players[id];
      if (!p.alive || p.id === b.ownerId) continue;

      if (distance(b, p) < b.radius + p.radius) {
        // Hit!
        p.hp -= CONFIG.BULLET_DAMAGE;
        bullets.splice(i, 1);

        if (p.hp <= 0) {
          p.hp = 0;
          p.alive = false;
          p.deaths++;

          // Credit the kill
          if (players[b.ownerId]) {
            players[b.ownerId].kills++;
          }

          // Respawn after delay
          const deadPlayerId = p.id;
          setTimeout(() => {
            if (players[deadPlayerId]) {
              const pos = randomPosition();
              players[deadPlayerId].x = pos.x;
              players[deadPlayerId].y = pos.y;
              players[deadPlayerId].hp = CONFIG.PLAYER_MAX_HP;
              players[deadPlayerId].alive = true;
              io.to(deadPlayerId).emit('respawn');
            }
          }, CONFIG.RESPAWN_TIME);

          // Notify all about the kill
          io.emit('killFeed', {
            killer: players[b.ownerId] ? players[b.ownerId].name : 'Unknown',
            victim: p.name,
            timestamp: Date.now()
          });
        }

        // Notify the hit player
        io.to(p.id).emit('hit', { hp: p.hp, damage: CONFIG.BULLET_DAMAGE });
        break;
      }
    }
  }

  // Check health pack pickups
  for (let i = healthPacks.length - 1; i >= 0; i--) {
    const h = healthPacks[i];
    for (const id in players) {
      const p = players[id];
      if (!p.alive) continue;

      if (distance(h, p) < h.radius + p.radius) {
        p.hp = Math.min(p.maxHp, p.hp + h.heal);
        healthPacks.splice(i, 1);
        io.to(p.id).emit('heal', { hp: p.hp, amount: h.heal });
        break;
      }
    }
  }

  // Broadcast state to all clients
  broadcastState();
}

// ============ SOCKET.IO EVENT HANDLERS ============

io.on('connection', (socket) => {
  console.log(`Player connected: ${socket.id}`);

  // Player joins the game
  socket.on('join', (data) => {
    const name = (data && data.name) ? data.name.trim().slice(0, 16) : `Player_${socket.id.slice(0, 4)}`;
    players[socket.id] = createPlayer(socket.id, name);
    console.log(`${name} joined the game`);

    // Send initial config to the new player
    socket.emit('init', {
      playerId: socket.id,
      mapWidth: CONFIG.MAP_WIDTH,
      mapHeight: CONFIG.MAP_HEIGHT,
      config: {
        playerRadius: CONFIG.PLAYER_RADIUS,
        bulletRadius: CONFIG.BULLET_RADIUS,
        fireRate: CONFIG.FIRE_RATE,
        respawnTime: CONFIG.RESPAWN_TIME
      }
    });

    // Notify others
    socket.broadcast.emit('playerJoined', {
      id: socket.id,
      name: name
    });

    // Send current scoreboard
    io.emit('scoreboard', getScoreboard());
  });

  // Handle player input (movement)
  socket.on('input', (data) => {
    if (!players[socket.id]) return;
    players[socket.id].input = data;
  });

  // Handle player aiming
  socket.on('aim', (data) => {
    if (!players[socket.id]) return;
    players[socket.id].angle = data.angle;
  });

  // Handle shooting
  socket.on('shoot', (data) => {
    const p = players[socket.id];
    if (!p || !p.alive) return;

    const now = Date.now();
    if (now - p.lastShot < CONFIG.FIRE_RATE) return;
    p.lastShot = now;

    // Create bullet at player position, traveling toward aim angle
    const bullet = {
      id: nextBulletId(),
      x: p.x + Math.cos(p.angle) * (p.radius + 5),
      y: p.y + Math.sin(p.angle) * (p.radius + 5),
      radius: CONFIG.BULLET_RADIUS,
      angle: p.angle,
      ownerId: socket.id,
      life: CONFIG.BULLET_LIFETIME
    };
    bullets.push(bullet);
  });

  // Handle chat messages
  socket.on('chat', (data) => {
    if (!players[socket.id]) return;
    const message = (data.message || '').trim().slice(0, 200);
    if (!message) return;

    io.emit('chat', {
      sender: players[socket.id].name,
      message: message,
      timestamp: Date.now()
    });
  });

  // Handle disconnection
  socket.on('disconnect', () => {
    const p = players[socket.id];
    if (p) {
      console.log(`${p.name} disconnected`);
      io.emit('playerLeft', { id: socket.id, name: p.name });
      delete players[socket.id];
      io.emit('scoreboard', getScoreboard());
    }
  });
});

// ============ START SERVER ============

const PORT = process.env.PORT || 3000;

server.listen(PORT, () => {
  console.log(`\n========================================`);
  console.log(`  Multiplayer Shooter Server Running`);
  console.log(`  Open http://localhost:${PORT} in browser`);
  console.log(`  Open multiple tabs to test multiplayer`);
  console.log(`========================================\n`);

  // Start game loop at ~60 FPS
  gameLoop = setInterval(updateGame, 1000 / 60);

  // Spawn health packs periodically
  spawnHealthPack();
  spawnHealthPack();
  healthPackTimer = setInterval(spawnHealthPack, CONFIG.HEALTH_PACK_INTERVAL);
});
</script></script>
  <script>/**

  bullets: [],
  healthPacks: [],
  scoreboard: [],
  mapWidth: 2400,
  mapHeight: 1800
};

  playerRadius: 20,

  fireRate: 200,

const keys = { up: false, down: false, left: false, right: false };
let mouseX = 0, mouseY = 0;

let isChatting = false;

// ============ CAMERA ============
const camera = { x: 0, y: 0 };

const canvas = document.getElementById('gameCanvas');

const minimapCtx = minimapCanvas.getContext('2d');

function resizeCanvas() {

  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============ DOM ELEMENTS ============
const loginScreen = document.getElementById('login-screen');
const gameScreen = document.getElementById('game-screen');
const nameInput = document.getElementById('player-name');
const joinBtn = document.getElementById('join-btn');
const healthBar = document.getElementById('health-bar');
const healthText = document.getElementById('health-text');
const killsDisplay = document.getElementById('kills');
const deathsDisplay = document.getElementById('deaths');
const scoreboardEl = document.getElementById('scoreboard');
const scoreboardBody = document.getElementById('scoreboard-body');
const killFeedEl = document.getElementById('kill-feed');
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const deathScreen = document.getElementById('death-screen');
const respawnTimer = document.getElementById('respawn-timer');
const notificationsEl = document.getElementById('notifications');

// ============ LOGIN ============
function joinGame() {
  const name = nameInput.value.trim() || `Player_${Math.random().toString(36).slice(2, 6)}`;
  socket.emit('join', { name });
  loginScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  gameStarted = true;
}

joinBtn.addEventListener('click', joinGame);
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') joinGame();
});

// ============ SOCKET EVENTS ============

socket.on('init', (data) => {
  myId = data.playerId;
  gameState.mapWidth = data.mapWidth;
  gameState.mapHeight = data.mapHeight;
  config = { ...config, ...data.config };
  addNotification('Welcome to the battlefield!', 'info');
});

socket.on('gameState', (state) => {
  gameState = state;
  updateHUD();
});

socket.on('hit', (data) => {
  addNotification(`-${data.damage} HP`, 'damage');
});

socket.on('heal', (data) => {
  addNotification(`+${data.amount} HP`, 'heal');
});

socket.on('killFeed', (data) => {
  addKillFeedEntry(data.killer, data.victim);
});

socket.on('chat', (data) => {
  addChatMessage(data.sender, data.message);
});

socket.on('playerJoined', (data) => {
  addNotification(`${data.name} joined the game`, 'info');
});

socket.on('playerLeft', (data) => {
  addNotification(`${data.name} left the game`, 'info');
});

socket.on('respawn', () => {
  deathScreen.style.display = 'none';
});

socket.on('scoreboard', (data) => {
  gameState.scoreboard = data;
});

// ============ INPUT HANDLERS ============

document.addEventListener('keydown', (e) => {
  if (isChatting) {
    if (e.key === 'Escape') {
      chatInput.blur();
      isChatting = false;
    }
    return;
  }

  switch (e.key.toLowerCase()) {
    case 'w': case 'arrowup':    keys.up = true; break;
    case 's': case 'arrowdown':  keys.down = true; break;
    case 'a': case 'arrowleft':  keys.left = true; break;
    case 'd': case 'arrowright': keys.right = true; break;
    case 'tab':
      e.preventDefault();
      showScoreboard = true;
      scoreboardEl.style.display = 'block';
      break;
    case 'enter':
      e.preventDefault();
      chatInput.focus();
      isChatting = true;
      break;
  }

  // Send input state to server
  socket.emit('input', { ...keys });
});

document.addEventListener('keyup', (e) => {
  switch (e.key.toLowerCase()) {
    case 'w': case 'arrowup':    keys.up = false; break;
    case 's': case 'arrowdown':  keys.down = false; break;
    case 'a': case 'arrowleft':  keys.left = false; break;
    case 'd': case 'arrowright': keys.right = false; break;
    case 'tab':
      showScoreboard = false;
      scoreboardEl.style.display = 'none';
      break;
  }

  socket.emit('input', { ...keys });
});

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  // Calculate aim angle relative to player position on screen
  const me = getMyPlayer();
  if (me) {
    const screenX = me.x - camera.x;
    const screenY = me.y - camera.y;
    const angle = Math.atan2(mouseY - screenY, mouseX - screenX);
    socket.emit('aim', { angle });
  }
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    mouseDown = true;
    shoot();
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouseDown = false;
});

// Prevent context menu on right click
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// Chat input handling
chatInput.addEventListener('focus', () => { isChatting = true; });
chatInput.addEventListener('blur', () => { isChatting = false; });
chatInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter') {
    const msg = chatInput.value.trim();
    if (msg) {
      socket.emit('chat', { message: msg });
      chatInput.value = '';
    }
    chatInput.blur();
    isChatting = false;
  }
  if (e.key === 'Escape') {
    chatInput.blur();
    isChatting = false;
  }
});

// ============ SHOOTING ============
let lastShotTime = 0;

function shoot() {
  if (!gameStarted) return;
  const me = getMyPlayer();
  if (!me || !me.alive) return;

  const now = Date.now();
  if (now - lastShotTime < config.fireRate) return;
  lastShotTime = now;

  socket.emit('shoot', {});
}

// Auto-fire when holding mouse button
setInterval(() => {
  if (mouseDown && gameStarted && !isChatting) {
    shoot();
  }
}, 50);

// ============ HELPER FUNCTIONS ============

function getMyPlayer() {
  return gameState.players.find(p => p.id === myId);
}

function updateHUD() {
  const me = getMyPlayer();
  if (!me) return;

  // Health bar
  const hpPercent = (me.hp / me.maxHp) * 100;
  healthBar.style.width = `${hpPercent}%`;

  // Color based on health
  if (hpPercent > 60) {
    healthBar.style.background = 'linear-gradient(90deg, #44ff44, #88ff88)';
  } else if (hpPercent > 30) {
    healthBar.style.background = 'linear-gradient(90deg, #ffaa00, #ffdd44)';
  } else {
    healthBar.style.background = 'linear-gradient(90deg, #ff4444, #ff8888)';
  }

  healthText.textContent = `${Math.ceil(me.hp)} / ${me.maxHp}`;

  // K/D
  const myScore = gameState.scoreboard.find(s => s.id === myId);
  if (myScore) {
    killsDisplay.textContent = `Kills: ${myScore.kills}`;
    deathsDisplay.textContent = `Deaths: ${myScore.deaths}`;
  }

  // Death screen
  if (!me.alive) {
    deathScreen.style.display = 'flex';
  }

  // Update scoreboard
  updateScoreboard();
}

function updateScoreboard() {
  scoreboardBody.innerHTML = '';
  gameState.scoreboard.forEach((entry, index) => {
    const tr = document.createElement('tr');
    if (entry.id === myId) tr.classList.add('self');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${escapeHtml(entry.name)}</td>
      <td style="color:#6bcb77">${entry.kills}</td>
      <td style="color:#ff6b6b">${entry.deaths}</td>
      <td>${entry.alive ? '🟢 Alive' : '🔴 Dead'}</td>
    `;
    scoreboardBody.appendChild(tr);
  });
}

function addKillFeedEntry(killer, victim) {
  const entry = document.createElement('div');
  entry.className = 'kill-entry';
  entry.innerHTML = `<span class="killer">${escapeHtml(killer)}</span> ☠ <span class="victim">${escapeHtml(victim)}</span>`;
  killFeedEl.appendChild(entry);

  // Remove after 5 seconds
  setTimeout(() => {
    if (entry.parentNode) entry.parentNode.removeChild(entry);
  }, 5000);

  // Keep only last 5 entries
  while (killFeedEl.children.length > 5) {
    killFeedEl.removeChild(killFeedEl.firstChild);
  }
}

function addChatMessage(sender, message) {
  const msgEl = document.createElement('div');
  msgEl.className = 'chat-msg';
  msgEl.innerHTML = `<span class="sender">${escapeHtml(sender)}:</span> ${escapeHtml(message)}`;
  chatMessages.appendChild(msgEl);
  chatMessages.scrollTop = chatMessages.scrollHeight;

  // Remove old messages
  while (chatMessages.children.length > 50) {
    chatMessages.removeChild(chatMessages.firstChild);
  }

  // Auto-hide after 10 seconds
  setTimeout(() => {
    msgEl.style.opacity = '0';
    msgEl.style.transition = 'opacity 1s';
    setTimeout(() => {
      if (msgEl.parentNode) msgEl.parentNode.removeChild(msgEl);
    }, 1000);
  }, 10000);
}

function addNotification(text, type) {
  const notif = document.createElement('div');
  notif.className = `notification ${type}`;
  notif.textContent = text;
  notificationsEl.appendChild(notif);

  setTimeout(() => {
    if (notif.parentNode) notif.parentNode.removeChild(notif);
  }, 3000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============ RENDERING ============

function render() {
  if (!gameStarted) {
    requestAnimationFrame(render);
    return;
  }

  const me = getMyPlayer();

  // Update camera to follow player
  if (me) {
    camera.x = me.x - canvas.width / 2;
    camera.y = me.y - canvas.height / 2;
  }

  // Clear canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw background
  drawBackground();

  // Draw grid
  drawGrid();

  // Draw map border
  drawMapBorder();

  // Draw health packs
  drawHealthPacks();

  // Draw bullets
  drawBullets();

  // Draw players
  drawPlayers();

  // Draw minimap
  drawMinimap();

  requestAnimationFrame(render);
}

function drawBackground() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawGrid() {
  const gridSize = 80;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1;

  const startX = -(camera.x % gridSize);
  const startY = -(camera.y % gridSize);

  ctx.beginPath();
  for (let x = startX; x < canvas.width; x += gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
  }
  for (let y = startY; y < canvas.height; y += gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
  }
  ctx.stroke();
}

function drawMapBorder() {
  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth = 4;
  ctx.strokeRect(-camera.x, -camera.y, gameState.mapWidth, gameState.mapHeight);

  // Draw danger zone outside map
  ctx.fillStyle = 'rgba(255, 0, 0, 0.05)';
  // Top
  if (camera.y < 0) {
    ctx.fillRect(0, 0, canvas.width, -camera.y);
  }
  // Bottom
  if (camera.y + canvas.height > gameState.mapHeight) {
    const y = gameState.mapHeight - camera.y;
    ctx.fillRect(0, y, canvas.width, canvas.height - y);
  }
  // Left
  if (camera.x < 0) {
    ctx.fillRect(0, 0, -camera.x, canvas.height);
  }
  // Right
  if (camera.x + canvas.width > gameState.mapWidth) {
    const x = gameState.mapWidth - camera.x;
    ctx.fillRect(x, 0, canvas.width - x, canvas.height);
  }
}

function drawHealthPacks() {
  gameState.healthPacks.forEach(h => {
    const sx = h.x - camera.x;
    const sy = h.y - camera.y;

    // Skip if off screen
    if (sx < -50 || sx > canvas.width + 50 || sy < -50 || sy > canvas.height + 50) return;

    // Glow effect
    const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, h.radius * 2);
    gradient.addColorStop(0, 'rgba(0, 255, 100, 0.3)');
    gradient.addColorStop(1, 'rgba(0, 255, 100, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(sx, sy, h.radius * 2, 0, Math.PI * 2);
    ctx.fill();

    // Cross shape
    ctx.fillStyle = '#44ff88';
    ctx.fillRect(sx - h.radius * 0.7, sy - h.radius * 0.2, h.radius * 1.4, h.radius * 0.4);
    ctx.fillRect(sx - h.radius * 0.2, sy - h.radius * 0.7, h.radius * 0.4, h.radius * 1.4);

    // Border
    ctx.strokeStyle = '#88ffaa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sy, h.radius, 0, Math.PI * 2);
    ctx.stroke();
  });
}

function drawBullets() {
  gameState.bullets.forEach(b => {
    const sx = b.x - camera.x;
    const sy = b.y - camera.y;

    // Skip if off screen
    if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) return;

    // Bullet trail
    const trailLen = 15;
    const tx = sx - Math.cos(b.angle) * trailLen;
    const ty = sy - Math.sin(b.angle) * trailLen;

    const gradient = ctx.createLinearGradient(tx, ty, sx, sy);
    gradient.addColorStop(0, 'rgba(255, 200, 50, 0)');
    gradient.addColorStop(1, 'rgba(255, 200, 50, 0.8)');

    ctx.strokeStyle = gradient;
    ctx.lineWidth = b.radius * 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(sx, sy);
    ctx.stroke();

    // Bullet head
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath();
    ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
    ctx.fill();

    // Glow
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function drawPlayers() {
  gameState.players.forEach(p => {
    if (!p.alive) return;

    const sx = p.x - camera.x;
    const sy = p.y - camera.y;

    // Skip if off screen
    if (sx < -100 || sx > canvas.width + 100 || sy < -100 || sy > canvas.height + 100) return;

    const isMe = p.id === myId;

    // Player body shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(sx + 3, sy + 5, p.radius, p.radius * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Player body
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx, sy, p.radius, 0, Math.PI * 2);
    ctx.fill();

    // Player border
    ctx.strokeStyle = isMe ? '#ffffff' : 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = isMe ? 3 : 2;
    ctx.stroke();

    // Gun barrel (aim direction)
    const gunLen = p.radius + 15;
    const gunX = sx + Math.cos(p.angle) * gunLen;
    const gunY = sy + Math.sin(p.angle) * gunLen;

    ctx.strokeStyle = '#888';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(p.angle) * p.radius * 0.5, sy + Math.sin(p.angle) * p.radius * 0.5);
    ctx.lineTo(gunX, gunY);
    ctx.stroke();

    // Gun tip
    ctx.fillStyle = '#aaa';
    ctx.beginPath();
    ctx.arc(gunX, gunY, 4, 0, Math.PI * 2);
    ctx.fill();

    // Health bar above player
    const barWidth = p.radius * 2.5;
    const barHeight = 5;
    const barX = sx - barWidth / 2;
    const barY = sy - p.radius - 18;
    const hpPercent = p.hp / p.maxHp;

    // Background
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(barX - 1, barY - 1, barWidth + 2, barHeight + 2);

    // Health fill
    let hpColor;
    if (hpPercent > 0.6) hpColor = '#44ff44';
    else if (hpPercent > 0.3) hpColor = '#ffaa00';
    else hpColor = '#ff4444';

    ctx.fillStyle = hpColor;
    ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);

    // Player name
    ctx.fillStyle = isMe ? '#ffffff' : '#cccccc';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, sx, barY - 6);
  });
}

function drawMinimap() {
  const mw = minimapCanvas.width;
  const mh = minimapCanvas.height;
  const scaleX = mw / gameState.mapWidth;
  const scaleY = mh / gameState.mapHeight;

  // Clear
  minimapCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
  minimapCtx.fillRect(0, 0, mw, mh);

  // Border
  minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  minimapCtx.lineWidth = 1;
  minimapCtx.strokeRect(0, 0, mw, mh);

  // Health packs
  gameState.healthPacks.forEach(h => {
    minimapCtx.fillStyle = '#44ff88';
    minimapCtx.fillRect(h.x * scaleX - 2, h.y * scaleY - 2, 4, 4);
  });

  // Players
  gameState.players.forEach(p => {
    if (!p.alive) return;
    const isMe = p.id === myId;
    minimapCtx.fillStyle = isMe ? '#ffffff' : p.color;
    minimapCtx.beginPath();
    minimapCtx.arc(p.x * scaleX, p.y * scaleY, isMe ? 4 : 3, 0, Math.PI * 2);
    minimapCtx.fill();
  });

  // Camera viewport
  minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  minimapCtx.lineWidth = 1;
  minimapCtx.strokeRect(
    camera.x * scaleX,
    camera.y * scaleY,
    canvas.width * scaleX,
    canvas.height * scaleY
  );
}

// ============ RESPAWN TIMER ============
let respawnInterval = null;

socket.on('gameState', (state) => {
  const me = state.players.find(p => p.id === myId);
  if (me && !me.alive && deathScreen.style.display !== 'none') {
    if (!respawnInterval) {
      let countdown = 3;
      respawnTimer.textContent = countdown;
      respawnInterval = setInterval(() => {
        countdown--;
        respawnTimer.textContent = Math.max(0, countdown);
        if (countdown <= 0) {
          clearInterval(respawnInterval);
          respawnInterval = null;
        }
      }, 1000);
    }
  }
});

// ============ START GAME LOOP ============
requestAnimationFrame(render);
</script></script>
