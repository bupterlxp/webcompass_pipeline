<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Inventory Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
        #reader { width: 100%; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-2xl font-bold text-blue-600"><i class="fas fa-boxes-stacked mr-2"></i>Inventory Pro</h1>
        <div class="flex gap-2">
            <button onclick="openScannerModal()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg shadow"><i class="fas fa-barcode mr-2"></i>Scan</button>
            <button onclick="openReportModal()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg shadow"><i class="fas fa-chart-pie mr-2"></i>Reports</button>
            <button onclick="openItemModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg shadow"><i class="fas fa-plus mr-2"></i>Add Item</button>
        </div>
    </header>

    <!-- Dashboard Cards -->
    <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500">
            <h3 class="text-gray-500 text-sm uppercase">Total Units in Stock</h3>
            <p id="dash-total-units" class="text-3xl font-bold mt-2">0</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
            <h3 class="text-gray-500 text-sm uppercase">Total Inventory Value</h3>
            <p id="dash-total-value" class="text-3xl font-bold mt-2">$0.00</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-red-500">
            <h3 class="text-gray-500 text-sm uppercase">Low Stock Alerts</h3>
            <p id="dash-low-stock" class="text-3xl font-bold mt-2 text-red-500">0</p>
        </div>
    </div>

    <!-- Quick Scan (USB Scanner Support) -->
    <div class="container mx-auto px-6 mb-4">
        <div class="bg-white p-4 rounded-xl shadow-md flex items-center gap-4">
            <i class="fas fa-keyboard text-gray-400 text-xl"></i>
            <input type="text" id="usb-scanner-input" class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" 
                   placeholder="Quick Scan / Search (Focus here and use USB Barcode Scanner or type & press Enter)">
            <button onclick="handleQuickScan()" class="bg-gray-800 text-white px-4 py-2 rounded-lg">Search / Scan</button>
        </div>
    </div>

    <!-- Inventory Table -->
    <div class="container mx-auto px-6 pb-6">
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Barcode</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Qty / Threshold</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Item Modal -->
    <div id="item-modal" class="modal fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Add New Item</h2>
            <form id="item-form" onsubmit="saveItem(event)">
                <input type="hidden" id="item-id">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Barcode</label>
                    <input type="text" id="item-barcode" required class="mt-1 block w-full border rounded-md p-2">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" id="item-name" required class="mt-1 block w-full border rounded-md p-2">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Category</label>
                        <input type="text" id="item-category" class="mt-1 block w-full border rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Price ($)</label>
                        <input type="number" step="0.01" id="item-price" required class="mt-1 block w-full border rounded-md p-2">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Quantity</label>
                        <input type="number" id="item-quantity" required class="mt-1 block w-full border rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Min Threshold</label>
                        <input type="number" id="item-threshold" required class="mt-1 block w-full border rounded-md p-2">
                    </div>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal('item-modal')" class="px-4 py-2 bg-gray-200 rounded-md">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scanner-modal" class="modal fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Barcode Scanner</h2>
                <button onclick="stopScanner()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div id="reader" class="rounded-lg overflow-hidden mb-4"></div>
            <p class="text-sm text-gray-500 text-center">Point your camera at a barcode. Ensure you are on <code>localhost</code> for camera permissions.</p>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="report-modal" class="modal fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Inventory Report</h2>
                <button onclick="closeModal('report-modal')" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div id="report-content"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg hidden transition-opacity duration-300 z-50"></div>

    <script>
        let items = [];
        let html5QrCode = null;

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchItems();
            // USB Scanner Listener (Listens for Enter key on the quick scan input)
            document.getElementById('usb-scanner-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    handleQuickScan();
                }
            });
        });

        // --- API Calls ---
        async function fetchItems() {
            const res = await fetch('/api/items');
            items = await res.json();
            renderTable();
            updateDashboard();
        }

        async function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                barcode: document.getElementById('item-barcode').value,
                name: document.getElementById('item-name').value,
                category: document.getElementById('item-category').value,
                price: parseFloat(document.getElementById('item-price').value),
                quantity: parseInt(document.getElementById('item-quantity').value),
                min_threshold: parseInt(document.getElementById('item-threshold').value)
            };

            const url = id ? `/api/items/${id}` : '/api/items';
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                showToast(id ? 'Item updated!' : 'Item added!');
                closeModal('item-modal');
                fetchItems();
            } else {
                const err = await res.json();
                showToast(err.error || 'Error saving item', true);
            }
        }

        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            await fetch(`/api/items/${id}`, { method: 'DELETE' });
            showToast('Item deleted');
            fetchItems();
        }

        // --- UI Rendering ---
        function renderTable() {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = items.map(item => {
                const isLow = item.quantity <= item.min_threshold;
                const rowClass = isLow ? 'bg-red-50' : '';
                const qtyClass = isLow ? 'text-red-600 font-bold' : 'text-gray-800';
                
                return `
                    <tr class="${rowClass} hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-500">${item.barcode}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.category || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${qtyClass}">
                            ${item.quantity} <span class="text-gray-400 font-normal">/ ${item.min_threshold}</span>
                            ${isLow ? '<i class="fas fa-exclamation-triangle text-red-500 ml-2" title="Low Stock"></i>' : ''}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">$${item.price.toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick='editItem(${JSON.stringify(item)})' class="text-blue-600 hover:text-blue-900 mr-3"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem(${item.id})" class="text-red-600 hover:text-red-900"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateDashboard() {
            const totalUnits = items.reduce((sum, i) => sum + i.quantity, 0);
            const totalValue = items.reduce((sum, i) => sum + (i.quantity * i.price), 0);
            const lowStock = items.filter(i => i.quantity <= i.min_threshold).length;

            document.getElementById('dash-total-units').innerText = totalUnits;
            document.getElementById('dash-total-value').innerText = `$${totalValue.toFixed(2)}`;
            document.getElementById('dash-low-stock').innerText = lowStock;
        }

        // --- Modal Controls ---
        function openItemModal(item = null) {
            document.getElementById('modal-title').innerText = item ? 'Edit Item' : 'Add New Item';
            document.getElementById('item-id').value = item ? item.id : '';
            document.getElementById('item-barcode').value = item ? item.barcode : '';
            document.getElementById('item-name').value = item ? item.name : '';
            document.getElementById('item-category').value = item ? item.category : '';
            document.getElementById('item-price').value = item ? item.price : '';
            document.getElementById('item-quantity').value = item ? item.quantity : 0;
            document.getElementById('item-threshold').value = item ? item.min_threshold : 0;
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function editItem(item) {
            openItemModal(item);
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // --- Barcode Scanner Logic ---
        function openScannerModal() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                showToast("Camera access denied or not available. Use USB scanner or manual entry.", true);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    closeModal('scanner-modal');
                }).catch(err => console.log(err));
            } else {
                closeModal('scanner-modal');
            }
        }

        function onScanSuccess(decodedText) {
            stopScanner();
            handleScannedCode(decodedText);
        }

        function onScanFailure(error) { /* Ignore continuous scan failures */ }

        function handleQuickScan() {
            const input = document.getElementById('usb-scanner-input');
            const code = input.value.trim();
            if (code) {
                handleScannedCode(code);
                input.value = '';
            }
        }

        function handleScannedCode(code) {
            const item = items.find(i => i.barcode === code);
            if (item) {
                if (confirm(`Found: ${item.name}\nCurrent Qty: ${item.quantity}\n\nDo you want to add 1 to stock? (Cancel to edit)`)) {
                    quickUpdateQty(item.id, item.quantity + 1, item);
                } else {
                    openItemModal(item);
                }
            } else {
                if (confirm(`Barcode ${code} not found.\n\nDo you want to add it as a new item?`)) {
                    openItemModal();
                    document.getElementById('item-barcode').value = code;
                }
            }
        }

        async function quickUpdateQty(id, newQty, item) {
            const payload = { ...item, quantity: newQty };
            await fetch(`/api/items/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            showToast(`Updated ${item.name} qty to ${newQty}`);
            fetchItems();
        }

        // --- Reports ---
        async function openReportModal() {
            const res = await fetch('/api/reports');
            const data = await res.json();
            
            let html = `
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-blue-50 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-blue-600">${data.summary.total_units}</div>
                        <div class="text-sm text-gray-600">Total Units</div>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-green-600">$${data.summary.total_value}</div>
                        <div class="text-sm text-gray-600">Total Value</div>
                    </div>
                    <div class="bg-red-50 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-red-600">${data.summary.low_stock_count}</div>
                        <div class="text-sm text-gray-600">Low Stock Items</div>
                    </div>
                </div>
            `;

            if (data.low_stock_items.length > 0) {
                html += `<h3 class="text-lg font-bold text-red-600 mb-2"><i class="fas fa-exclamation-triangle mr-2"></i>Restock Required</h3>`;
                html += `<ul class="divide-y divide-gray-200 border rounded-lg">`;
                data.low_stock_items.forEach(i => {
                    html += `
                        <li class="p-3 flex justify-between items-center">
                            <div>
                                <span class="font-medium">${i.name}</span>
                                <span class="text-xs text-gray-500 ml-2">(${i.barcode})</span>
                            </div>
                            <div class="text-red-600 font-bold">
                                ${i.quantity} / ${i.min_threshold}
                            </div>
                        </li>
                    `;
                });
                html += `</ul>`;
            } else {
                html += `<div class="text-center text-green-600 py-4"><i class="fas fa-check-circle text-3xl mb-2"></i><br>All items are sufficiently stocked!</div>`;
            }

            document.getElementById('report-content').innerHTML = html;
            document.getElementById('report-modal').classList.remove('hidden');
        }

        // --- Utilities ---
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg z-50 text-white ${isError ? 'bg-red-600' : 'bg-gray-800'}`;
            setTimeout(() => { toast.className += ' hidden'; }, 3000);
        }
    </script>
</body>
</html>
