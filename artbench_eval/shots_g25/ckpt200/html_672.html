<!DOCTYPE html>
<html>
<head>
    <title>ReLoop — Second-Hand Goods Trading</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>/* styles.css not found in result */</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}"><i class="fas fa-hand-sparkles"></i> ReLoop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li><a class="nav-link" href="{% url 'index' %}">Browse</a></li>
                    <li><a class="nav-link" href="{% url 'index' %}?category=electronics">Electronics</a></li>
                    <li><a class="nav-link" href="{% url 'index' %}?category=clothing">Clothing</a></li>
                    <li><a class="nav-link" href="{% url 'index' %}?category=furniture">Furniture</a></li>
                    <li><a class="nav-link" href="{% url 'index' %}?category=home">Home</a></li>
                </ul>
                <div class="d-flex">
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'my_listings' %}">My Listings</a>
                        <a class="nav-link" href="{% url 'my_cart' %}"><i class="fas fa-shopping-cart"></i> Cart</a>
                        <a class="nav-link" href="{% url 'profile' user.username %}">{{ user.username }}</a>
                        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                    {% else %}
                        <a class="btn btn-outline-light" href="{% url 'login' %}">Login</a>
                        <a class="btn btn-outline-light" href="{% url 'register' %}">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <p>© 2025 ReLoop. Buy, sell, and reuse. <i class="fas fa-hand-sparkles"></i></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
