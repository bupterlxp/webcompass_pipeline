<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combat Arena — Multiplayer Shooter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14;
    color: #e8e8f0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  #game-wrap {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
  }
  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.05));
    pointer-events: none;
    z-index: 10;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .hud-row span { color: #9a9ab0; }
  .hud-row strong { color: #fff; }
  #chat {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0.05));
    pointer-events: none;
    z-index: 10;
    max-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chat-msg { font-size: 12px; color: #cfd4e0; }
  .chat-msg strong { color: #fff; }
  .chat-msg .me { color: #4ade80; }
  .chat-input {
    position: absolute;
    bottom: 70px; left: 0; right: 0;
    padding: 8px 16px;
    background: rgba(0,0,0,0.4);
    border-top: 1px solid rgba(255,255,255,0.08);
    z-index: 10;
  }
  #chat-input {
    width: 100%;
    background: #1a1a2e;
    border: 1px solid #2a2a42;
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  #chat-input::placeholder { color: #6b6ea8; }
  #chat-input:focus { border-color: #7c9dff; }
  #chat-input:focus + #send-btn {
    background: #4ade80;
    color: #0a0a14;
  }
  #send-btn {
    background: #3a3a55;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #send-btn:hover:not(:disabled) { background: #5a5a75; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #btns {
    position: absolute;
    top: 12px; left: 16px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  .btn {
    background: #2a2a42;
    color: #fff;
    border: 1px solid #3a3a55;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: #3a3a55; border-color: #4a4a65; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #7c9dff; border-color: #7c9dff; }
  .btn-primary:hover { background: #8aa8ff; }
  #stats {
    position: absolute;
    top: 12px; right: 16px;
    z-index: 10;
    display: flex;
    gap: 12px;
    padding: 8px;
    background: rgba(0,0,0,0.4);
    border-radius: 6px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .stat strong { font-size: 14px; }
  .stat small { font-size: 11px; color: #6b6ea8; }
  #map-info {
    position: absolute;
    bottom: 10px; right: 16px;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    color: #cfd4e0;
  }
  #loading {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 20;
    color: #fff;
    font-size: 14px;
    transition: opacity 0.3s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    padding: 20px 40px;
    border-radius: 8px;
    color: #fff;
    z-index: 25;
    font-size: 14px;
    box-shadow: 0 0 30px rgba(255,0,0,0.3);
    display: none;
  }
  #error.show { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #tooltip {
    position: absolute;
    background: #1a1a2e;
    border: 1px solid #3a3a55;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
    color: #cfd4e0;
    pointer-events: none;
    z-index: 30;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #1a1a2e;
  }
  #crosshair {
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 12px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 5;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.9);
    border-radius: 2px;
  }
  #crosshair::before { width: 40px; height: 2px; top: -20px; left: -20px; }
  #crosshair::after { width: 2px; height: 40px; top: -20px; left: -20px; transform: rotate(90deg); }

  @media (max-width: 600px) {
    #hud { padding: 8px 10px; }
    #chat { max-height: 80px; }
    #map-info { display: none; }
    #stats { top: 8px; right: 8px; }
    .hud-row { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="hud-row">
      <span id="room-name">—</span>
      <span id="players-count">0 / 8</span>
      <span id="scoreboard">—</span>
      <span id="ammo">—</span>
    </div>
    <div class="hud-row">
      <span>WASD / Arrow Keys — Move</span>
      <span>Space / R — Reload</span>
      <span>1-4 — Weapon</span>
      <span>Mouse — Aim</span>
    </div>
  </div>

  <div id="chat">
    <div class="chat-msg"><strong>You:</strong> <span id="welcome-msg">Ready?</span></div>
  </div>

  <div class="chat-input">
    <input id="chat-input" placeholder="Type a message..." autocomplete="off" />
    <button id="send-btn" disabled>Send</button>
  </div>

  <div id="btns">
    <button class="btn" id="btn-create">Create Room</button>
    <button class="btn" id="btn-join">Join Room</button>
    <button class="btn" id="btn-leave">Leave</button>
  </div>

  <div id="stats">
    <div class="stat"><strong id="stat-hp">100</strong><small>HP</small></div>
    <div class="stat"><strong id="stat-kill">0</strong><small>Kills</small></div>
    <div class="stat"><strong id="stat-damage">0</strong><small>Dmg</small></div>
    <div class="stat"><strong id="stat-headshot">0</strong><small>H.S.</small></div>
  </div>

  <div id="map-info">Map: Forest · 1000×600</div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Connecting to server…</div>
  </div>

  <div id="error">Connection failed. Please check your network and try again.</div>

  <div id="tooltip"></div>

  <div id="crosshair"></div>
</div>

<script>
/* =========================================================
   Combat Arena — Multiplayer Shooter
   ========================================================= */

  // ---------- Configuration ----------
  const CONFIG = {
    ROOM_KEY: 'combat_arena_rooms',
    PLAYER_KEY: 'combat_arena_player',
    MAX_PLAYERS: 8,
    MAX_WEAPONS: 4,
    WEAPONS: [
      { id: 1, name: 'Pistol',  baseDmg: 25, fireRate: 0.18, reload: 1.2, clip: 15, spread: 0.03, color: '#ff8a65' },
      { id: 2, name: 'SMG',     baseDmg: 14, fireRate: 0.06, reload: 1.8, clip: 40, spread: 0.08, color: '#4ade80' },
      { id: 3, name: 'Rifle',   baseDmg: 35, fireRate: 0.35, reload: 2.4, clip: 25, spread: 0.02, color: '#7c9dff' },
      { id: 4, name: 'Sniper',  baseDmg: 80, fireRate: 1.0,  reload: 5.0, clip: 5,  spread: 0.005, color: '#f97316' }
    ],
    WEAPON_SOUNDS: {
      pistol: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
      smg: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
      rifle: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
      sniper: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'
    },
    BULLET_LIFETIME: 2000,
    BULLET_SPEED: 600,
    CROSSHAIR_SIZE: 12,
    MAX_CHAT_LINES: 20
  };

  // ---------- State ----------
  const state = {
    socket: null,
    wsUrl: 'ws://localhost:8080',
    player: null,
    rooms: [],
    localId: null,
    currentRoom: null,
    currentWeapon: 1,
    ammo: { 1: 15, 2: 40, 3: 25, 4: 5 },
    clips: { 1: 1, 2: 1, 3: 1, 4: 1 },
    reloading: false,
    lastFire: 0,
    lastShoot: 0,
    bullets: [],
    bulletsToSpawn: [],
    crosshair: { x: 0, y: 0, targetX: 0, targetY: 0, visible: false },
    tooltip: { text: '', visible: false, x: 0, y: 0 },
    chatLines: [],
    chatInput: '',
    loading: true,
    errorHidden: false,
    map: {
      width: 1000,
      height: 600,
      trees: [],
      rocks: [],
      walls: []
    },
    keys: {},
    mouse: { x: 0, y: 0, down: false, angle: 0, lastX: 0, lastY: 0 },
    lastMove: 0,
    moveDir: { x: 0, y: 0 },
    camera: { x: 0, y: 0, targetX: 0, targetY: 0, speed: 180 },
    score: { kills: 0, damage: 0, headshots: 0, hp: 100 },
    dead: false,
    deadTime: 0
  };

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const canvas = $('game-canvas');
  const ctx = canvas.getContext('2d');
  const roomNameEl = $('room-name');
  const playersCountEl = $('players-count');
  const scoreboardEl = $('scoreboard');
  const ammoEl = $('ammo');
  const welcomeMsg = $('welcome-msg');
  const chatEl = $('chat');
  const chatInput = $('chat-input');
  const sendBtn = $('send-btn');
  const btnCreate = $('btn-create');
  btnCreate.addEventListener('click', () => createRoom());
  const btnJoin = $('btn-join');
  btnJoin.addEventListener('click', () => joinRoom());
  const btnLeave = $('btn-leave');
  btnLeave.addEventListener('click', () => leaveRoom());
  const statHp = $('stat-hp');
  const statKill = $('stat-kill');
  const statDamage = $('stat-damage');
  const statHeadshot = $('stat-headshot');
  const loadingEl = $('loading');
  const errorEl = $('error');
  const tooltipEl = $('tooltip');
  const crosshairEl = $('crosshair');

  // ---------- Weapon ----------
  const weapon = (id) => CONFIG.WEAPONS.find(w => w.id === id);

  // ---------- Map Generation ----------
  function generateMap() {
    const { width, height } = state.map;
    state.map.trees = [];
    state.map.rocks = [];
    state.map.walls = [];

    // Trees
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * width;
      const y = Math.random() * height;
      const size = 18 + Math.random() * 18;
      state.map.trees.push({ x, y, size });
    }
    // Rocks
    for (let i = 0; i < 20; i++) {
      const x = Math.random() * width;
      const y = Math.random() * height;
      const size = 12 + Math.random() * 12;
      state.map.rocks.push({ x, y, size });
    }
    // Walls
    state.map.walls = [
      { x: 0, y: 0, w: width, h: 60 },
      { x: 0, y: height - 60, w: width, h: 60 },
      { x: 0, y: 0, w: 60, h: height },
      { x: width - 60, y: 0, w: 60, h: height }
    ];
  }

  // ---------- Player ----------
  function createPlayer(roomId) {
    const id = 'p' + Date.now();
    const x = 200 + Math.random() * 600;
    const y = 150 + Math.random() * 400;
    const weaponId = 1;
    return {
      id,
      roomId,
      x, y,
      vx: 0, vy: 0,
      angle: Math.random() * Math.PI * 2,
      weaponId,
      hp: 100,
      kills: 0,
      damage: 0,
      headshots: 0,
      alive: true,
      deadTime: 0,
      score: { kills: 0, damage: 0, headshots: 0, hp: 100 },
      name: 'Player',
      color: '#7c9dff'
    };
  }

  // ---------- Socket ----------
  function connect() {
    state.socket = new WebSocket(state.wsUrl);
    state.socket.binaryType = 'arraybuffer';

    state.socket.onopen = () => {
      loadingEl.classList.add('hidden');
      state.loading = false;
      welcomeMsg.textContent = 'Joined ' + (state.currentRoom ? state.currentRoom.name : 'room');
      sendBtn.disabled = false;
      chatInput.focus();
      loadRooms();
      loadPlayer();
    };

    state.socket.onmessage = (ev) => {
      const data = JSON.parse(ev.data);
      if (data.type === 'rooms') {
        state.rooms = data.rooms;
        renderRooms();
      } else if (data.type === 'player') {
        if (data.id === state.localId) {
          state.player = data;
          state.currentRoom = data.room;
          roomNameEl.textContent = state.currentRoom.name;
          playersCountEl.textContent = state.currentRoom.players.length + ' / ' + CONFIG.MAX_PLAYERS;
          updateScoreboard();
          updateAmmo();
          updateStats();
          welcomeMsg.textContent = 'Welcome, ' + data.name;
        } else {
          const p = state.rooms.find(r => r.id === data.roomId)?.players.find(p => p.id === data.id);
          if (p) {
            p.x = data.x;
            p.y = data.y;
            p.vx = data.vx;
            p.vy = data.vy;
            p.angle = data.angle;
            p.hp = data.hp;
            p.alive = data.alive;
            p.deadTime = data.deadTime;
            p.kills = data.kills;
            p.damage = data.damage;
            p.headshots = data.headshots;
            p.score = { kills: data.score.kills, damage: data.score.damage, headshots: data.score.headshots, hp: data.score.hp };
            p.name = data.name;
            p.color = data.color;
          }
        }
        updateBullets();
        updateChat();
        updateScoreboard();
        updateAmmo();
        updateStats();
        updateTooltip();
        updateCrosshair();
      } else if (data.type === 'bullet') {
        state.bullets.push({ ...data, alive: true, life: data.life || CONFIG.BULLET_LIFETIME });
        if (data.fromId === state.localId) {
          state.bulletsToSpawn.push({ ...data, fromId: state.localId, life: data.life || CONFIG.BULLET_LIFETIME });
        }
      } else if (data.type === 'chat') {
        addChat(data);
      } else if (data.type === 'error') {
        showError(data.message);
      }
    };

    state.socket.onerror = () => {
      state.loading = true;
      loadingEl.classList.remove('hidden');
      showError('Connection error. Retrying…');
    };

    state.socket.onclose = () => {
      state.loading = true;
      loadingEl.classList.remove('hidden');
      showError('Connection lost. Reconnecting…');
      setTimeout(() => connect(), 2000);
    };
  }

  function loadRooms() {
    try {
      const raw = localStorage.getItem(CONFIG.ROOM_KEY);
      if (raw) state.rooms = JSON.parse(raw);
    } catch { state.rooms = []; }
  }

  function saveRooms() {
    try { localStorage.setItem(CONFIG.ROOM_KEY, JSON.stringify(state.rooms)); } catch {}
  }

  function loadPlayer() {
    try {
      const raw = localStorage.getItem(CONFIG.PLAYER_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        state.player = p;
        state.localId = p.id;
        state.currentRoom = p.room;
        state.currentWeapon = p.weaponId;
        state.ammo = { ...p.ammo };
        state.clips = { ...p.clips };
        state.score = { ...p.score };
        state.dead = p.dead;
        state.deadTime = p.deadTime;
      }
    } catch {}
  }

  function savePlayer() {
    if (state.player && state.localId) {
      try { localStorage.setItem(CONFIG.PLAYER_KEY, JSON.stringify(state.player)); } catch {}
    }
  }

  function createRoom() {
    const name = prompt('Room name:');
    if (!name) return;
    const room = { id: 'r' + Date.now(), name, players: [] };
    state.rooms.push(room);
    saveRooms();
    state.socket.send(JSON.stringify({ type: 'createRoom', data: room }));
  }

  function joinRoom() {
    const roomId = prompt('Room ID:');
    if (!roomId) return;
    state.socket.send(JSON.stringify({ type: 'joinRoom', data: { roomId } }));
  }

  function leaveRoom() {
    if (!state.player) return;
    state.socket.send(JSON.stringify({ type: 'leaveRoom', data: { roomId: state.player.roomId } }));
    state.player = null;
    state.localId = null;
    state.currentRoom = null;
    state.ammo = { 1: 15, 2: 40, 3: 25, 4: 5 };
    state.clips = { 1: 1, 2: 1, 3: 1, 4: 1 };
    state.score = { kills: 0, damage: 0, headshots: 0, hp: 100 };
    state.dead = false;
    state.deadTime = 0;
    savePlayer();
    chatLines = [];
    renderChat();
    welcomeMsg.textContent = 'Disconnected';
    sendBtn.disabled = true;
    chatInput.value = '';
  }

  function showError(msg) {
    errorEl.textContent = msg;
    if (state.errorHidden) {
      errorEl.classList.remove('hidden');
      state.errorHidden = false;
    }
    setTimeout(() => {
      if (!state.errorHidden) errorEl.classList.add('hidden');
      state.errorHidden = true;
    }, 4000);
  }

  // ---------- Chat ----------
  function addChat(data) {
    if (data.type === 'chat') {
      const line = document.createElement('div');
      line.className = 'chat-msg';
      if (data.me) line.innerHTML = '<strong class="me">You:</strong> ' + escapeHtml(data.msg);
      else line.innerHTML = '<strong>' + escapeHtml(data.name) + ':</strong> ' + escapeHtml(data.msg);
      chatEl.appendChild(line);
      while (chatEl.children.length > CONFIG.MAX_CHAT_LINES) chatEl.removeChild(chatEl.firstChild);
      renderChat();
    }
  }

  function renderChat() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (chatInput.value.trim()) {
        state.socket.send(JSON.stringify({ type: 'chat', data: { msg: chatInput.value.trim(), me: true } }));
        addChat({ type: 'chat', data: { msg: chatInput.value.trim(), me: true } });
        chatInput.value = '';
      }
    }
  });

  // ---------- Rooms ----------
  function renderRooms() {
    const list = document.createElement('div');
    list.style.cssText = 'position:absolute;top:12px;right:16px;z-index:10;background:rgba(0,0,0,0.5);padding:8px;border-radius:6px;';
    list.innerHTML = state.rooms.map(r => {
      const p = r.players.find(p => p.id === state.localId);
      const alive = p ? p.alive : false;
      return `<div style="display:flex;align-items:center;gap:8px;padding:4px;border-radius:4px;font-size:12px;">
        <i class="fa-solid ${alive ? 'fa-circle' : 'fa-circle-xmark'}" style="color:${alive ? '#4ade80' : '#f87171'}"></i>
        <span>${escapeHtml(r.name)}</span>
        <span style="margin-left:auto;color:#6b6ea8;font-size:11px;">${r.players.length}/${CONFIG.MAX_PLAYERS}</span>
      </div>`;
    }).join('');
    list.style.position = 'absolute';
    list.style.top = '12px';
    list.style.right = '16px';
    list.style.zIndex = '10';
    list.style.background = 'rgba(0,0,0,0.5)';
    list.style.padding = '8px';
    list.style.borderRadius = '6px';
    list.innerHTML = state.rooms.map(r => {
      const p = r.players.find(p => p.id === state.localId);
      const alive = p ? p.alive : false;
      return `<div style="display:flex;align-items:center;gap:8px;padding:4px;border-radius:4px;font-size:12px;">
        <i class="fa-solid ${alive ? 'fa-circle' : 'fa-circle-xmark'}" style="color:${alive ? '#4ade80' : '#f87171'}"></i>
        <span>${escapeHtml(r.name)}</span>
        <span style="margin-left:auto;color:#6b6ea8;font-size:11px;">${r.players.length}/${CONFIG.MAX_PLAYERS}</span>
      </div>`;
    }).join('');
    document.body.appendChild(list);
  }

  // ---------- Game Loop ----------
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function update() {
    if (!state.player) return;
    const p = state.player;

    // Move
    const now = performance.now();
    if (now - state.lastMove > 16) {
      state.lastMove = now;
      if (state.keys['KeyA'] || state.keys['ArrowLeft']) p.vx -= 240;
      if (state.keys['KeyD'] || state.keys['ArrowRight']) p.vx += 240;
      if (state.keys['KeyW'] || state.keys['ArrowUp']) p.vy -= 240;
      if (state.keys['KeyS'] || state.keys['ArrowDown']) p.vy += 240;
      const speed = Math.hypot(p.vx, p.vy);
      if (speed > 0) { p.vx /= speed; p.vy /= speed; p.vx *= 320; p.vy *= 320; }
      p.x += p.vx;
      p.y += p.vy;
      p.angle = Math.atan2(p.vy, p.vx);
    }

    // Camera
    const camX = p.x - canvas.width / 2;
    const camY = p.y - canvas.height / 2;
    state.camera.x += (camX - state.camera.targetX) * 0.1;
    state.camera.y += (camY - state.camera.targetY) * 0.1;

    // Shooting
    const weapon = CONFIG.WEAPONS[state.currentWeapon - 1];
    const nowMs = now / 1000;
    if (state.mouse.down && !state.reloading && nowMs - state.lastShoot > weapon.fireRate) {
      state.lastShoot = nowMs;
      fireBullet();
    }

    // Reload
    if (state.reloading) {
      const reloadTime = weapon.reload;
      state.reloading = nowMs - state.lastFire > reloadTime;
      if (state.reloading) {
        state.clips[state.currentWeapon] = 0;
        state.ammo[state.currentWeapon] = weapon.clip;
        state.lastFire = nowMs;
        state.reloading = false;
      }
    }

    // Bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += Math.cos(b.angle) * CONFIG.BULLET_SPEED;
      b.y += Math.sin(b.angle) * CONFIG.BULLET_SPEED;
      b.life -= 16;
      if (b.life <= 0 || b.x < -50 || b.x > state.map.width + 50 || b.y < -50 || b.y > state.map.height + 50) {
        state.bullets.splice(i, 1);
      }
    }
    for (let i = state.bulletsToSpawn.length - 1; i >= 0; i--) {
      const b = state.bulletsToSpawn[i];
      if (b.life <= 0) state.bulletsToSpawn.splice(i, 1);
    }

    // Collisions
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      const hit = state.currentRoom.players.find(o => o.id !== p.id && o.alive && o.x - 18 < b.x && o.x + 18 > b.x && o.y - 18 < b.y && o.y + 18 > b.y);
      if (hit) {
        if (b.fromId === p.id) {
          hit.hp -= b.damage;
          if (hit.hp <= 0) {
            hit.alive = false;
            hit.deadTime = 1200;
            p.kills++;
            p.score.kills++;
            state.score.kills++;
          } else {
            p.damage += b.damage;
            p.score.damage += b.damage;
            state.score.damage += b.damage;
            if (hit.hp < 30) p.headshots++;
            p.score.headshots++;
            state.score.headshots++;
          }
        }
        state.bullets.splice(i, 1);
      }
    }

    // Player HP
    if (p.hp <= 0) {
      p.alive = false;
      p.deadTime = 1200;
      p.hp = 0;
      state.dead = true;
      state.deadTime = 1200;
    }

    // Update state
    p.x = Math.max(60, Math.min(state.map.width - 60, p.x));
    p.y = Math.max(60, Math.min(state.map.height - 60, p.y));
    p.vy = 0;
    p.vx = 0;
    state.clips[state.currentWeapon] = Math.max(0, state.clips[state.currentWeapon] - 1);
  }

  function render() {
    const w = canvas.width;
    const h = canvas.height;
    const camX = state.camera.x;
    const camY = state.camera.y;

    // Background
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, w, h);

    // Map
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, w, h);

    // Trees
    state.map.trees.forEach(t => {
      const tx = t.x - camX;
      const ty = t.y - camY;
      if (tx < -t.size || tx > w + t.size || ty < -t.size || ty > h + t.size) return;
      ctx.fillStyle = '#1a3a1a';
      ctx.fillRect(tx - t.size, ty - t.size, t.size * 2, t.size * 2);
      ctx.fillStyle = '#0a2a0a';
      ctx.fillRect(tx - t.size + 2, ty - t.size + 2, t.size * 2 - 4, t.size * 2 - 4);
    });

    // Rocks
    state.map.rocks.forEach(r => {
      const rx = r.x - camX;
      const ry = r.y - camY;
      if (rx < -r.size || rx > w + r.size || ry < -r.size || ry > h + r.size) return;
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.arc(rx, ry, r.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath();
      ctx.arc(rx, ry, r.size - 2, 0, Math.PI * 2);
      ctx.fill();
    });

    // Walls
    state.map.walls.forEach(w => {
      const wx = w.x - camX;
      const wy = w.y - camY;
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(wx, wy, w.w, w.h);
    });

    // Bullets
    state.bullets.forEach(b => {
      const bx = b.x - camX;
      const by = b.y - camY;
      if (bx < -50 || bx > w + 50 || by < -50 || by > h + 50) return;
      ctx.fillStyle = b.color || '#ffffff';
      ctx.fillRect(bx - 2, by - 2, 4, 4);
    });

    // Players
    state.currentRoom.players.forEach(o => {
      if (o.id === state.localId) return;
      if (o.deadTime > 0) {
        o.deadTime -= 16;
        return;
      }
      const ox = o.x - camX;
      const oy = o.y - camY;
      if (ox < -30 || ox > w + 30 || oy < -30 || oy > h + 30) return;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(o.angle);
      ctx.fillStyle = o.color;
      ctx.fillRect(-8, -12, 16, 24);
      ctx.fillStyle = '#000';
      ctx.fillRect(-8, -12, 16, 2);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(o.name, 0, 14);
      ctx.restore();
    });

    // Local player
    if (state.player && state.player.alive) {
      const px = state.player.x - camX;
      const py = state.player.y - camY;
      if (px < -30 || px > w + 30 || py < -30 || py > h + 30) return;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(state.player.angle);
      ctx.fillStyle = state.player.color;
      ctx.fillRect(-8, -12, 16, 24);
      ctx.fillStyle = '#000';
      ctx.fillRect(-8, -12, 16, 2);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(state.player.name, 0, 14);
      ctx.restore();
    }

    // Crosshair
    if (state.crosshair.visible) {
      crosshairEl.style.left = (state.crosshair.x - state.crosshair.size / 2) + 'px';
      crosshairEl.style.top = (state.crosshair.y - state.crosshair.size / 2) + 'px';
      crosshairEl.style.display = 'block';
    } else {
      crosshairEl.style.display = 'none';
    }

    // Tooltip
    if (state.tooltip.visible) {
      tooltipEl.textContent = state.tooltip.text;
      tooltipEl.style.left = state.tooltip.x + 'px';
      tooltipEl.style.top = state.tooltip.y + 'px';
      tooltipEl.classList.add('visible');
    } else {
      tooltipEl.classList.remove('visible');
    }
  }

  function fireBullet() {
    const p = state.player;
    const w = CONFIG.WEAPONS[state.currentWeapon - 1];
    const spread = w.spread * (0.5 + Math.random() * 0.5);
    const angle = p.angle + (Math.random() - 0.5) * spread;
    const b = {
      x: p.x,
      y: p.y,
      vx: Math.cos(angle) * CONFIG.BULLET_SPEED,
      vy: Math.sin(angle) * CONFIG.BULLET_SPEED,
      angle,
      damage: w.baseDmg,
      fromId: p.id,
      life: CONFIG.BULLET_LIFETIME,
      color: w.color,
      weaponId: state.currentWeapon
    };
    state.bullets.push(b);
    state.bulletsToSpawn.push(b);
    playSound(w.name);
    if (state.clips[state.currentWeapon] <= 0) {
      state.reloading = true;
      state.lastFire = performance.now() / 1000;
    } else {
      state.clips[state.currentWeapon]--;
    }
  }

  function playSound(name) {
    try {
      const src = CONFIG.WEAPON_SOUNDS[name] || CONFIG.WEAPON_SOUNDS.pistol;
      const audio = new Audio(src);
      audio.volume = 0.2;
      audio.play().catch(() => {});
    } catch {}
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    state.keys[e.key] = true;
    if (['KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
      e.preventDefault();
    }
    if (e.key === ' ') { e.preventDefault(); }
    if (e.key === '1') { state.currentWeapon = 1; updateAmmo(); }
    if (e.key === '2') { state.currentWeapon = 2; updateAmmo(); }
    if (e.key === '3') { state.currentWeapon = 3; updateAmmo(); }
    if (e.key === '4') { state.currentWeapon = 4; updateAmmo(); }
    if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      if (state.clips[state.currentWeapon] > 0) {
        state.reloading = true;
        state.lastFire = performance.now() / 1000;
      }
    }
  });

  window.addEventListener('keyup', (e) => { state.keys[e.key] = false; });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    state.mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
    state.mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    state.mouse.lastX = state.mouse.x;
    state.mouse.lastY = state.mouse.y;
  });

  canvas.addEventListener('mousedown', (e) => {
    state.mouse.down = true;
    state.mouse.lastX = state.mouse.x;
    state.mouse.lastY = state.mouse.y;
  });

  canvas.addEventListener('mouseup', (e) => {
    state.mouse.down = false;
  });

  canvas.addEventListener('mouseleave', () => {
    state.mouse.down = false;
  });

  window.addEventListener('resize', resizeCanvas);

  // ---------- UI ----------
  function updateScoreboard() {
    const kills = state.currentRoom.players.reduce((s, p) => s + (p.alive ? p.kills : 0), 0);
    const total = state.currentRoom.players.reduce((s, p) => s + (p.alive ? p.hp : 0), 0);
    scoreboardEl.textContent = `${kills} kills · ${total} HP · ${state.currentRoom.players.length} alive`;
  }

  function updateAmmo() {
    ammoEl.textContent = `${state.ammo[state.currentWeapon]} / ${weapon(state.currentWeapon).clip}`;
  }

  function updateStats() {
    statHp.textContent = Math.max(0, Math.round(state.score.hp));
    statKill.textContent = state.score.kills;
    statDamage.textContent = state.score.damage;
    statHeadshot.textContent = state.score.headshots;
  }

  function updateTooltip() {
    if (state.mouse.down) {
      state.tooltip.text = 'Aim';
      state.tooltip.visible = true;
      state.tooltip.x = state.mouse.x;
      state.tooltip.y = state.mouse.y;
    } else {
      state.tooltip.visible = false;
    }
  }

  function updateCrosshair() {
    const rect = canvas.getBoundingClientRect();
    state.crosshair.x = (state.mouse.x / canvas.width) * rect.width;
    state.crosshair.y = (state.mouse.y / canvas.height) * rect.height;
    state.crosshair.targetX = state.crosshair.x;
    state.crosshair.targetY = state.crosshair.y;
    state.crosshair.visible = true;
  }

  // ---------- Main Loop ----------
  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Init ----------
  function init() {
    generateMap();
    resizeCanvas();
    connect();
    loop();
  }

  init();
</script>
