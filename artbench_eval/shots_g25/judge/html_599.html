<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Shooter</title>
    <style>/* style.css */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #222;
    font-family: Arial, sans-serif;
}

#game-container {
    position: relative;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Let clicks pass through to canvas */
}

#scoreboard {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 10px;
    border-radius: 5px;
    width: 200px;
    pointer-events: auto;
}

#scoreboard h3 {
    margin: 0 0 10px 0;
    text-align: center;
}

#score-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

#score-list li {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
}

#chat-container {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 300px;
    background: rgba(0, 0, 0, 0.7);
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    pointer-events: auto;
}

#chat-messages {
    height: 150px;
    overflow-y: auto;
    padding: 10px;
    color: white;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

#chat-input {
    border: none;
    padding: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border-top: 1px solid #444;
    border-radius: 0 0 5px 5px;
    outline: none;
}

.chat-msg span {
    font-weight: bold;
}
</style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="scoreboard">
                <h3>Scoreboard</h3>
                <ul id="score-list"></ul>
            </div>
            
            <div id="chat-container">
                <div id="chat-messages"></div>
                <input type="text" id="chat-input" placeholder="Press Enter to chat...">
            </div>
        </div>
    </div>

    <script>/* game.js */

// --- Mock Network / Server Simulation ---
// Simulates a backend server for multiplayer functionality
class MockServer {
    constructor() {
        this.players = {};
        this.bullets = [];
        this.callbacks = {};
        this.botNames = ["Alpha", "Bravo", "Charlie", "Delta"];
        
        // Initialize some bots
        this.botNames.forEach((name, i) => {
            this.players[`bot_${i}`] = {
                id: `bot_${i}`,
                name: name,
                x: Math.random() * 800,
                y: Math.random() * 600,
                angle: 0,
                hp: 100,
                score: Math.floor(Math.random() * 10),
                color: `hsl(${Math.random() * 360}, 70%, 50%)`
            };
        });

        // Bot movement loop
        setInterval(() => this.updateBots(), 50);
    }

    on(event, callback) {
        this.callbacks[event] = callback;
    }

    emit(event, data) {
        if (event === 'join') {
            const newPlayer = {
                id: 'local_player',
                name: data.name,
                x: 400, y: 300, angle: 0, hp: 100, score: 0, color: '#00ff00'
            };
            this.players['local_player'] = newPlayer;
            this.trigger('init', { players: this.players });
            this.trigger('chat', { sender: 'System', text: `${data.name} joined the game.` });
        }
        if (event === 'move') {
            if (this.players['local_player']) {
                this.players['local_player'].x = data.x;
                this.players['local_player'].y = data.y;
                this.players['local_player'].angle = data.angle;
            }
        }
        if (event === 'shoot') {
            this.bullets.push({
                id: Math.random().toString(),
                ownerId: 'local_player',
                x: data.x, y: data.y,
                vx: Math.cos(data.angle) * 15,
                vy: Math.sin(data.angle) * 15
            });
        }
        if (event === 'chat') {
            this.trigger('chat', { sender: this.players['local_player'].name, text: data.text });
        }
    }

    trigger(event, data) {
        if (this.callbacks[event]) this.callbacks[event](data);
    }

    updateBots() {
        // Move bots randomly
        Object.values(this.players).forEach(p => {
            if (p.id.startsWith('bot_')) {
                p.x += (Math.random() - 0.5) * 5;
                p.y += (Math.random() - 0.5) * 5;
                p.angle += (Math.random() - 0.5) * 0.2;
                
                // Keep in bounds
                p.x = Math.max(0, Math.min(800, p.x));
                p.y = Math.max(0, Math.min(600, p.y));

                // Random shooting
                if (Math.random() < 0.02) {
                    this.bullets.push({
                        id: Math.random().toString(),
                        ownerId: p.id,
                        x: p.x, y: p.y,
                        vx: Math.cos(p.angle) * 10,
                        vy: Math.sin(p.angle) * 10
                    });
                }
            }
        });

        // Update bullets and check collisions
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            let b = this.bullets[i];
            b.x += b.vx;
            b.y += b.vy;

            // Remove out of bounds
            if (b.x < 0 || b.x > 2000 || b.y < 0 || b.y > 2000) {
                this.bullets.splice(i, 1);
                continue;
            }

            // Collision
            Object.values(this.players).forEach(p => {
                if (p.id !== b.ownerId && p.hp > 0) {
                    const dist = Math.hypot(p.x - b.x, p.y - b.y);
                    if (dist < 20) {
                        p.hp -= 20;
                        this.bullets.splice(i, 1);
                        if (p.hp <= 0) {
                            p.hp = 100; // Respawn
                            p.x = Math.random() * 800;
                            p.y = Math.random() * 600;
                            if (this.players[b.ownerId]) {
                                this.players[b.ownerId].score += 1;
                            }
                            this.trigger('chat', { sender: 'System', text: `${p.name} was eliminated.` });
                        }
                    }
                }
            });
        }

        // Broadcast state
        this.trigger('state', { players: this.players, bullets: this.bullets });
    }
}

// --- Game Client ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const chatInput = document.getElementById('chat-input');
const chatMessages = document.getElementById('chat-messages');
const scoreList = document.getElementById('score-list');

let width, height;
let players = {};
let bullets = [];
let localPlayerId = 'local_player';

// Input state
const keys = { w: false, a: false, s: false, d: false };
const mouse = { x: 0, y: 0, down: false };

// Resize canvas
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Network setup
const server = new MockServer();

server.on('init', (data) => {
    players = data.players;
    updateScoreboard();
});

server.on('state', (data) => {
    players = data.players;
    bullets = data.bullets;
    updateScoreboard();
});

server.on('chat', (data) => {
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span style="color: ${data.sender === 'System' ? '#ffaa00' : '#fff'}">${data.sender}:</span> ${data.text}`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});

// Join game
server.emit('join', { name: 'Player' + Math.floor(Math.random() * 1000) });

// Input handling
window.addEventListener('keydown', e => {
    if (document.activeElement === chatInput) return;
    if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', e => {
    if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener('mousedown', e => {
    if (document.activeElement === chatInput) return;
    const p = players[localPlayerId];
    if (p) {
        server.emit('shoot', { x: p.x, y: p.y, angle: p.angle });
    }
});

chatInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && chatInput.value.trim() !== '') {
        server.emit('chat', { text: chatInput.value.trim() });
        chatInput.value = '';
        chatInput.blur();
    }
});

// UI Updates
function updateScoreboard() {
    const sorted = Object.values(players).sort((a, b) => b.score - a.score);
    scoreList.innerHTML = sorted.map(p => `
        <li>
            <span style="color: ${p.color}">${p.name}</span>
            <span>${p.score}</span>
        </li>
    `).join('');
}

// Game Loop
function update() {
    const p = players[localPlayerId];
    if (p) {
        let dx = 0, dy = 0;
        const speed = 5;
        if (keys.w) dy -= speed;
        if (keys.s) dy += speed;
        if (keys.a) dx -= speed;
        if (keys.d) dx += speed;

        p.x += dx;
        p.y += dy;
        
        // Calculate angle to mouse
        p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

        // Send movement to server
        if (dx !== 0 || dy !== 0 || mouse.x !== 0) {
            server.emit('move', { x: p.x, y: p.y, angle: p.angle });
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw grid background
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    for(let i = 0; i < width; i += 50) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
    }
    for(let i = 0; i < height; i += 50) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
    }

    // Draw bullets
    ctx.fillStyle = '#fff';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw players
    Object.values(players).forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Draw Name
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, 0, -30);

        // Draw HP bar
        ctx.fillStyle = '#f00';
        ctx.fillRect(-20, -25, 40, 5);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(-20, -25, 40 * (p.hp / 100), 5);

        // Draw Body
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw Gun
        ctx.fillStyle = '#999';
        ctx.fillRect(10, -4, 20, 8);
        
        ctx.restore();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Start game
loop();
</script></script>
</body>
</html>
