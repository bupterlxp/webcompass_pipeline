<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Annotation Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/></svg>
      <span>Annotation Tool</span>
    </div>
    <div class="tool-group">
      <label class="tool-label">Shape</label>
      <select id="shapeSelect" class="tool-input">
        <option value="rectangle">Rectangle</option>
        <option value="circle">Circle</option>
        <option value="text">Text</option>
      </select>
    </div>
    <div class="tool-group">
      <label class="tool-label">Color</label>
      <input type="color" id="colorInput" class="tool-input" value="#ff6b6b">
    </div>
    <div class="tool-group">
      <label class="tool-label">Thickness</label>
      <input type="range" id="thicknessInput" class="tool-input" min="1" max="10" value="2" step="1">
    </div>
    <div class="tool-group">
      <label class="tool-label">Opacity</label>
      <input type="range" id="opacityInput" class="tool-input" min="0" max="1" step="0.1" value="0.8">
    </div>
    <div class="tool-group">
      <button id="clearBtn" class="btn btn-ghost">Clear All</button>
    </div>
    <div class="tool-group">
      <button id="exportBtn" class="btn btn-primary">Export PNG</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel panel-left">
      <div class="panel-head">
        <h2>Annotations</h2>
        <span id="countBadge" class="badge">0</span>
      </div>
      <div id="annotationsList" class="annotations-list"></div>
      <div id="emptyState" class="empty-state">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <p>No annotations yet. Upload an image and start drawing!</p>
      </div>
    </section>

    <section class="panel panel-right">
      <div class="panel-head">
        <h2>Preview</h2>
      </div>
      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="previewCanvas" width="800" height="600"></canvas>
        <div id="canvasEmpty" class="canvas-empty">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/></svg>
          <p>Upload an image to begin annotating.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Tip: Click & drag to draw. Double-click an annotation to edit.</span>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
