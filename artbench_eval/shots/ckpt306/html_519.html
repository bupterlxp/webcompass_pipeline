<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FurniSpace — Virtual Furniture Shopping</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>.room {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  cursor: grab;
  transition: transform 0.15s ease;
}
.room:active { cursor: grabbing; }

.room-wall {
  pointer-events: none;
}
.room-floor-decor {
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1), transparent 40%);
}

.furniture-item {
  position: absolute;
  transition: transform 0.2s ease, opacity 0.2s ease;
  cursor: grab;
  user-select: none;
}
.furniture-item:active { cursor: grabbing; }
.furniture-item.dragging { opacity: 0.4; }

.furniture-item:hover { transform: scale(1.05); }

.furniture-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 4px;
}

.furniture-item .price {
  position: absolute;
  bottom: 4px;
  right: 4px;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}

.furniture-item .remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.furniture-item .remove:hover { background: rgba(0,0,0,0.9); }

.icon-btn {
  background: none;
  border: none;
  color: gray;
  font-size: 24px;
  cursor: pointer;
  padding: 8px;
}
.icon-btn:hover { color: purple; }

.modal {
  z-index: 60;
}
.modal-backdrop {
  max-height: 90vh;
  overflow-y: auto;
}

#plansList li {
  padding: 8px 12px;
  background: #f8fafc;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
}
#plansList li:hover { background: #eef2ff; }
#plansList li .plan-name { font-weight: 600; }
#plansList li .plan-date { font-size: 12px; color: gray; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: gray;
}

@media (max-width: 900px) {
  .room { h-64; }
  .room-floor { h-64; }
  .room-window { w-24; h-24; }
  .room-wall { w-20; }
  .furniture-item { width: 60%; height: 40%; }
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="bg-white shadow-sm">
  <div class="container mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-600 to-pink-500 flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>
      </div>
      <span class="font-bold text-xl text-gray-800">FurniSpace</span>
    </div>
    <nav class="hidden md:flex space-x-8">
      <a href="#" class="text-gray-600 hover:text-gray-900">Browse</a>
      <a href="#" class="text-gray-600 hover:text-gray-900">Plans</a>
      <a href="#" class="text-gray-600 hover:text-gray-900">Cart <span id="cartCount" class="ml-1 bg-purple-600 text-white rounded-full px-2 py-1 text-xs font-bold">0</span></a>
      <a href="#" class="text-gray-600 hover:text-gray-900">Account</a>
    </nav>
    <div class="md:hidden">
      <button class="icon-btn" id="menuBtn">☰</button>
    </div>
  </div>
  <div class="md:hidden" id="mobileMenu">
    <div class="px-4 py-2 space-y-2">
      <a href="#" class="block text-gray-700">Browse</a>
      <a href="#" class="block text-gray-700">Plans</a>
      <a href="#" class="block text-gray-700">Cart <span id="mobileCartCount" class="ml-1 bg-purple-600 text-white rounded-full px-2 py-1 text-xs font-bold">0</span></a>
      <a href="#" class="block text-gray-700">Account</a>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="container mx-auto px-4 py-8">

  <!-- LEFT: BROWSE + CATEGORIES -->
  <section class="flex flex-col lg:flex-row gap-6 lg:gap-8">

    <!-- CATEGORIES -->
    <aside class="w-full lg:w-64 space-y-2">
      <div class="bg-white p-4 rounded-lg shadow-sm">
        <h3 class="font-bold text-lg mb-3">Categories</h3>
        <ul class="space-y-2">
          <li><button class="w-full text-left category-btn" data-cat="all" data-label="All">All <span class="ml-auto text-sm text-gray-500">All</span></button></li>
          <li><button class="w-full text-left category-btn" data-cat="sofa" data-label="Sofas">Sofas <span class="ml-auto text-sm text-gray-500">0</span></button></li>
          <li><button class="w-full text-left category-btn" data-cat="table" data-label="Tables">Tables <span class="ml-auto text-sm text-gray-500">0</span></button></li>
          <li><button class="w-full text-left category-btn" data-cat="chair" data-label="Chairs">Chairs <span class="ml-auto text-sm text-gray-500">0</span></button></li>
          <li><button class="w-full text-left category-btn" data-cat="bed" data-label="Beds">Beds <span class="ml-auto text-sm text-gray-500">0</span></button></li>
          <li><button class="w-full text-left category-btn" data-cat="desk" data-label="Desks">Desks <span class="ml-auto text-sm text-gray-500">0</span></button></li>
          <li><button class="w-full text-left category-btn" data-cat="decor" data-label="Decor">Decor <span class="ml-auto text-sm text-gray-500">0</span></button></li>
        </ul>
      </div>

      <div class="bg-white p-4 rounded-lg shadow-sm mt-4">
        <h3 class="font-bold text-lg mb-3">Your Plans</h3>
        <div id="plansList" class="space-y-2"></div>
      </div>

      <div class="bg-white p-4 rounded-lg shadow-sm mt-4">
        <h3 class="font-bold text-lg mb-3">Account</h3>
        <div id="authPanel">
          <button class="w-full text-left bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700" id="loginBtn">Login</button>
          <button class="w-full text-left text-gray-600 py-2 rounded-lg hover:bg-gray-100" id="signupBtn">Create Account</button>
          <button class="w-full text-left text-gray-600 py-2 rounded-lg hover:bg-gray-100" id="logoutBtn" hidden>Logout</button>
        </div>
      </div>
    </aside>

    <!-- BROWSE / SHOP -->
    <div class="w-full lg:w-1/2">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-800" id="browseTitle">All Furniture</h2>
        <div class="text-sm text-gray-500" id="filterCount">Showing 0 items</div>
      </div>
      <div id="furnitureList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="emptyState" class="hidden text-center py-12">
        <svg class="mx-auto w-16 h-16 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <p class="mt-4 text-gray-600">No items in this category yet.</p>
      </div>
    </div>

    <!-- RIGHT: VIRTUAL ROOM -->
    <aside class="w-full lg:w-1/2 space-y-4">
      <div class="bg-white rounded-lg shadow-sm p-4">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-lg">Virtual Room Preview</h3>
          <button class="text-purple-600 hover:text-purple-800" id="resetBtn">Reset</button>
        </div>
        <div id="room" class="room relative h-96 bg-gradient-to-br from-amber-50 to-amber-100 rounded-lg overflow-hidden border-2 border-gray-200">
          <div class="room-wall wall-left absolute left-0 top-0 bottom-0 w-32 bg-gradient-to-b from-slate-400 to-slate-500"></div>
          <div class="room-wall wall-right absolute right-0 top-0 bottom-0 w-32 bg-gradient-to-b from-slate-400 to-slate-500"></div>
          <div class="room-floor absolute inset-0 bg-gradient-to-t from-slate-600 to-slate-700"></div>
          <div class="room-window absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-gradient-to-br from-sky-300 to-sky-500 rounded-lg"></div>
          <div class="room-floor-decor absolute inset-0"></div>
          <div id="furnitureLayer" class="absolute inset-0"></div>
        </div>
      </div>

      <!-- CART -->
      <div class="bg-white rounded-lg shadow-sm p-4">
        <h3 class="font-bold text-lg mb-3">Shopping Cart</h3>
        <div id="cartItems" class="space-y-3"></div>
        <div class="mt-4 pt-4 border-t border-gray-200">
          <div class="flex justify-between text-sm font-semibold mb-1">
            <span>Total</span>
            <span id="cartTotal">$0.00</span>
          </div>
          <button class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700" id="checkoutBtn">Checkout</button>
        </div>
      </div>
    </aside>
  </section>
</main>

<!-- ============ FOOTER ============ -->
<footer class="bg-gray-800 text-white py-6 mt-8">
  <div class="container mx-auto px-4 text-center">
    <p>© 2025 FurniSpace. Build your dream room, one piece at a time.</p>
  </div>
</footer>

<!-- ============ MODALS ============ -->
<div id="modal" class="modal hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="modal-backdrop bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
    <div id="modalTitle">Login</div>
    <div id="modalBody"></div>
  </div>
</div>

<script>/* =========================================================
   FurniSpace — Vanilla JS Furniture Shop
   ========================================================= */

const STORAGE_KEY = 'furnispace.v1';

const CATEGORIES = {
  all:     { label: 'All',      items: ['sofa','table','chair','bed','desk','decor'] },
  sofa:    { label: 'Sofas',    items: ['sofa'] },
  table:   { label: 'Tables',   items: ['table'] },
  chair:   { label: 'Chairs',   items: ['chair'] },
  bed:     { label: 'Beds',     items: ['bed'] },
  desk:    { label: 'Desks',    items: ['desk'] },
  decor:   { label: 'Decor',    items: ['decor'] },
};

const FURNITURE = [
  { id: 's1', cat: 'sofa',   name: 'Modern Leather Sofa',      price: 1299,  width: 140, depth: 80, height: 85, img: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&q=80' },
  { id: 's2', cat: 'sofa',   name: 'Minimalist Fabric Sofa',   price: 899,   width: 120, depth: 85, height: 80, img: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600&q=80' },
  { id: 't1', cat: 'table',  name: 'Oak Dining Table',         price: 450,   width: 160, depth: 80, height: 75, img: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&q=80' },
  { id: 't2', cat: 'table',  name: 'Glass Coffee Table',       price: 220,   width: 100, depth: 40, height: 45, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
  { id: 'c1', cat: 'chair',  name: 'Ergonomic Office Chair',   price: 320,   width: 60,  depth: 65, height: 95, img: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600&q=80' },
  { id: 'c2', cat: 'chair',  name: 'Vintage Armchair',         price: 180,   width: 70,  depth: 75, height: 85, img: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600&q=80' },
  { id: 'b1', cat: 'bed',    name: 'Queen Platform Bed',       price: 950,   width: 180, depth: 160, height: 110, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
  { id: 'b2', cat: 'bed',    name: 'King Storage Bed',         price: 1450,  width: 200, depth: 180, height: 120, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
  { id: 'd1', cat: 'desk',   name: 'Executive Desk',           price: 680,   width: 140, depth: 70, height: 75, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
  { id: 'd2', cat: 'desk',   name: 'Studio Desk',              price: 299,   width: 110, depth: 55, height: 70, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
  { id: 'de1',cat: 'decor',  name: 'Rattan Side Table',        price: 120,   width: 40,  depth: 40, height: 45, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
  { id: 'de2',cat: 'decor',  name: 'Ceramic Vase',             price: 65,    width: 25,  depth: 25, height: 35, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
  { id: 'de3',cat: 'decor',  name: 'Throw Pillow Set',         price: 45,    width: 50,  depth: 50, height: 25, img: 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80' },
];

const state = {
  cart: [],
  plans: [],
  user: null,
  currentCategory: 'all',
};

/* ---------- Storage ---------- */
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.cart = data.cart || [];
      state.plans = data.plans || [];
      state.user = data.user || null;
    }
  } catch (e) { /* ignore */ }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ cart: state.cart, plans: state.plans, user: state.user }));
  } catch (e) { /* ignore */ }
}

/* ---------- Rendering ---------- */
function renderFurnitureList() {
  const list = document.getElementById('furnitureList');
  const empty = document.getElementById('emptyState');
  const title = document.getElementById('browseTitle');
  const filterCount = document.getElementById('filterCount');

  const items = state.currentCategory === 'all'
    ? FURNITURE
    : FURNITURE.filter(f => CATEGORIES[state.currentCategory].items.includes(f.cat));

  title.textContent = CATEGORIES[state.currentCategory].label;
  filterCount.textContent = `Showing ${items.length} item${items.length === 1 ? '' : 's'}`;

  if (items.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  list.innerHTML = items.map(f => `
    <div class="furniture-item" data-id="${f.id}" draggable="true" tabindex="0">
      <img src="${f.img}" alt="${f.name}" loading="lazy" />
      <span class="price">$${f.price.toFixed(0)}</span>
      <button class="remove" aria-label="Remove" data-remove="${f.id}">✕</button>
    </div>
  `).join('');

  attachItemHandlers();
}

function attachItemHandlers() {
  document.querySelectorAll('.furniture-item').forEach(el => {
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragend', onDragEnd);
    el.addEventListener('click', (e) => {
      if (e.target.closest('.remove')) return;
      addToCart(el.dataset.id);
    });
  });
}

function renderPlans() {
  const list = document.getElementById('plansList');
  list.innerHTML = state.plans.map(p => `
    <div class="flex justify-between items-center p-2 rounded cursor-pointer" data-plan="${p.id}">
      <div>
        <div class="plan-name">${p.name}</div>
        <div class="plan-date">${new Date(p.date).toLocaleDateString()}</div>
      </div>
      <button class="text-purple-600" onclick="window.location.hash='#/plan/${p.id}'">Open</button>
    </div>
  `).join('');
}

function renderCart() {
  const items = document.getElementById('cartItems');
  const total = document.getElementById('cartTotal');
  const countEl = document.getElementById('cartCount');
  const mobileCountEl = document.getElementById('mobileCartCount');

  if (state.cart.length === 0) {
    items.innerHTML = `<div class="empty-state">Your cart is empty. Add some furniture to get started!</div>`;
    total.textContent = '$0.00';
    countEl.textContent = '0';
    mobileCountEl.textContent = '0';
    return;
  }

  items.innerHTML = state.cart.map(item => {
    const f = FURNITURE.find(x => x.id === item.id);
    return `
      <div class="flex justify-between items-center p-2 rounded">
        <div class="flex items-center space-x-2">
          <img src="${f.img}" alt="${f.name}" class="w-16 h-16 object-cover rounded" />
          <div>
            <div class="font-semibold">${f.name}</div>
            <div class="text-sm text-gray-500">$${f.price.toFixed(0)}</div>
          </div>
        </div>
        <button class="text-red-600" data-remove-cart="${item.id}">Remove</button>
      </div>
    `;
  }).join('');

  const totalVal = state.cart.reduce((s, i) => s + FURNITURE.find(f => f.id === i.id).price, 0);
  total.textContent = '$' + totalVal.toFixed(2);
  countEl.textContent = state.cart.length;
  mobileCountEl.textContent = state.cart.length;
}

/* ---------- Drag & Drop ---------- */
function onDragStart(e) {
  const item = e.currentTarget;
  item.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', item.dataset.id); } catch (_) {}
}

function onDragEnd(e) {
  const item = e.currentTarget;
  item.classList.remove('dragging');
  // Remove dragged item from layer
  const layer = document.getElementById('furnitureLayer');
  const el = layer.querySelector(`.furniture-item[data-id="${item.dataset.id}"]`);
  if (el) el.remove();
}

function onDragOver(e) {
  e.preventDefault();
  const layer = document.getElementById('furnitureLayer');
  const rect = layer.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  layer.style.background = `rgba(99, 102, 241, 0.25)`;
  e.dataTransfer.dropEffect = 'move';
}

function onDragLeave() {
  const layer = document.getElementById('furnitureLayer');
  layer.style.background = '';
}

function onDrop(e) {
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  const layer = document.getElementById('furnitureLayer');
  const existing = layer.querySelector(`.furniture-item[data-id="${id}"]`);
  if (existing) existing.remove();

  const f = FURNITURE.find(x => x.id === id);
  if (!f) return;

  const rect = layer.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;

  const el = document.createElement('div');
  el.className = 'furniture-item';
  el.dataset.id = id;
  el.innerHTML = `
    <img src="${f.img}" alt="${f.name}" loading="lazy" />
    <span class="price">$${f.price.toFixed(0)}</span>
    <button class="remove" aria-label="Remove" data-remove="${id}">✕</button>
  `;
  el.style.left = (x * 100) + '%';
  el.style.top = (y * 100) + '%';
  el.style.width = '60%';
  el.style.height = '40%';
  el.style.transform = 'translate(-50%, -50%)';

  el.addEventListener('click', (ev) => {
    if (ev.target.closest('.remove')) return;
    addToCart(id);
  });
  el.addEventListener('dragstart', onDragStart);
  el.addEventListener('dragend', onDragEnd);

  layer.appendChild(el);
}

/* ---------- Cart ---------- */
function addToCart(id) {
  const existing = state.cart.find(i => i.id === id);
  if (existing) {
    existing.qty = (existing.qty || 1) + 1;
  } else {
    state.cart.push({ id, qty: 1 });
  }
  save();
  renderCart();
}

function removeFromCart(id) {
  state.cart = state.cart.filter(i => i.id !== id);
  save();
  renderCart();
}

/* ---------- Plans ---------- */
function savePlan(name) {
  const plan = {
    id: 'p' + Date.now(),
    name,
    date: new Date().toISOString(),
    items: state.cart.map(i => ({
      id: i.id,
      qty: i.qty,
    })),
  };
  state.plans.push(plan);
  save();
  renderPlans();
  renderCart();
  alert(`Plan "${name}" saved successfully!`);
}

function loadPlan(id) {
  const plan = state.plans.find(p => p.id === id);
  if (!plan) return;
  state.cart = plan.items.map(i => ({ id: i.id, qty: i.qty }));
  save();
  renderCart();
  alert(`Loaded plan: ${plan.name}`);
}

/* ---------- Auth ---------- */
function showAuth(type) {
  const body = document.getElementById('modalBody');
  const title = document.getElementById('modalTitle');
  if (type === 'login') {
    title.textContent = 'Login';
    body.innerHTML = `
      <label>Email <input type="email" id="loginEmail" class="w-full p-2 border rounded mb-2" /></label>
      <label>Password <input type="password" id="loginPass" class="w-full p-2 border rounded mb-2" /></label>
      <button class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700" id="doLogin">Login</button>
    `;
  } else {
    title.textContent = 'Create Account';
    body.innerHTML = `
      <label>Name <input type="text" id="signupName" class="w-full p-2 border rounded mb-2" /></label>
      <label>Email <input type="email" id="signupEmail" class="w-full p-2 border rounded mb-2" /></label>
      <label>Password <input type="password" id="signupPass" class="w-full p-2 border rounded mb-2" /></label>
      <button class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700" id="doSignup">Create</button>
    `;
  }
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

/* ---------- Init ---------- */
function init() {
  load();
  renderFurnitureList();
  renderCart();
  renderPlans();

  // Category buttons
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentCategory = btn.dataset.cat;
      renderFurnitureList();
    });
  });

  // Mobile menu
  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('mobileMenu').classList.toggle('hidden');
  });

  // Modal handlers
  document.getElementById('loginBtn').addEventListener('click', () => showAuth('login'));
  document.getElementById('signupBtn').addEventListener('click', () => showAuth('signup'));
  document.getElementById('logoutBtn').addEventListener('click', () => {
    state.user = null;
    save();
    renderAuthPanel();
    alert('Logged out');
  });
  document.getElementById('doLogin').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (email) {
      state.user = { email };
      save();
      renderAuthPanel();
      closeModal();
      alert('Welcome back!');
    }
  });
  document.getElementById('doSignup').addEventListener('click', () => {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    if (name && email) {
      state.user = { name, email };
      save();
      renderAuthPanel();
      closeModal();
      alert('Account created!');
    }
  });

  // Remove handlers
  document.getElementById('furnitureList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove]');
    if (btn) removeFromCart(btn.dataset.remove);
  });
  document.getElementById('cartItems').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-remove-cart]');
    if (btn) removeFromCart(btn.dataset.removeCart);
  });

  // Room interactions
  document.getElementById('room').addEventListener('dragover', onDragOver);
  document.getElementById('room').addEventListener('dragleave', onDragLeave);
  document.getElementById('room').addEventListener('drop', onDrop);
  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('furnitureLayer').innerHTML = '';
    state.cart = [];
    save();
    renderCart();
  });
  document.getElementById('checkoutBtn').addEventListener('click', () => {
    if (state.cart.length === 0) return;
    savePlan('My New Room');
  });

  // Plans list
  document.getElementById('plansList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-plan]');
    if (btn) loadPlan(btn.dataset.plan);
  });

  // Close modal on backdrop
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });
}

function renderAuthPanel() {
  const panel = document.getElementById('authPanel');
  if (!state.user) {
    panel.innerHTML = `
      <button class="w-full text-left bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700" id="loginBtn">Login</button>
      <button class="w-full text-left text-gray-600 py-2 rounded-lg hover:bg-gray-100" id="signupBtn">Create Account</button>
    `;
    document.getElementById('loginBtn').addEventListener('click', () => showAuth('login'));
    document.getElementById('signupBtn').addEventListener('click', () => showAuth('signup'));
  } else {
    panel.innerHTML = `
      <div class="text-sm text-gray-600">${state.user.name || state.user.email}</div>
      <button class="w-full text-left text-gray-600 py-2 rounded-lg hover:bg-gray-100" id="logoutBtn">Logout</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => {
      state.user = null;
      save();
      renderAuthPanel();
    });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script></script>
</body>
</html>
