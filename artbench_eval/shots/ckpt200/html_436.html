<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Simulation — Sun Across the Sky</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b1220;
    color: #e8ecf5;
    line-height: 1.5;
    overflow: hidden;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #sky {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, #1a2a4a 0%, #0a1228 45%, #050810 100%);
    transition: filter 0.3s ease;
  }
  #stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.6;
  }
  .star.big { opacity: 0.95; }
  .star.med { opacity: 0.55; }
  .star.sml { opacity: 0.35; }

  #horizon {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 14%;
    background: linear-gradient(to top, #0a0e18 0%, #141b2e 100%);
    pointer-events: none;
  }

  #sun {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff8b0, #ffb347 45%, #ff8a1f 70%, #c2410c 100%);
    box-shadow:
      0 0 40px rgba(255, 140, 20, 0.6),
      0 0 80px rgba(255, 120, 30, 0.4),
      inset -10px -10px 20px rgba(0,0,0,0.35),
      inset 10px 10px 20px rgba(255,255,255,0.25);
    transition: width 0.4s ease, height 0.4s ease, transform 0.4s ease, filter 0.4s ease;
    filter: drop-shadow(0 0 10px rgba(255,140,20,0.8));
  }
  #sun::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35), transparent 70%);
    pointer-events: none;
  }

  #sun-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(14px, 1.6vw, 18px);
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
    white-space: nowrap;
  }

  #controls {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: rgba(10, 18, 30, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    min-width: 220px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    color: #a8b4d0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .field input, .field select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8ecf5;
    padding: 8px 10px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.2s, background 0.2s;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #ff8a1f;
    background: rgba(255,255,255,0.1);
  }
  .field .hint {
    font-size: 11px;
    color: #6b7899;
  }

  #info {
    position: absolute;
    bottom: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(10, 18, 30, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    min-width: 220px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #c9d2e6;
  }
  .info-row .val { color: #fff; font-weight: 600; }

  #moon {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #e8ecf5;
    box-shadow: inset -8px -8px 16px rgba(0,0,0,0.35);
    transition: transform 0.6s ease, filter 0.6s ease;
  }
  .moon-surface {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), transparent 60%),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0.35), transparent 80%);
  }
  .moon-surface::before {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 40%; height: 40%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 70%);
    transform: translate(-50%, -50%);
  }

  #moon-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 11px;
    color: #c9d2e6;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    pointer-events: none;
  }

  #status {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 8px 14px;
    background: rgba(10, 18, 30, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    font-size: 12px;
    color: #a8b4d0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7899; }
  .status-dot.active { background: #4ade80; box-shadow: 0 0 10px #4ade80; }

  @media (max-width: 520px) {
    #controls { left: 12px; right: 12px; min-width: auto; }
    #info { bottom: 12px; left: 12px; right: 12px; }
    #sun { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="sky"></canvas>
  <div id="stars"></div>
  <div id="horizon"></div>
  <div id="sun"></div>
  <div id="sun-label"></div>
  <div id="moon"></div>
  <div id="moon-label"></div>
  <div id="controls">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" />
      <div class="hint">YYYY-MM-DD</div>
    </div>
    <div class="field">
      <label for="lat">Latitude</label>
      <input type="number" id="lat" step="0.01" min="-90" max="90" value="40.71" />
      <div class="hint">degrees N (positive)</div>
    </div>
    <div class="field">
      <label for="lon">Longitude</label>
      <input type="number" id="lon" step="0.01" min="-180" max="180" value="-74.01" />
      <div class="hint">degrees E (positive)</div>
    </div>
    <div class="field">
      <label for="moon">Moon Phase</label>
      <select id="moon">
        <option value="0">New Moon</option>
        <option value="0.25">Waxing Crescent</option>
        <option value="0.5">First Quarter</option>
        <option value="0.75">Waxing Gibbous</option>
        <option value="1">Full Moon</option>
        <option value="1.25">Waning Gibbous</option>
        <option value="1.5">Third Quarter</option>
        <option value="1.75">Waning Crescent</option>
      </select>
    </div>
    <button id="reset" class="field" style="border:none; background:none; cursor:pointer; padding:8px 0; font-size:12px; color:#a8b4d0;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Reset
    </button>
  </div>
  <div id="info">
    <div class="info-row"><span>Time</span><span class="val" id="time">--:--:--</span></div>
    <div class="info-row"><span>Day</span><span class="val" id="day">Day 1</span></div>
    <div class="info-row"><span>Location</span><span class="val" id="loc">40.71°N, -74.01°E</span></div>
    <div class="info-row"><span>Altitude</span><span class="val" id="alt">0°</span></div>
    <div class="info-row"><span>Azimuth</span><span class="val" id="az">0°</span></div>
  </div>
  <div id="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Paused</span>
  </div>
</div>

<script>
// ---------- Solar Geometry ----------
// Simplified solar position calculator
// Returns { azimuth: deg, altitude: deg, hourAngle: deg, sunAz: deg }
function solarPosition(date, lat, lon) {
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  const hours = date.getHours();
  const minutes = date.getMinutes();
  const seconds = date.getSeconds();

  // Day of year (1..366)
  const N = Math.floor((day - 1) + (month - 1) * 30.4167 + (year - 1970) * 365.25);
  const dayOfYear = N;

  // Approximate solar declination (simplified)
  const declination = 23.45 * Math.sin((2 * Math.PI / 365.25) * (dayOfYear - 80));

  // Hour angle (simplified — assumes 12h noon)
  const h = (hours - 12 + minutes / 60 + seconds / 3600) * 15;

  // Latitude (positive for N, negative for S)
  const phi = lat * (lat >= 0 ? 1 : -1);

  // Hour angle in radians
  const H = h * Math.PI / 12;

  // Right ascension (simplified — sidereal day)
  const sidereal = 2 * Math.PI * (dayOfYear + 2) / 365.25;

  // Convert to local time
  const localSidereal = sidereal - lon * Math.PI / 12;
  const localH = localSidereal * 15;

  // Altitude (in radians)
  const cosZ = Math.sin(phi) * Math.sin(declination) + Math.cos(phi) * Math.cos(declination) * Math.cos(localH);
  const altitude = Math.max(-1.0, Math.min(1.0, cosZ));
  const altDeg = Math.asin(altitude) * 180 / Math.PI;

  // Azimuth (in radians)
  const sinAz = Math.cos(declination) * Math.sin(localH) / Math.cos(altDeg * Math.PI / 180);
  const azDeg = Math.atan2(sinAz, Math.cos(declination) * Math.cos(localH) - Math.sin(declination) * Math.sin(phi)) * 180 / Math.PI;
  // Convert to 0..360 (east = 0°)
  let az = azDeg;
  if (az < 0) az += 360;

  return { azimuth: az, altitude: altDeg, hourAngle: localH * 15 };
}

// ---------- Moon Phase ----------
function moonPhase(dayOfYear) {
  // New moon on day 0 (Jan 6, 2025)
  const phase = (dayOfYear % 29.53) / 29.53;
  return phase;
}

// ---------- Starfield ----------
function generateStars(count = 180) {
  const container = document.getElementById('stars');
  container.innerHTML = '';
  const dpr = window.devicePixelRatio || 1;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'star ' + (Math.random() < 0.25 ? 'big' : Math.random() < 0.55 ? 'med' : 'sml');
    el.style.left = Math.random() * 100 + '%';
    el.style.top = Math.random() * 100 + '%';
    el.style.width = (Math.random() * 1.6 + 0.4) + 'px';
    el.style.height = el.style.width;
    container.appendChild(el);
  }
}

// ---------- Animation ----------
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
let rafId = null;
let paused = true;
let startTime = Date.now();
let elapsed = 0;
let lastTime = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * (window.devicePixelRatio || 1);
  canvas.height = H * (window.devicePixelRatio || 1);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  generateStars();
  render();
}

function tick(now) {
  if (paused) return;
  const dt = now - lastTime;
  lastTime = now;
  elapsed += dt;
  render();
  rafId = requestAnimationFrame(tick);
}

function render() {
  // Background
  ctx.clearRect(0, 0, W, H);

  // Gradient sky
  const t = elapsed / 10000; // 10s cycle
  const cycle = t % 1;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a2a4a');
  grad.addColorStop(0.35, '#2a3a6a');
  grad.addColorStop(0.65, '#0a1228');
  grad.addColorStop(1, '#050810');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars (subtle)
  const stars = document.getElementById('stars').children;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const x = s.offsetLeft / W;
    const y = s.offsetTop / H;
    const size = parseFloat(s.style.width);
    // Subtle shimmer
    ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.sin(elapsed * 0.002 + i) * 0.05})`;
    ctx.beginPath();
    ctx.arc(x * W, y * H, size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Horizon glow
  const horizon = document.getElementById('horizon');
  const horizonX = (W - horizon.offsetWidth) / 2;
  ctx.fillStyle = 'rgba(255, 210, 140, 0.25)';
  ctx.beginPath();
  ctx.moveTo(horizonX, H - horizon.offsetHeight);
  ctx.quadraticCurveTo(W, H - horizon.offsetHeight, W, H);
  ctx.lineTo(0, H);
  ctx.quadraticCurveTo(0, H - horizon.offsetHeight, horizonX, H - horizon.offsetHeight);
  ctx.closePath();
  ctx.fill();

  // Sun
  const date = new Date(startTime + elapsed);
  const { azimuth, altitude, hourAngle } = solarPosition(date, parseFloat(document.getElementById('lat').value), parseFloat(document.getElementById('lon').value));
  const sunEl = document.getElementById('sun');
  const sunLabel = document.getElementById('sun-label');

  // Sun size varies with altitude
  const sunSize = 120 + Math.max(0, altitude) * 0.6;
  sunEl.style.width = sunSize + 'px';
  sunEl.style.height = sunSize + 'px';

  // Position
  const horizonY = H - horizon.offsetHeight;
  const sunY = horizonY + Math.max(0, altitude) * (H - horizonY) * 0.55;
  const sunX = (W - sunSize) / 2 + Math.sin(azimuth * Math.PI / 180) * (sunSize / 2);
  sunEl.style.left = sunX + 'px';
  sunEl.style.top = sunY + 'px';

  // Label
  sunLabel.textContent = `${String(Math.round(altitude)).padStart(2,'0')}°`;

  // Moon (optional)
  const moonEl = document.getElementById('moon');
  const moonLabel = document.getElementById('moon-label');
  const moonPhaseVal = parseFloat(document.getElementById('moon').value);
  const moonAz = (azimuth + 90) % 360;
  const moonSize = 48;
  const moonX = (W - moonSize) / 2 + Math.sin(moonAz * Math.PI / 180) * (moonSize / 2);
  const moonY = sunY + (sunSize - moonSize) * 0.5;
  moonEl.style.left = moonX + 'px';
  moonEl.style.top = moonY + 'px';

  // Moon label
  const phaseText = document.getElementById('moon').options[document.getElementById('moon').selectedIndex].text;
  moonLabel.textContent = phaseText;

  // Info
  document.getElementById('time').textContent = date.toTimeString().slice(0, 8);
  document.getElementById('day').textContent = `${dayOfYearLabel(date)}`;
  document.getElementById('loc').textContent = `${document.getElementById('lat').value}°${document.getElementById('lat').value >= 0 ? 'N' : 'S'}, ${document.getElementById('lon').value}°${document.getElementById('lon').value >= 0 ? 'E' : 'W'}`;
  document.getElementById('alt').textContent = `${String(Math.round(altitude)).padStart(2,'0')}°`;
  document.getElementById('az').textContent = `${String(Math.round(moonAz)).padStart(2,'0')}°`;

  // Status
  document.getElementById('statusText').textContent = paused ? 'Paused' : 'Running';
  document.getElementById('statusDot').classList.toggle('active', !paused);
}

function dayOfYearLabel(date) {
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  return `${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

// ---------- Init ----------
function init() {
  resize();
  // Start at a specific time (10:00 AM)
  startTime = Date.now() - (10 * 3600 + 0) * 1000;
  lastTime = startTime;
  paused = true;
  rafId = requestAnimationFrame(tick);
}

// ---------- Events ----------
window.addEventListener('resize', resize);
document.getElementById('date').addEventListener('change', (e) => {
  const d = new Date(e.target.value + 'T00:00:00');
  if (!isNaN(d)) startTime = Date.now() - (10 * 3600 + 0) * 1000;
});
document.getElementById('reset').addEventListener('click', () => {
  startTime = Date.now() - (10 * 3600 + 0) * 1000;
  paused = true;
});
document.getElementById('lat').addEventListener('change', () => {
  if (rafId) cancelAnimationFrame(rafId);
  paused = true;
  rafId = requestAnimationFrame(tick);
});
document.getElementById('lon').addEventListener('change', () => {
  if (rafId) cancelAnimationFrame(rafId);
  paused = true;
  rafId = requestAnimationFrame(tick);
});
document.getElementById('moon').addEventListener('change', () => {
  if (rafId) cancelAnimationFrame(rafId);
  paused = true;
  rafId = requestAnimationFrame(tick);
});

// Keyboard
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    paused = !paused;
  }
});

init();
</script>
</body>
</html>
