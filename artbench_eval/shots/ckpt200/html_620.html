<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎬 Dynamic Graphic Video Generator</title>
<style>:root {
  --bg: #0b0f14;
  --bg-2: #111821;
  --surface: #161d28;
  --surface-2: #1c2633;
  --border: #263140;
  --text: #e6edf5;
  --text-dim: #8a95a5;
  --accent: #4f8cff;
  --accent-2: #7cc4ff;
  --danger: #ff5c7a;
  --success: #3ddc97;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 10px 30px rgba(0,0,0,0.4);
  --transition: 0.2s ease;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}

.app {
  display: grid;
  grid-template-columns: 380px 1fr;
  height: 100vh;
  min-height: 600px;
}

/* Panel */
.panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-right {
  border-right: none;
  border-left: 1px solid var(--border);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.panel-header h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.panel-section {
  padding: 16px 16px 8px;
  border-bottom: 1px solid var(--border);
}
.panel-section:last-child { border-bottom: none; }

.panel-section h2 {
  margin: 0 0 12px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-dim);
}

.elements-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 320px;
  overflow-y: auto;
}

.layer-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  cursor: grab;
  transition: background var(--transition), border-color var(--transition);
}
.layer-card:hover { background: #222d3e; }
.layer-card:active { cursor: grabbing; }
.layer-card.dragging { opacity: 0.4; }

.layer-icon {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
}
.layer-name {
  flex: 1;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.layer-meta {
  font-size: 11px;
  color: var(--text-dim);
  padding: 4px 8px;
  background: rgba(255,255,255,0.04);
  border-radius: 4px;
}
.layer-actions {
  display: flex;
  gap: 4px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition);
}
.btn:hover { background: #2a3648; border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #0a0f18;
}
.btn-primary:hover { background: var(--accent-2); }

/* Timeline */
.timeline {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  overflow-x: auto;
  scrollbar-width: thin;
}
.timeline::-webkit-scrollbar { height: 6px; }
.timeline::-webkit-scrollbar-thumb { background: #2a3648; border-radius: 3px; }

.layer-timeline {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 140px;
}
.layer-timeline .layer-icon { width: 22px; height: 22px; }
.layer-timeline .layer-name { font-size: 12px; }
.layer-timeline .layer-meta { font-size: 10px; padding: 3px 6px; }

.marker {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #4a5568;
  border: 2px solid var(--surface);
  cursor: pointer;
  transition: all var(--transition);
}
.marker.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,140,255,0.2); }

/* Canvas */
.canvas-wrap {
  position: relative;
  flex: 1;
  background: #000;
  overflow: hidden;
}
#previewCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}
#previewCanvas:active { cursor: grabbing; }

.canvas-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  background: rgba(11,15,20,0.5);
  color: var(--text-dim);
  font-size: 12px;
  pointer-events: none;
}
.overlay-text { opacity: 0.6; }

.canvas-meta {
  padding: 12px 16px;
  background: var(--surface-2);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-dim);
}

/* Responsive */
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
  .panel-right { border-left: none; border-top: 1px solid var(--border); }
  .panel-header { flex-direction: column; gap: 8px; }
  .panel-header h1 { font-size: 14px; }
  .canvas-meta { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel panel-left">
    <div class="panel-header">
      <h1>🎬 Video Studio</h1>
      <button id="exportBtn" class="btn btn-primary" disabled>Export MP4</button>
    </div>

    <div class="panel-section">
      <h2>Elements</h2>
      <div id="elementsList" class="elements-list"></div>
      <button class="btn btn-ghost" id="addLayerBtn">+ Add Element</button>
    </div>

    <div class="panel-section">
      <h2>Timeline</h2>
      <div id="timeline" class="timeline"></div>
    </div>

    <div class="panel-section">
      <h2>Preview</h2>
      <div class="preview-controls">
        <button id="playBtn" class="btn btn-ghost">▶ Play</button>
        <button id="pauseBtn" class="btn btn-ghost" disabled>❚❚ Pause</button>
        <button id="stopBtn" class="btn btn-ghost" disabled>■ Stop</button>
        <span id="timeLabel" class="time-label">00:00 / 00:00</span>
      </div>
    </div>
  </aside>

  <main class="panel panel-right">
    <div class="canvas-wrap">
      <canvas id="previewCanvas"></canvas>
      <div id="canvasOverlay" class="canvas-overlay">
        <div class="overlay-text">Drag layers to reorder</div>
        <div class="overlay-text">Use the timeline to scrub</div>
      </div>
    </div>
    <div class="canvas-meta">
      <div>Resolution: <span id="resLabel">1920×1080</span></div>
      <div>FPS: <span id="fpsLabel">24</span></div>
      <div>Duration: <span id="durLabel">0s</span></div>
    </div>
  </main>
</div>

<script>/* =========================================================
   Dynamic Graphic Video Generator
   ========================================================= */

const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('canvasOverlay');

const elementsList = document.getElementById('elementsList');
const timeline = document.getElementById('timeline');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const timeLabel = document.getElementById('timeLabel');
const exportBtn = document.getElementById('exportBtn');
const addLayerBtn = document.getElementById('addLayerBtn');

const resLabel = document.getElementById('resLabel');
const fpsLabel = document.getElementById('fpsLabel');
const durLabel = document.getElementById('durLabel');

/* ---------- State ---------- */
const state = {
  layers: [],
  currentLayerId: null,
  isPlaying: false,
  startTime: 0,
  currentTime: 0,
  lastFrame: 0,
  frameIndex: 0,
  totalFrames: 0,
  fps: 24,
  width: 1920,
  height: 1080,
  exportBlob: null,
};

/* ---------- Icons (SVG) ---------- */
const ICONS = {
  circle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>',
  square: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18"/></svg>',
  triangle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 12 12 22 2 12 12 2"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  line: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
};

/* ---------- Layer types ---------- */
const TYPE = { CIRCLE: 'circle', SQUARE: 'square', TRIANGLE: 'triangle', STAR: 'star', LINE: 'line', TEXT: 'text' };

const DEFAULTS = {
  [TYPE.CIRCLE]: { r: 60, fill: '#4f8cff', stroke: '#3a6fe0', strokeWidth: 2 },
  [TYPE.SQUARE]: { w: 120, h: 120, fill: '#4f8cff', stroke: '#3a6fe0', strokeWidth: 2 },
  [TYPE.TRIANGLE]: { size: 80, fill: '#4f8cff', stroke: '#3a6fe0', strokeWidth: 2 },
  [TYPE.STAR]: { size: 80, fill: '#4f8cff', stroke: '#3a6fe0', strokeWidth: 2 },
  [TYPE.LINE]: { w: 2, fill: '#4f8cff', stroke: '#3a6fe0', strokeWidth: 2 },
  [TYPE.TEXT]: { text: 'Hello', fontSize: 60, fill: '#4f8cff' },
};

/* ---------- Effects ---------- */
const EFFECTS = {
  FADE: { name: 'Fade', key: 'fade', params: { from: 0, to: 1 } },
  POP: { name: 'Pop', key: 'pop', params: { scale: 0.3, duration: 0.4 } },
  TRAIL: { name: 'Trail', key: 'trail', params: { count: 6, duration: 0.5 } },
  SLIDE: { name: 'Slide', key: 'slide', params: { dx: 0, dy: 0, duration: 0.5 } },
};

/* ---------- Utilities ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function createLayer(type) {
  const base = DEFAULTS[type];
  const layer = {
    id: 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    type,
    x: state.width / 2,
    y: state.height / 2,
    rotation: 0,
    scale: 1,
    opacity: 1,
    duration: 2,
    delay: 0,
    easing: 'easeInOutCubic',
    effect: 'fade',
    path: null, // { type: 'bezier', points: [{x,y},{x,y},{x,y},{x,y}] } or null
    ...base,
  };
  state.layers.push(layer);
  renderElementsList();
  renderTimeline();
  return layer;
}

function removeLayer(id) {
  state.layers = state.layers.filter(l => l.id !== id);
  renderElementsList();
  renderTimeline();
}

function reorderLayer(fromIndex, toIndex) {
  const [moved] = state.layers.splice(fromIndex, 1);
  state.layers.splice(toIndex, 0, moved);
  renderElementsList();
  renderTimeline();
}

/* ---------- Rendering ---------- */
function renderElementsList() {
  elementsList.innerHTML = '';
  state.layers.forEach((layer, i) => {
    const card = document.createElement('div');
    card.className = 'layer-card';
    card.draggable = true;
    card.dataset.id = layer.id;
    card.innerHTML = `
      <svg class="layer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[layer.type] || ICONS.circle}</svg>
      <span class="layer-name">${layer.type}</span>
      <span class="layer-meta">${layer.duration.toFixed(1)}s</span>
      <div class="layer-actions">
        <button class="btn btn-ghost" title="Edit">✎</button>
        <button class="btn btn-ghost" title="Delete" data-act="delete">✕</button>
      </div>
    `;
    card.addEventListener('dragstart', e => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', layer.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('click', e => {
      if (e.target.dataset.act === 'delete') {
        removeLayer(layer.id);
      } else {
        openEditor(layer);
      }
    });
    elementsList.appendChild(card);
  });
}

function renderTimeline() {
  timeline.innerHTML = '';
  state.layers.forEach((layer, i) => {
    const el = document.createElement('div');
    el.className = 'layer-timeline';
    el.innerHTML = `
      <svg class="layer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[layer.type] || ICONS.circle}</svg>
      <span class="layer-name">${layer.type}</span>
      <span class="layer-meta">${layer.duration.toFixed(1)}s</span>
    `;
    timeline.appendChild(el);
  });
}

function openEditor(layer) {
  state.currentLayerId = layer.id;
  const layerEl = state.layers.find(l => l.id === layer.id);
  if (!layerEl) return;
  const modal = document.createElement('div');
  modal.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:400px;width:100%;">
        <h3 style="margin:0 0 16px;">Edit Layer</h3>
        <label>Position X <input type="range" id="x" min="0" max="${state.width}" value="${layer.x}" style="width:100%;"/>
        <label>Position Y <input type="range" id="y" min="0" max="${state.height}" value="${layer.y}" style="width:100%;"/>
        <label>Rotation <input type="range" id="rot" min="-180" max="180" value="${layer.rotation}" style="width:100%;"/>
        <label>Scale <input type="range" id="sc" min="0" max="3" step="0.1" value="${layer.scale}" style="width:100%;"/>
        <label>Opacity <input type="range" id="op" min="0" max="1" step="0.05" value="${layer.opacity}" style="width:100%;"/>
        <label>Duration <input type="range" id="dur" min="0.1" max="10" step="0.1" value="${layer.duration}" style="width:100%;"/>
        <label>Delay <input type="range" id="dl" min="0" max="10" step="0.1" value="${layer.delay}" style="width:100%;"/>
        <label>Easing <select id="eas"><option value="easeInOutCubic" ${layer.easing==='easeInOutCubic'?'selected':''}>easeInOutCubic</option><option value="easeOutCubic" ${layer.easing==='easeOutCubic'?'selected':''}>easeOutCubic</option><option value="easeInCubic" ${layer.easing==='easeInCubic'?'selected':''}>easeInCubic</option><option value="linear" ${layer.easing==='linear'?'selected':''}>linear</option></select>
        <label>Effect <select id="eff"><option value="fade" ${layer.effect==='fade'?'selected':''}>Fade</option><option value="pop" ${layer.effect==='pop'?'selected':''}>Pop</option><option value="trail" ${layer.effect==='trail'?'selected':''}>Trail</option><option value="slide" ${layer.effect==='slide'?'selected':''}>Slide</option></select>
        <button onclick="closeEditor()">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.querySelector('#x').addEventListener('input', e => { layer.x = +e.target.value; });
  modal.querySelector('#y').addEventListener('input', e => { layer.y = +e.target.value; });
  modal.querySelector('#rot').addEventListener('input', e => { layer.rotation = +e.target.value; });
  modal.querySelector('#sc').addEventListener('input', e => { layer.scale = +e.target.value; });
  modal.querySelector('#op').addEventListener('input', e => { layer.opacity = +e.target.value; });
  modal.querySelector('#dur').addEventListener('input', e => { layer.duration = +e.target.value; });
  modal.querySelector('#dl').addEventListener('input', e => { layer.delay = +e.target.value; });
  modal.querySelector('#eas').addEventListener('change', e => { layer.easing = e.target.value; });
  modal.querySelector('#eff').addEventListener('change', e => { layer.effect = e.target.value; });
}

function closeEditor() {
  state.currentLayerId = null;
  document.querySelectorAll('.layer-card').forEach(c => c.classList.remove('dragging'));
  document.querySelectorAll('.layer-card').forEach(c => {
    c.addEventListener('dragstart', e => {
      const id = c.dataset.id;
      const layer = state.layers.find(l => l.id === id);
      if (!layer) return;
      c.classList.add('dragging');
      e.dataTransfer.setData('text/plain', id);
      e.dataTransfer.effectAllowed = 'move';
    });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
}

/* ---------- Canvas ---------- */
function resizeCanvas() {
  canvas.width = state.width;
  canvas.height = state.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, state.width, state.height);
}

function drawLayer(layer, t) {
  // Skip if before delay
  if (t < layer.delay) return;
  const elapsed = Math.max(0, t - layer.delay);
  const dur = layer.duration;
  const progress = Math.min(1, elapsed / dur);

  // Path interpolation
  if (layer.path) {
    const path = layer.path;
    const pts = path.points.map(p => ({ x: p.x, y: p.y }));
    const start = pts[0];
    const end = pts[pts.length - 1];
    const total = end.x - start.x;
    const localT = (progress * total) / (pts.length - 1);
    // Simple path following (bezier curve along path)
    const x = start.x + localT;
    const y = start.y + (end.y - start.y) * (localT / total);
    layer.x = x;
    layer.y = y;
  }

  // Apply easing
  const ease = {
    easeInOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    easeOutCubic: t => 1 - Math.pow(1 - t, 3),
    easeInCubic: t => t * t * t,
    linear: t => t,
  }[layer.easing];

  const eased = ease(progress);

  // Effect: fade
  if (layer.effect === 'fade') {
    layer.opacity = eased;
  }
  // Effect: pop
  else if (layer.effect === 'pop') {
    const s = lerp(1, layer.params.scale, eased);
    layer.scale = s;
    layer.opacity = lerp(1, 0, eased);
  }
  // Effect: trail
  else if (layer.effect === 'trail') {
    const count = layer.params.count;
    const step = dur / count;
    const localProgress = progress / step;
    const localT = Math.min(1, localProgress);
    const localEase = ease(localT);
    layer.opacity = localEase;
  }
  // Effect: slide
  else if (layer.effect === 'slide') {
    const dx = layer.params.dx;
    const dy = layer.params.dy;
    const s = lerp(1, 0, eased);
    layer.x = start.x + dx * s;
    layer.y = start.y + dy * s;
    layer.opacity = eased;
  }

  // Draw
  ctx.save();
  ctx.translate(layer.x, layer.y);
  ctx.rotate(layer.rotation * Math.PI / 180);
  ctx.scale(layer.scale, layer.scale);

  if (layer.type === TYPE.CIRCLE) {
    ctx.beginPath();
    ctx.arc(0, 0, layer.r, 0, Math.PI * 2);
    if (layer.fill) ctx.fillStyle = layer.fill;
    ctx.fill();
    if (layer.stroke && layer.strokeWidth) {
      ctx.lineWidth = layer.strokeWidth;
      ctx.strokeStyle = layer.stroke;
      ctx.stroke();
    }
  }
  else if (layer.type === TYPE.SQUARE) {
    ctx.beginPath();
    ctx.rect(-layer.w / 2, -layer.h / 2, layer.w, layer.h);
    if (layer.fill) ctx.fillStyle = layer.fill;
    ctx.fill();
    if (layer.stroke && layer.strokeWidth) {
      ctx.lineWidth = layer.strokeWidth;
      ctx.strokeStyle = layer.stroke;
      ctx.stroke();
    }
  }
  else if (layer.type === TYPE.TRIANGLE) {
    const size = layer.size;
    ctx.beginPath();
    ctx.moveTo(0, -size / 2);
    ctx.lineTo(-size / 2, size / 2);
    ctx.lineTo(size / 2, size / 2);
    ctx.closePath();
    if (layer.fill) ctx.fillStyle = layer.fill;
    ctx.fill();
    if (layer.stroke && layer.strokeWidth) {
      ctx.lineWidth = layer.strokeWidth;
      ctx.strokeStyle = layer.stroke;
      ctx.stroke();
    }
  }
  else if (layer.type === TYPE.STAR) {
    const size = layer.size;
    const spikes = 5;
    ctx.beginPath();
    const outer = size * 0.6;
    const inner = size * 0.4;
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const angle = (i * Math.PI) / spikes - Math.PI / 2;
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    if (layer.fill) ctx.fillStyle = layer.fill;
    ctx.fill();
    if (layer.stroke && layer.strokeWidth) {
      ctx.lineWidth = layer.strokeWidth;
      ctx.strokeStyle = layer.stroke;
      ctx.stroke();
    }
  }
  else if (layer.type === TYPE.LINE) {
    ctx.beginPath();
    ctx.moveTo(-layer.w / 2, 0);
    ctx.lineTo(layer.w / 2, 0);
    ctx.lineWidth = layer.strokeWidth || 2;
    ctx.strokeStyle = layer.stroke || '#4f8cff';
    ctx.stroke();
  }
  else if (layer.type === TYPE.TEXT) {
    ctx.font = `${layer.fontSize}px Inter, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = layer.fill || '#4f8cff';
    ctx.fillText(layer.text, 0, 0);
  }

  ctx.restore();
}

function renderFrame(t) {
  resizeCanvas();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, state.width, state.height);

  const activeLayers = state.layers.filter(l => t >= l.delay && t < l.delay + l.duration);
  activeLayers.forEach(layer => drawLayer(layer, t));
}

/* ---------- Animation Loop ---------- */
let rafId = null;
function loop(now) {
  if (!state.isPlaying) return;
  state.currentTime = now;
  renderFrame(now);
  state.lastFrame = now;
  rafId = requestAnimationFrame(loop);
}

/* ---------- Timeline scrubbing ---------- */
let scrubbing = false;
let scrubMarker = null;

function setScrubMarker(time) {
  const total = state.layers.reduce((s, l) => s + l.duration, 0);
  const pct = time / total;
  const markers = timeline.querySelectorAll('.marker');
  markers.forEach(m => m.classList.remove('active'));
  const idx = Math.min(Math.floor(pct * markers.length), markers.length - 1);
  if (idx >= 0) {
    markers[idx].classList.add('active');
  }
  timeLabel.textContent = formatTime(time) + ' / ' + formatTime(total);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

/* ---------- Export ---------- */
async function exportVideo() {
  if (state.layers.length === 0) {
    alert('Add some layers first!');
    return;
  }
  if (state.exportBlob) {
    const url = URL.createObjectURL(state.exportBlob);
    window.open(url);
    URL.revokeObjectURL(url);
    return;
  }

  const total = state.layers.reduce((s, l) => s + l.duration, 0);
  state.totalFrames = Math.max(1, Math.round(total * state.fps));
  state.frameIndex = 0;

  const canvasEl = canvas;
  const stream = canvasEl.captureStream(state.fps);
  const mime = 'video/webm;codecs=vp9,opus';
  const recorder = new MediaRecorder(stream, { mimeType: mime });

  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  const start = Date.now();
  let frameCount = 0;
  const onFrame = () => {
    if (frameCount >= state.totalFrames) {
      recorder.stop();
      return;
    }
    const t = frameCount / state.fps;
    renderFrame(t);
    frameCount++;
    if (frameCount % Math.max(1, Math.floor(state.fps / 2)) === 0) {
      canvasEl.toBlob((blob) => {
        if (blob) chunks.push(blob);
        onFrame();
      }, 'image/webp');
    } else {
      onFrame();
    }
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    state.exportBlob = blob;
    exportBtn.disabled = false;
    const url = URL.createObjectURL(blob);
    window.open(url);
    URL.revokeObjectURL(url);
  };

  recorder.onerror = () => {
    alert('Export failed. Try a different browser or codec.');
  };

  try {
    recorder.start();
  } catch (e) {
    // Fallback: render to video via HTMLVideoElement
    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.autoplay = true;
    const track = stream.getVideoTracks()[0];
    if (track) video.srcObject = stream;
    document.body.appendChild(video);
    video.play().catch(() => {});
  }

  onFrame();
}

/* ---------- Events ---------- */
playBtn.addEventListener('click', () => {
  if (state.isPlaying) {
    stopPlayback();
  } else {
    startPlayback();
  }
});
pauseBtn.addEventListener('click', stopPlayback);
stopBtn.addEventListener('click', stopPlayback);

exportBtn.addEventListener('click', exportVideo);

addLayerBtn.addEventListener('click', () => {
  const type = TYPE.CIRCLE;
  createLayer(type);
});

/* Drag reorder */
let dragIndex = -1;
elementsList.addEventListener('dragover', e => {
  e.preventDefault();
  const rect = elementsList.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const step = rect.height / (state.layers.length + 1);
  dragIndex = Math.max(0, Math.min(state.layers.length - 1, Math.floor(y / step)));
  const cards = elementsList.querySelectorAll('.layer-card');
  cards.forEach((c, i) => {
    if (i <= dragIndex) c.style.opacity = '0.4';
    else c.style.opacity = '1';
  });
});
elementsList.addEventListener('dragleave', () => {
  dragIndex = -1;
  elementsList.querySelectorAll('.layer-card').forEach(c => c.style.opacity = '1');
});
elementsList.addEventListener('drop', e => {
  e.preventDefault();
  if (dragIndex >= 0 && dragIndex < state.layers.length) {
    reorderLayer(dragIndex, dragIndex);
  }
  dragIndex = -1;
  elementsList.querySelectorAll('.layer-card').forEach(c => c.style.opacity = '1');
});

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (state.isPlaying) stopPlayback();
    else startPlayback();
  }
});

/* ---------- Playback ---------- */
function startPlayback() {
  state.isPlaying = true;
  playBtn.disabled = true;
  pauseBtn.disabled = false;
  stopBtn.disabled = false;
  state.startTime = performance.now();
  state.currentTime = state.startTime;
  setScrubMarker(0);
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
function stopPlayback() {
  state.isPlaying = false;
  playBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = true;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
}

/* ---------- Init ---------- */
function init() {
  resLabel.textContent = `${state.width}×${state.height}`;
  fpsLabel.textContent = state.fps;
  durLabel.textContent = '0s';

  // Seed a few layers
  createLayer(TYPE.CIRCLE);
  createLayer(TYPE.STAR);
  createLayer(TYPE.TEXT);
  createLayer(TYPE.LINE);
  createLayer(TYPE.SQUARE);

  // Build timeline markers
  const total = state.layers.reduce((s, l) => s + l.duration, 0);
  const markers = total / 5;
  for (let i = 0; i < 5; i++) {
    const m = document.createElement('div');
    m.className = 'marker';
    m.style.left = `${(i / 5) * 100}%`;
    m.title = `${formatTime(i * markers)} / ${formatTime(total)}`;
    timeline.appendChild(m);
  }
  const active = timeline.querySelector('.marker');
  if (active) active.classList.add('active');

  // Hide overlay after a moment
  setTimeout(() => {
    overlay.style.opacity = '0';
  }, 1500);
}

init();
</script></script>
