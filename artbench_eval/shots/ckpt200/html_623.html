<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Audio Effect Tool</title>
  <style>* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #0f172a;
  color: #e2e8f0;
  font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

.app {
  max-width: 880px;
  margin: 0 auto;
  padding: 32px 24px 48px;
}

.header {
  text-align: center;
  margin-bottom: 24px;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: #60a5fa;
}

.logo h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: -0.02em;
}

.tagline {
  margin: 4px 0 0;
  color: #94a3b8;
  font-size: 14px;
}

.main {
  display: grid;
  gap: 24px;
}

.panel {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 20px;
}

.panel h2 {
  margin: 0 0 16px;
  font-size: 16px;
  color: #f1f5f9;
  letter-spacing: -0.01em;
}

.dropzone {
  border: 2px dashed #334155;
  border-radius: 12px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  background: #1e293b;
}

.dropzone:hover, .dropzone.drag {
  border-color: #60a5fa;
  background: #1e293b;
}

.dropzone-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: #94a3b8;
}

.dropzone-content p {
  margin: 4px 0 0;
  font-weight: 500;
  color: #e2e8f0;
}

.dropzone-content span {
  font-size: 13px;
  color: #64748b;
}

.file-info {
  margin-top: 16px;
  padding: 14px;
  background: #0f172a;
  border-radius: 10px;
  border: 1px solid #334155;
}

.file-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.file-name {
  font-weight: 600;
  color: #f1f5f9;
  font-size: 15px;
}

.file-meta {
  font-size: 13px;
  color: #94a3b8;
}

.hidden { display: none !important; }

.controls-panel {
  display: grid;
  gap: 16px;
}

.control {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px;
  align-items: center;
}

.control label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #cbd5e1;
}

.control label span {
  color: #60a5fa;
  font-weight: 600;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  background: #334155;
  border-radius: 999px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #60a5fa;
  cursor: pointer;
  border: 3px solid #1e293b;
  box-shadow: 0 2px 8px rgba(96, 165, 250, 0.4);
  transition: transform 0.15s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}

input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #60a5fa;
  cursor: pointer;
  border: 3px solid #1e293b;
}

.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.btn:focus-visible {
  outline: 2px solid #60a5fa;
  outline-offset: 2px;
}

.btn-primary {
  background: #60a5fa;
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  background: #3b82f6;
  transform: translateY(-1px);
}

.btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-secondary {
  background: #334155;
  color: #e2e8f0;
}

.btn-secondary:hover:not(:disabled) {
  background: #475569;
  transform: translateY(-1px);
}

.btn-secondary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-accent {
  background: #f59e0b;
  color: #1e293b;
}

.btn-accent:hover:not(:disabled) {
  background: #fbbf24;
  transform: translateY(-1px);
}

.btn-accent:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.preview-panel {
  display: grid;
  gap: 12px;
}

.preview-wave {
  height: 80px;
  background: #0f172a;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.preview-wave canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.preview-panel audio {
  width: 100%;
}

.status-panel {
  text-align: center;
  padding: 16px;
}

.status {
  font-size: 14px;
  color: #94a3b8;
  min-height: 20px;
}

.status.success { color: #10b981; }
.status.error { color: #f87171; }
.status.processing { color: #fbbf24; }

.footer {
  text-align: center;
  margin-top: 24px;
  color: #64748b;
  font-size: 13px;
}

/* Responsive */
@media (max-width: 640px) {
  .app { padding: 20px 16px 32px; }
  .logo h1 { font-size: 22px; }
  .control { grid-template-columns: 1fr; }
  .actions { grid-template-columns: 1fr; }
  .preview-wave { height: 60px; }
}
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M19 5a9 9 0 0 1 0 14"/>
        </svg>
        <h1>Echo Audio Tool</h1>
      </div>
      <p class="tagline">Add echo effects to your audio files</p>
    </header>

    <main class="main">
      <section class="panel upload-panel">
        <label class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="audio/*" hidden />
          <div class="dropzone-content">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
            <p>Click to upload or drag & drop</p>
            <span>Supports MP3, WAV, OGG, M4A</span>
          </div>
        </label>
        <input type="file" id="fileInput" accept="audio/*" hidden />
        <div id="fileInfo" class="file-info hidden">
          <div class="file-row">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/></svg>
            <div>
              <div class="file-name" id="fileName"></div>
              <div class="file-meta" id="fileMeta"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel controls-panel">
        <h2>Effect Settings</h2>
        <div class="control">
          <label for="delaySlider">Delay <span id="delayVal">150</span> ms</label>
          <input type="range" id="delaySlider" min="10" max="500" step="1" value="150" />
        </div>
        <div class="control">
          <label for="feedbackSlider">Feedback <span id="feedbackVal">30</span>%</label>
          <input type="range" id="feedbackSlider" min="0" max="100" step="1" value="30" />
        </div>
        <div class="control">
          <label for="wetSlider">Wet / Dry <span id="wetVal">50</span>%</label>
          <input type="range" id="wetSlider" min="0" max="100" step="1" value="50" />
        </div>
        <div class="control">
          <label for="sampleRateSlider">Sample Rate <span id="sampleRateVal">48000</span> Hz</label>
          <input type="range" id="sampleRateSlider" min="22050" max="96000" step="1000" value="48000" />
        </div>

        <div class="actions">
          <button id="previewBtn" class="btn btn-primary" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Preview
          </button>
          <button id="playBtn" class="btn btn-secondary" disabled>
            <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Play
          </button>
          <button id="saveBtn" class="btn btn-accent" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save as WAV
          </button>
        </div>
      </section>

      <section class="panel preview-panel hidden" id="previewPanel">
        <h2>Preview</h2>
        <div class="preview-wave" id="previewWave"></div>
        <audio id="previewAudio" controls></audio>
      </section>

      <section class="panel status-panel">
        <div id="status" class="status">Ready</div>
      </section>
    </main>

    <footer class="footer">
      <small>Built with Web Audio API · Works in modern browsers</small>
    </footer>
  </div>

  <script>(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);

  const fileInput = $('fileInput');
  const dropzone = $('dropzone');
  const fileInfo = $('fileInfo');
  const fileNameEl = $('fileName');
  const fileMetaEl = $('fileMeta');
  const delaySlider = $('delaySlider');
  const feedbackSlider = $('feedbackSlider');
  const wetSlider = $('wetSlider');
  const sampleRateSlider = $('sampleRateSlider');
  const delayVal = $('delayVal');
  const feedbackVal = $('feedbackVal');
  const wetVal = $('wetVal');
  const sampleRateVal = $('sampleRateVal');
  const previewBtn = $('previewBtn');
  const playBtn = $('playBtn');
  const saveBtn = $('saveBtn');
  const previewPanel = $('previewPanel');
  const previewAudio = $('previewAudio');
  const previewWave = $('previewWave');
  const statusEl = $('status');

  const state = {
    audioCtx: null,
    source: null,
    buffer: null,
    processedBuffer: null,
    gainNode: null,
    delayNode: null,
    feedbackGain: null,
    wetGain: null,
    playing: false,
    processed: false,
  };

  // ---------- Helpers ----------
  const formatBytes = (bytes) => {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  };

  const formatDuration = (seconds) => {
    if (!isFinite(seconds)) return '—';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  };

  const setStatus = (text, type = '') => {
    statusEl.textContent = text;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  };

  // ---------- File handling ----------
  const handleFile = (file) => {
    if (!file) return;
    if (!file.type.startsWith('audio/')) {
      setStatus('Please upload an audio file', 'error');
      return;
    }
    if (file.size > 100 * 1024 * 1024) {
      setStatus('File too large (max 100MB)', 'error');
      return;
    }

    setStatus('Loading audio...', 'processing');
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const arrayBuffer = e.target.result;
        loadAudio(arrayBuffer);
      } catch (err) {
        setStatus('Failed to decode audio', 'error');
      }
    };
    reader.onerror = () => setStatus('Failed to read file', 'error');
    reader.readAsArrayBuffer(file);
  };

  const loadAudio = async (arrayBuffer) => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      state.audioCtx = ctx;
      state.buffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
      state.sampleRate = ctx.sampleRate;

      const duration = state.buffer.duration;
      const channels = state.buffer.numberOfChannels;
      const size = state.buffer.length * channels * 4;

      fileNameEl.textContent = fileInput.files[0].name;
      fileMetaEl.textContent = `${formatDuration(duration)} · ${channels} ch · ${formatBytes(size)}`;
      fileInfo.classList.remove('hidden');

      setStatus(`Loaded "${fileNameEl.textContent}"`, 'success');
      updateControls();
      enableControls(true);
    } catch (err) {
      setStatus('Unsupported audio format', 'error');
    }
  };

  // ---------- Controls ----------
  const updateControls = () => {
    const delay = parseInt(delaySlider.value, 10);
    const feedback = parseInt(feedbackSlider.value, 10) / 100;
    const wet = parseInt(wetSlider.value, 10) / 100;
    const sampleRate = parseInt(sampleRateSlider.value, 10);

    delayVal.textContent = delay;
    feedbackVal.textContent = feedback * 100;
    wetVal.textContent = wet * 100;
    sampleRateVal.textContent = sampleRate;

    delaySlider.min = 10;
    delaySlider.max = sampleRate / 1000;
    delaySlider.value = Math.max(10, Math.min(sampleRate / 1000, delay));
    delaySlider.step = 1;

    feedbackSlider.min = 0;
    feedbackSlider.max = 100;
    feedbackSlider.value = feedback * 100;

    wetSlider.min = 0;
    wetSlider.max = 100;
    wetSlider.value = wet * 100;

    sampleRateSlider.min = 22050;
    sampleRateSlider.max = 96000;
    sampleRateSlider.value = sampleRate;
    sampleRateSlider.step = 1000;
  };

  const enableControls = (enabled) => {
    previewBtn.disabled = !enabled;
    playBtn.disabled = !enabled;
    saveBtn.disabled = !enabled;
  };

  // ---------- Echo processing ----------
  const buildEchoChain = () => {
    const ctx = state.audioCtx;
    const bufferSize = state.buffer ? state.buffer.length : ctx.sampleRate * 4;
    const buffer = ctx.createBuffer(2, bufferSize, ctx.sampleRate);

    const delayNode = ctx.createDelay(parseInt(delaySlider.value, 10) / 1000);
    const feedbackGain = ctx.createGain();
    const wetGain = ctx.createGain();
    const dryGain = ctx.createGain();

    feedbackGain.gain.value = parseInt(feedbackSlider.value, 10) / 100;
    wetGain.gain.value = parseInt(wetSlider.value, 10) / 100;
    dryGain.gain.value = 1 - wetGain.gain.value;

    const input = ctx.createGain();
    const output = ctx.createGain();

    input.connect(delayNode);
    delayNode.connect(feedbackGain);
    feedbackGain.connect(delayNode);
    delayNode.connect(wetGain);
    wetGain.connect(output);
    input.connect(dryGain);
    dryGain.connect(output);

    output.connect(ctx.destination);

    state.delayNode = delayNode;
    state.feedbackGain = feedbackGain;
    state.wetGain = wetGain;
    state.dryGain = dryGain;
    state.input = input;
    state.output = output;
  };

  const processBuffer = async () => {
    if (!state.buffer) return;
    const ctx = state.audioCtx;
    if (!ctx) return;

    buildEchoChain();

    const src = ctx.createBufferSource();
    src.buffer = state.buffer;

    const srcLeft = ctx.createBufferSource();
    srcLeft.buffer = state.buffer;
    const srcRight = ctx.createBufferSource();
    srcRight.buffer = state.buffer;

    const leftChannel = state.buffer.getChannelData(0);
    const rightChannel = state.buffer.getChannelData(1);

    const outLeft = new Float32Array(leftChannel.length);
    const outRight = new Float32Array(rightChannel.length);

    const bufferSize = state.buffer.length;
    const delaySamples = parseInt(delaySlider.value, 10);
    const feedback = parseInt(feedbackSlider.value, 10) / 100;
    const wet = parseInt(wetSlider.value, 10) / 100;

    for (let i = 0; i < bufferSize; i++) {
      const l = leftChannel[i];
      const r = rightChannel[i];

      outLeft[i] = l * dryGain.gain.value;

      // Delay feedback
      const delayIndex = i - delaySamples;
      if (delayIndex >= 0) {
        outLeft[i] += leftChannel[delayIndex] * feedback * wetGain.gain.value;
      }

      outRight[i] = r * dryGain.gain.value;
      if (delayIndex >= 0) {
        outRight[i] += rightChannel[delayIndex] * feedback * wetGain.gain.value;
      }
    }

    const processed = ctx.createBuffer(2, bufferSize, ctx.sampleRate);
    processed.copyToChannel(outLeft, 0);
    processed.copyToChannel(outRight, 1);

    srcLeft.connect(state.input);
    srcRight.connect(state.input);
    src.connect(state.input);

    srcLeft.buffer = processed;
    srcRight.buffer = processed;

    state.processedBuffer = processed;
    state.processed = true;

    setStatus('Echo effect applied', 'success');
    enableControls(true);

    // Preview
    previewBtn.disabled = false;
    previewBtn.textContent = 'Play';
    previewBtn.querySelector('svg').innerHTML = '<path d="M8 5v14l11-7z"/>';
    previewPanel.classList.remove('hidden');
    drawWave(state.processedBuffer);
  };

  // ---------- Playback ----------
  const playProcessed = () => {
    if (!state.processedBuffer) return;
    const ctx = state.audioCtx;
    if (ctx.state === 'suspended') ctx.resume();

    const src = new Audio();
    src.src = URL.createObjectURL(new Blob([state.processedBuffer.getChannelData(0)], { type: 'audio/wav' }));
    src.play().catch(() => {});
  };

  const playPreview = () => {
    if (!state.processedBuffer) return;
    const ctx = state.audioCtx;
    if (ctx.state === 'suspended') ctx.resume();

    if (state.source) {
      try { state.source.stop(); } catch (e) {}
      state.source = null;
    }

    state.source = ctx.createBufferSource();
    state.source.buffer = state.processedBuffer;
    state.source.connect(ctx.destination);
    state.source.start();
    state.playing = true;
  };

  const stopPreview = () => {
    if (state.source) {
      try { state.source.stop(); } catch (e) {}
      state.source = null;
    }
    state.playing = false;
  };

  // ---------- Waveform visualization ----------
  const drawWave = (buffer) => {
    const canvas = previewWave.querySelector('canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = previewWave.clientWidth * dpr;
    canvas.height = previewWave.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const data = buffer.getChannelData(0);
    const samples = data.length;
    const step = Math.max(1, Math.floor(samples / width));

    const max = Math.max(...data);
    const min = Math.min(...data);
    const range = max - min || 1;
    const centerY = height / 2;

    ctx.clearRect(0, 0, width, height);
    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (let i = 0; i < samples; i += step) {
      const v = data[i];
      const y = centerY - (v - min) / range * (height - 20);
      if (i === 0) ctx.moveTo(i, y);
      else ctx.lineTo(i, y);
    }
    ctx.stroke();
  };

  const resizeWave = () => {
    if (!state.processedBuffer) return;
    drawWave(state.processedBuffer);
  };

  // ---------- Save WAV ----------
  const saveWav = () => {
    if (!state.processedBuffer) return;
    const ctx = state.audioCtx;
    const sampleRate = ctx.sampleRate;
    const numChannels = 2;
    const numSamples = state.processedBuffer.length;
    const bytesPerSample = 2;
    const byteRate = sampleRate * numChannels * bytesPerSample;
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = numSamples * numChannels * bytesPerSample;

    const buffer = new ArrayBuffer(44 + dataSize);
    const view = new DataView(buffer);

    const writeStr = (offset, str) => {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    };

    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, byteRate, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bytesPerSample, true);
    view.setUint16(36, 0, true);
    writeStr(38, 'data');
    view.setUint32(42, dataSize, true);

    const offset = 44;
    const channels = state.processedBuffer.numberOfChannels;
    for (let c = 0; c < channels; c++) {
      const channelData = state.processedBuffer.getChannelData(c);
      for (let i = 0; i < numSamples; i++) {
        const s = Math.max(-1, Math.min(1, channelData[i]));
        const val = s < 0 ? s * 0x8000 : s * 0x7FFF;
        view.setInt16(offset + i * 2, val, true);
      }
    }

    const blob = new Blob([buffer], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileNameEl.textContent.replace(/\.[^.]+$/, '') + '_echo.wav';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  // ---------- Event wiring ----------
  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('drag');
  });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  delaySlider.addEventListener('input', updateControls);
  feedbackSlider.addEventListener('input', updateControls);
  wetSlider.addEventListener('input', updateControls);
  sampleRateSlider.addEventListener('input', updateControls);

  previewBtn.addEventListener('click', () => {
    if (!state.processed) {
      processBuffer();
    } else {
      playPreview();
    }
  });

  playBtn.addEventListener('click', () => {
    if (!state.processed) {
      processBuffer();
    } else {
      playProcessed();
    }
  });

  saveBtn.addEventListener('click', () => {
    if (!state.processed) {
      setStatus('Apply echo effect first', 'error');
      return;
    }
    saveWav();
  });

  previewAudio.addEventListener('play', () => state.playing = true);
  previewAudio.addEventListener('pause', () => state.playing = false);
  previewAudio.addEventListener('ended', () => state.playing = false);

  previewPanel.addEventListener('click', () => {
    if (state.playing) {
      previewAudio.pause();
    } else {
      previewAudio.play();
    }
  });

  window.addEventListener('resize', resizeWave);
  window.addEventListener('load', () => {
    if (state.audioCtx) state.audioCtx.resume();
  });

  // Keyboard shortcut: Space to toggle play
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.target.closest('input, textarea')) {
      e.preventDefault();
      if (state.playing) {
        previewAudio.pause();
      } else {
        previewAudio.play();
      }
    }
  });
