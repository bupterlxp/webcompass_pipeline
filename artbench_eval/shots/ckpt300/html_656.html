<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Room Reservation — User</title>
<style>/* styles.css */
:root {
  --primary: #3b82f6;
  --primary-dark: #2563eb;
  --primary-soft: #dbeafe;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #60a5fa;
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg: 0 10px 30px rgba(15,23,42,.12);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.app {
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  display: grid;
  place-items: center;
  font-size: 22px;
}

.brand h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

.subtitle {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-chip strong {
  color: var(--text);
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow);
}

.card h2 {
  margin: 0 0 16px;
  font-size: 18px;
  font-weight: 700;
}

.muted {
  color: var(--muted);
  font-size: 14px;
  margin: 0 0 16px;
}

.room-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.room-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  transition: all .2s ease;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.room-card:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.room-card h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
}

.room-card .capacity {
  font-size: 13px;
  color: var(--muted);
}

.room-card .actions {
  margin-top: auto;
  display: flex;
  gap: 8px;
}

.btn {
  appearance: none;
  border: 1px solid transparent;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover { background: var(--primary-dark); }

.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.btn-ghost:hover {
  background: var(--bg);
  border-color: var(--text);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: var(--danger);
}

.btn-danger:hover { background: var(--danger); color: white; }

.btn-success {
  background: var(--success);
  color: white;
}

.btn-success:hover { background: #059669; }

.btn-info {
  background: var(--info);
  color: white;
}

.btn-info:hover { background: #2563eb; }

.btn-sm { padding: 6px 10px; font-size: 13px; }

.reservation-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.reservation-item {
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}

.reservation-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.reservation-meta h4 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
}

.reservation-meta p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}

.status-pill {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.status-pill.confirmed { background: var(--success); color: white; }
.status-pill.pending  { background: var(--warning); color: #fff; }
.status-pill.cancelled { background: var(--danger); color: white; }
.status-pill.rejected  { background: #94a3b8; color: white; }

.reservation-actions {
  display: flex;
  gap: 4px;
  justify-self: end;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: var(--bg);
  padding: 4px;
  border-radius: 10px;
}

.tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: var(--muted);
  transition: all .2s ease;
}

.tab:hover { color: var(--text); }

.tab.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}

.tab-content { display: none; }

.tab-content.active { display: block; animation: fadeIn .25s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}

.empty-state svg {
  width: 64px;
  height: 64px;
  margin: 0 auto 12px;
  color: var(--border);
}

.login-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: var(--surface);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow-lg);
}

.logo-big {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  display: grid;
  place-items: center;
  font-size: 32px;
  margin-bottom: 16px;
}

.login-card h1 {
  margin: 0 0 4px;
  font-size: 24px;
  font-weight: 700;
}

.hint {
  margin: 16px 0 0;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.field input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color .2s ease;
}

.field input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

/* Responsive */
@media (max-width: 600px) {
  .topbar { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
  .user-chip { width: 100%; justify-content: space-between; }
  .card { padding: 18px; }
  .reservation-item { grid-template-columns: 1fr; }
  .reservation-actions { justify-self: start; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">📅</div>
      <div>
        <h1>Meeting Room Reservation</h1>
        <p class="subtitle">User Dashboard</p>
      </div>
    </div>
    <div class="user-chip">
      <span>Welcome, <strong id="user-name"></strong></span>
      <button id="logout-btn" class="btn btn-ghost">Logout</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Available Rooms</h2>
      <p class="muted" id="date-label"></p>
      <div id="room-list" class="room-grid"></div>
    </section>

    <section class="card">
      <h2>My Reservations</h2>
      <div id="my-reservations" class="reservation-list"></div>
    </section>
  </main>
</div>
