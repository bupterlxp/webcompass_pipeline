<!DOCTYPE html>
<html>
<head><title>ICMS Login</title></head>
<body>
<h2>Login</h2>
<form method="POST">
  {{ form.hidden_tag() }}
  <p>{{ form.email.label }}<br>{{ form.email(size=40) }}</p>
  <p>{{ form.password.label }}<br>{{ form.password(size=40) }}</p>
  <p><input type="submit" value="Login"></p>
</form>
<p><a href="{{ url_for('register') }}">Register</a></p>
</body>
</html>
