<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subtitle Generator</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-2: #1e293b;
    --bg-3: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #60a5fa;
    --accent-2: #a78bfa;
    --danger: #ef4444;
    --success: #10b981;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(96,165,250,.15), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(167,139,250,.15), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    line-height: 1.6;
    font-size: 15px;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    padding: 20px;
    height: 100vh;
    overflow: hidden;
  }

  /* Left: video + timeline */
  .video-panel {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  #video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0b1220;
    object-fit: contain;
    display: block;
  }
  .video-controls {
    padding: 12px;
    background: rgba(0,0,0,.35);
    border-top: 1px solid rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .time-display {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--accent);
    min-width: 90px;
    text-align: right;
  }
  .play-btn {
    background: var(--accent);
    color: #0b1220;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform .15s, background .2s;
  }
  .play-btn:hover { background: #4f7cff; transform: scale(1.03); }
  .play-btn:active { transform: scale(.98); }

  /* Right: editor */
  .editor-panel {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .panel-header h2 {
    margin: 0;
    font-size: 16px;
    letter-spacing: .3px;
  }
  .panel-body {
    flex: 1;
    overflow: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .style-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .style-row label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .8px;
  }
  .style-row input, .style-row select {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    transition: border-color .2s, background .2s;
  }
  .style-row input:focus, .style-row select:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(96,165,250,.08);
  }
  .style-row select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 18px) 50%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
    padding-right: 24px;
  }
  .subtitle-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .subtitle-line {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    transition: border-color .2s, background .2s;
  }
  .subtitle-line:hover { border-color: rgba(96,165,250,.4); }
  .subtitle-line .time {
    color: var(--accent);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    margin-right: 8px;
  }
  .subtitle-line .text {
    flex: 1;
    word-break: break-word;
  }
  .subtitle-line .del {
    color: var(--danger);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px;
  }
  .subtitle-line .del:hover { color: #f87171; }
  .subtitle-line .edit {
    color: var(--accent-2);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px;
  }
  .subtitle-line .edit:hover { color: #c084fc; }
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 24px;
    font-size: 13px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-3);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: var(--shadow);
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .editor-panel { order: -1; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="video-panel">
    <video id="video" controls playsinline></video>
    <div class="video-controls">
      <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
      <button class="play-btn" id="playBtn" aria-label="Play/Pause">▶ Play</button>
    </div>
  </div>

  <div class="editor-panel">
    <div class="panel-header">
      <h2>Subtitles</h2>
      <span id="lineCount" class="badge">0 lines</span>
    </div>
    <div class="panel-body">
      <div class="style-row">
        <label for="fontFamily">Font</label>
        <select id="fontFamily">
          <option value="'Arial', sans-serif">Arial</option>
          <option value="'Georgia', serif">Georgia</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="'Helvetica', sans-serif">Helvetica</option>
          <option value="'Verdana', sans-serif">Verdana</option>
          <option value="'Impact', sans-serif">Impact</option>
        </select>
        <label for="fontSize">Size</label>
        <input type="number" id="fontSize" min="12" max="60" value="24">
      </div>
      <div class="style-row">
        <label for="fontColor">Color</label>
        <input type="color" id="fontColor" value="#ffffff">
        <label for="bgColor">Background</label>
        <input type="color" id="bgColor" value="#000000">
        <label for="lineHeight">Line Height</label>
        <input type="number" id="lineHeight" min="1" max="4" step=".1" value="1.4">
      </div>

      <div id="subtitleList" class="subtitle-list">
        <div class="empty-state" id="emptyState">No subtitles yet. Click <strong>Add Line</strong> to begin.</div>
      </div>

      <div class="editor-footer">
        <textarea id="subtitleEditor" placeholder="Enter subtitle text. Press Enter to add a line. Use format: 00:00:00,000 --> 00:00:05,000\nText here\n" rows="8"></textarea>
        <div class="editor-actions">
          <button class="play-btn" id="addLineBtn">+ Add Line</button>
          <button class="play-btn" id="togglePlayBtn">▶ Toggle Play</button>
          <button class="play-btn" id="exportBtn">💾 Export VTT</button>
          <button class="play-btn" id="mergeBtn">🎬 Merge Video</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Subtitle Generator
   ========================================================= */

const $ = (id) => document.getElementById(id);
const video = $('video');
const timeDisplay = $('timeDisplay');
const playBtn = $('playBtn');
const emptyState = $('emptyState');
const subtitleList = $('subtitleList');
const lineCount = $('lineCount');
const subtitleEditor = $('subtitleEditor');
const addLineBtn = $('addLineBtn');
const togglePlayBtn = $('togglePlayBtn');
const exportBtn = $('exportBtn');
const mergeBtn = $('mergeBtn');

const state = {
  subtitles: [],
  nextId: 1,
  playing: false,
  playingInterval: null,
  style: {
    fontFamily: "'Arial', sans-serif",
    fontSize: 24,
    fontColor: '#ffffff',
    bgColor: '#000000',
    lineHeight: 1.4,
  },
};

// ---------- Utilities ----------
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec - Math.floor(sec)) * 1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
}

function parseTime(str) {
  const m = str.trim().match(/:(\d{1,2}):(\d{1,2}):(\d{1,2}),(\d{3})/);
  if (!m) return NaN;
  const h = parseInt(m[1],10) || 0;
  const mm = parseInt(m[2],10);
  const ss = parseInt(m[3],10);
  const ms = parseInt(m[4],10);
  return h * 3600 + mm * 60 + ss + ms / 1000;
}

function parseTextLine(line) {
  const match = line.match(/^(.+?)(?:\s*-->.*|$)/);
  return match ? match[1].trim() : '';
}

function formatLine(line) {
  const text = parseTextLine(line);
  if (!text) return line;
  return `${fmtTime(line.start)} --> ${fmtTime(line.end)}\n${text}\n`;
}

function escapeVTT(str) {
  return str.replace(/"/g, '&quot;').replace(/(\r\n|\n|\r)/gm, ' ');
}

function showToast(msg) {
  let t = document.querySelector('.toast');
  if (!t) {
    t = document.createElement('div');
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Video sync ----------
function updatePlayState() {
  state.playing = video.paused;
  playBtn.textContent = state.playing ? '▶ Play' : '❚❚ Pause';
  playBtn.setAttribute('aria-label', state.playing ? 'Play' : 'Pause');
}
video.addEventListener('play', updatePlayState);
video.addEventListener('pause', updatePlayState);

playBtn.addEventListener('click', () => {
  if (video.paused) video.play();
  else video.pause();
});

video.addEventListener('timeupdate', () => {
  timeDisplay.textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
});

// ---------- Subtitles ----------
function addSubtitle() {
  const text = subtitleEditor.value.trim();
  if (!text) return;
  const parts = text.split(/\n\n+/);
  const newLines = [];
  parts.forEach(p => {
    const trimmed = p.trim();
    if (!trimmed) return;
    // Try to parse existing timecode
    const m = trimmed.match(/^(\d{1,2}:\d{1,2}:\d{1,2},\d{3})\s*-->\s*(\d{1,2}:\d{1,2}:\d{1,2},\d{3})\s*$/);
    if (m) {
      const start = parseTime(m[1]);
      const end = parseTime(m[2]);
      if (!isNaN(start) && !isNaN(end)) {
        newLines.push({ id: state.nextId++, start, end, text: trimmed.replace(/^.*-->\s*/, '').trim() });
        return;
      }
    }
    // Auto-generate timecodes
    const start = (state.subtitles.length > 0 ? state.subtitles[state.subtitles.length - 1].end : 0) + 1;
    const end = start + 3;
    newLines.push({ id: state.nextId++, start, end, text: trimmed });
  });
  state.subtitles.push(...newLines);
  renderSubtitles();
  subtitleEditor.value = '';
  showToast(`Added ${newLines.length} ${newLines.length === 1 ? 'line' : 'lines'}`);
}

addLineBtn.addEventListener('click', addSubtitle);

togglePlayBtn.addEventListener('click', () => {
  if (video.paused) video.play();
  else video.pause();
});

// ---------- Render ----------
function renderSubtitles() {
  const lines = state.subtitles.map(l => ({
    ...l,
    text: parseTextLine(l.text),
  }));
  emptyState.style.display = lines.length === 0 ? 'block' : 'none';
  lineCount.textContent = `${lines.length} line${lines.length === 1 ? '' : 's'}`;
  subtitleList.innerHTML = lines.map((l, i) => `
    <div class="subtitle-line" data-id="${l.id}">
      <span class="time">${fmtTime(l.start)} → ${fmtTime(l.end)}</span>
      <span class="text">${escapeVTT(l.text)}</span>
      <span class="del" title="Delete">✕</span>
      <span class="edit" title="Edit">✎</span>
    </div>
  `).join('');

  subtitleList.querySelectorAll('.del').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.parentElement.dataset.id);
      state.subtitles = state.subtitles.filter(s => s.id !== id);
      renderSubtitles();
      showToast('Line deleted');
    });
  });

  subtitleList.querySelectorAll('.edit').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.parentElement.dataset.id);
      const line = state.subtitles.find(s => s.id === id);
      if (!line) return;
      const newText = prompt('Edit subtitle:', line.text);
      if (newText !== null) {
        line.text = newText;
        renderSubtitles();
        showToast('Line updated');
      }
    });
  });
}

// ---------- Style ----------
['fontFamily', 'fontSize', 'fontColor', 'bgColor', 'lineHeight'].forEach(id => {
  $('id').addEventListener('input', e => {
    state.style[id] = e.target.value;
    renderSubtitles();
  });
});

// ---------- Export ----------
function exportVTT() {
  if (state.subtitles.length === 0) {
    showToast('No subtitles to export');
    return;
  }
  const header = `WEBVTT\n\n`;
  const body = state.subtitles.map(l => {
    const text = parseTextLine(l.text);
    return `${fmtTime(l.start)} --> ${fmtTime(l.end)}\n${escapeVTT(text)}\n`;
  }).join('\n');
  const blob = new Blob([header + body], { type: 'text/vtt;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `subtitles.vtt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('VTT exported');
}

exportBtn.addEventListener('click', exportVTT);

// ---------- Merge Video ----------
async function mergeVideo() {
  if (state.subtitles.length === 0) {
    showToast('Add subtitles first');
    return;
  }
  if (!video.src) {
    showToast('Upload a video first');
    return;
  }
  if (video.duration === Infinity || video.duration === 0) {
    showToast('Video duration unavailable');
    return;
  }

  // Build WebVTT track
  const header = `WEBVTT\n\n`;
  const body = state.subtitles.map(l => {
    const text = parseTextLine(l.text);
    return `${fmtTime(l.start)} --> ${fmtTime(l.end)}\n${escapeVTT(text)}\n`;
  }).join('\n');
  const vttBlob = new Blob([header + body], { type: 'text/vtt;charset=utf-8' });
  const vttUrl = URL.createObjectURL(vttBlob);

  // Create merged WebM using MediaRecorder (simulated)
  try {
    const stream = video.captureStream && video.captureStream ? video.captureStream() : video.mozCaptureStream();
    if (!stream) throw new Error('Media stream not available');

    const mime = navigator.mediaDevices && navigator.mediaDevices.getSupportedConstraints && navigator.mediaDevices.getSupportedConstraints().encoderConfig
      ? 'video/webm;codecs=vp9,opus'
      : 'video/webm';

    const options = { mimeType: mime, bitsPerSecond: 2000000 };
    const recorder = new MediaRecorder(stream, options);

    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

    const tracks = stream.getVideoTracks();
    const track = tracks[0] || tracks[1] || null;
    const trackLabel = track ? track.label : 'unknown';

    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `video-${trackLabel}.webm`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Merged video exported');
    };

    // Start recording
    recorder.start();
    await new Promise(r => setTimeout(r, 500));

    // Simulate adding subtitles as a WebVTT track via cue API
    video.textTracks && video.textTracks.forEach(t => t.mode = 'showing');

    // Stop after a short clip
    setTimeout(() => {
      recorder.stop();
    }, 10000);
  } catch (err) {
    showToast('Merge failed: ' + err.message);
  }
}

mergeBtn.addEventListener('click', mergeVideo);

// ---------- Keyboard shortcuts ----------
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    addSubtitle();
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Enter') {
    e.preventDefault();
    togglePlayBtn.click();
  }
});

// ---------- Upload ----------
const dropZone = document.querySelector('.editor-panel');
['dragenter', 'dragover'].forEach(ev => {
  dropZone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    dropZone.style.borderColor = 'var(--accent)';
  });
});
['dragleave', 'drop'].forEach(ev => {
  dropZone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    dropZone.style.borderColor = '';
  });
});
dropZone.addEventListener('drop', e => {
  const files = e.dataTransfer.files;
  if (files.length) handleFile(files[0]);
});
['change'].forEach(ev => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/*';
  input.multiple = false;
  input.addEventListener('change', e => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });
  dropZone.appendChild(input);
  input.click();
});

function handleFile(file) {
  if (!file.type.startsWith('video/')) {
    showToast('Please upload a video file');
    return;
  }
  const url = URL.createObjectURL(file);
  video.src = url;
  video.load();
  showToast(`Loaded ${file.name}`);
}
</script>
</body>
</html>
