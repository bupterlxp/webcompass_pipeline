<html>
<head>
    <title>Restaurant Menu System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .menu-img { width: 100%; height: 200px; object-fit: cover; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Gourmet Restaurant</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Customer View</a>
                <a class="nav-link" href="/chef">Chef Portal</a>
                <a class="nav-link" href="/manager">Manager Portal</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
